---
# yamllint disable rule:line-length
# Factual inputs are empty and fail closed until reviewed gates are wired.
detection_forwarder_artifact: {}
detection_forwarder_download_auth_path: null
detection_forwarder_profile: ""
detection_forwarder_inputs: []
detection_forwarder_bootstrap_contract: {}
detection_splunk_receiver_host: ""
detection_splunk_receiver_port: 9997

# Test-only filesystem indirection. Production requires both values below to
# remain at their defaults; canonical logical source paths are always validated.
detection_forwarder_fixture_mode: false
detection_forwarder_fixture_root: ""

# Port 9997 is plaintext Splunk-to-Splunk TCP: no transport confidentiality or
# peer authentication. Guest firewall isolation limits, but does not encrypt,
# this exposure.
detection_forwarder_artifact_path: /var/cache/detection-engineering/splunkforwarder.deb
detection_forwarder_inputs_path: /opt/splunkforwarder/etc/apps/detection_forwarder/local/inputs.conf
detection_forwarder_outputs_path: /opt/splunkforwarder/etc/apps/detection_forwarder/local/outputs.conf
detection_forwarder_seed_path: /opt/splunkforwarder/etc/system/local/user-seed.conf
detection_forwarder_marker_path: /var/lib/detection-engineering/forwarder-bootstrap.yml
detection_forwarder_transaction_path: /var/lib/detection-engineering/forwarder-bootstrap-in-progress.yml
detection_forwarder_provenance_path: /etc/detection-engineering/forwarder-install-provenance.yml
detection_forwarder_unit_path: /etc/systemd/system/SplunkForwarder.service
detection_forwarder_service_name: SplunkForwarder.service
detection_forwarder_service_user: splunkfwd
detection_forwarder_service_group: splunkfwd

detection_forwarder_dpkg: /usr/bin/dpkg
detection_forwarder_dpkg_query: /usr/bin/dpkg-query
detection_forwarder_dpkg_deb: /usr/bin/dpkg-deb
detection_forwarder_cli: /opt/splunkforwarder/bin/splunk
detection_forwarder_systemctl: /usr/bin/systemctl
detection_forwarder_id: /usr/bin/id
detection_forwarder_runuser: /usr/sbin/runuser
detection_forwarder_python: /usr/bin/python3

detection_forwarder_file_owner: splunkfwd
detection_forwarder_file_group: splunkfwd
detection_forwarder_root_owner: root
detection_forwarder_root_group: root
