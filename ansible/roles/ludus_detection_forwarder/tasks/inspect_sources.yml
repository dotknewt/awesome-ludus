---
- name: Inspect all canonical producer files before mutation
  ansible.builtin.stat:
    path: "{{ _detection_forwarder_root }}{{ item.path }}"
  loop: "{{ detection_forwarder_inputs }}"
  register: _detection_forwarder_source_stats

- name: Refuse absent or nonregular canonical producer files
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: Canonical producer output must already exist as a regular file
  loop: "{{ _detection_forwarder_source_stats.results }}"
  loop_control:
    label: "{{ item.item.path }}"
