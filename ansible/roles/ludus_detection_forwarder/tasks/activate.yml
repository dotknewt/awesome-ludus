---
- name: Validate all forwarder activation contracts before target mutation
  ansible.builtin.include_tasks: validate.yml

- name: Independently inspect protected package account and lifecycle state
  ansible.builtin.include_tasks: inspect.yml

- name: Refuse activation unless package preparation is complete
  ansible.builtin.assert:
    that:
      - _detection_forwarder_package_is_installed
      - _detection_forwarder_provenance_stat.exists
    fail_msg: >-
      Activation requires prepared selected package provenance and account
      state

- name: Prove canonical producer files exist before bootstrap mutation
  ansible.builtin.include_tasks: inspect_sources.yml

- name: Prove every source readable before bootstrap mutation
  ansible.builtin.include_tasks: access.yml

- name: Bootstrap the already prepared Universal Forwarder
  ansible.builtin.include_tasks: bootstrap.yml

- name: Converge profile configuration and service
  ansible.builtin.include_tasks: configure.yml
