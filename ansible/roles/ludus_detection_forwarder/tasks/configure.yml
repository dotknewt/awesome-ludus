---
# yamllint disable rule:line-length
- name: Create profile application configuration directory
  ansible.builtin.file:
    path: "{{ _detection_forwarder_root }}{{ detection_forwarder_inputs_path | dirname }}"
    state: directory
    owner: "{{ detection_forwarder_file_owner }}"
    group: "{{ detection_forwarder_file_group }}"
    mode: "0750"

- name: Render exact V1 profile inputs and receiver
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ _detection_forwarder_root }}{{ item.dest }}"
    owner: "{{ detection_forwarder_file_owner }}"
    group: "{{ detection_forwarder_file_group }}"
    mode: "0640"
  loop:
    - {src: inputs.conf.j2, dest: "{{ detection_forwarder_inputs_path }}"}
    - {src: outputs.conf.j2, dest: "{{ detection_forwarder_outputs_path }}"}
  notify: Restart Universal Forwarder

- name: Apply configuration only after bootstrap unit and readability proofs
  ansible.builtin.meta: flush_handlers

- name: Inspect Universal Forwarder enablement
  ansible.builtin.command:
    argv: ["{{ detection_forwarder_systemctl }}", is-enabled, "{{ detection_forwarder_service_name }}"]
  register: _detection_forwarder_enabled
  changed_when: false
  failed_when: false

- name: Enable Universal Forwarder service
  ansible.builtin.command:
    argv: ["{{ detection_forwarder_systemctl }}", enable, "{{ detection_forwarder_service_name }}"]
  when: _detection_forwarder_enabled.rc != 0
  changed_when: true

- name: Inspect Universal Forwarder service state
  ansible.builtin.command:
    argv: ["{{ detection_forwarder_systemctl }}", is-active, "{{ detection_forwarder_service_name }}"]
  register: _detection_forwarder_active
  changed_when: false
  failed_when: false

- name: Start Universal Forwarder service
  ansible.builtin.command:
    argv: ["{{ detection_forwarder_systemctl }}", start, "{{ detection_forwarder_service_name }}"]
  when: _detection_forwarder_active.rc != 0
  changed_when: true
