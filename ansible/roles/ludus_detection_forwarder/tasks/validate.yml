---
# yamllint disable rule:line-length
- name: Validate top-level forwarder inputs and fixture boundary
  ansible.builtin.assert:
    that:
      - range_id is defined and range_id is string and range_id | length > 0
      - detection_forwarder_profile in ['gitlab', 'runner', 'workload']
      - detection_forwarder_inputs | type_debug == 'list'
      - detection_forwarder_artifact is mapping
      - detection_forwarder_bootstrap_contract is mapping
      - detection_splunk_receiver_host == range_id ~ '-splunk'
      - detection_splunk_receiver_port | type_debug == 'int'
      - detection_splunk_receiver_port == 9997
      - detection_forwarder_service_user == 'splunkfwd'
      - detection_forwarder_service_group == 'splunkfwd'
      - detection_forwarder_inputs_path == '/opt/splunkforwarder/etc/apps/detection_forwarder/local/inputs.conf'
      - detection_forwarder_outputs_path == '/opt/splunkforwarder/etc/apps/detection_forwarder/local/outputs.conf'
      - detection_forwarder_seed_path == '/opt/splunkforwarder/etc/system/local/user-seed.conf'
      - detection_forwarder_marker_path == '/var/lib/detection-engineering/forwarder-bootstrap.yml'
      - detection_forwarder_transaction_path == '/var/lib/detection-engineering/forwarder-bootstrap-in-progress.yml'
      - detection_forwarder_provenance_path == '/etc/detection-engineering/forwarder-install-provenance.yml'
      - detection_forwarder_unit_path == '/etc/systemd/system/SplunkForwarder.service'
      - detection_forwarder_service_name == 'SplunkForwarder.service'
      - detection_forwarder_fixture_mode is boolean
      - (not detection_forwarder_fixture_mode and detection_forwarder_fixture_root == '') or (detection_forwarder_fixture_mode and detection_forwarder_fixture_root is match('^/tmp/.+'))
      - not detection_forwarder_fixture_mode or detection_forwarder_artifact_path is match('^/tmp/.+')
      - not detection_forwarder_fixture_mode or detection_forwarder_dpkg is match('^/tmp/.+')
      - not detection_forwarder_fixture_mode or detection_forwarder_dpkg_query is match('^/tmp/.+')
      - not detection_forwarder_fixture_mode or detection_forwarder_dpkg_deb is match('^/tmp/.+')
      - not detection_forwarder_fixture_mode or detection_forwarder_cli is match('^/tmp/.+')
      - not detection_forwarder_fixture_mode or detection_forwarder_systemctl is match('^/tmp/.+')
      - not detection_forwarder_fixture_mode or detection_forwarder_id is match('^/tmp/.+')
      - not detection_forwarder_fixture_mode or detection_forwarder_runuser is match('^/tmp/.+')
      - not detection_forwarder_fixture_mode or detection_forwarder_python is match('^/tmp/.+')
      - detection_forwarder_fixture_mode or detection_forwarder_artifact_path == '/var/cache/detection-engineering/splunkforwarder.deb'
      - detection_forwarder_fixture_mode or detection_forwarder_dpkg == '/usr/bin/dpkg'
      - detection_forwarder_fixture_mode or detection_forwarder_dpkg_query == '/usr/bin/dpkg-query'
      - detection_forwarder_fixture_mode or detection_forwarder_dpkg_deb == '/usr/bin/dpkg-deb'
      - detection_forwarder_fixture_mode or detection_forwarder_cli == '/opt/splunkforwarder/bin/splunk'
      - detection_forwarder_fixture_mode or detection_forwarder_systemctl == '/usr/bin/systemctl'
      - detection_forwarder_fixture_mode or detection_forwarder_id == '/usr/bin/id'
      - detection_forwarder_fixture_mode or detection_forwarder_runuser == '/usr/sbin/runuser'
      - detection_forwarder_fixture_mode or detection_forwarder_python == '/usr/bin/python3'
      - detection_forwarder_fixture_mode or detection_forwarder_file_owner == 'splunkfwd'
      - detection_forwarder_fixture_mode or detection_forwarder_file_group == 'splunkfwd'
      - detection_forwarder_fixture_mode or detection_forwarder_root_owner == 'root'
      - detection_forwarder_fixture_mode or detection_forwarder_root_group == 'root'
    fail_msg: Forwarder top-level contract or isolated fixture boundary is invalid

- name: Validate checksum-pinned Universal Forwarder artifact identity
  ansible.builtin.assert:
    that:
      - detection_forwarder_artifact.keys() | sort == ['build', 'download_auth_required', 'sha256', 'url', 'version']
      - detection_forwarder_artifact.version is string and detection_forwarder_artifact.version | length > 0
      - detection_forwarder_artifact.build is string and detection_forwarder_artifact.build | length > 0
      - detection_forwarder_artifact.url is match('^https://[^?#]+/splunkforwarder-[^/?#]+-linux-amd64\\.deb$')
      - detection_forwarder_artifact.version in (detection_forwarder_artifact.url | basename)
      - detection_forwarder_artifact.build in (detection_forwarder_artifact.url | basename)
      - detection_forwarder_artifact.sha256 is match('^[0-9a-f]{64}$')
      - detection_forwarder_artifact.download_auth_required is boolean
      - not detection_forwarder_artifact.download_auth_required or detection_forwarder_download_auth_path is string
      - not detection_forwarder_artifact.download_auth_required or detection_forwarder_download_auth_path | length > 0
    fail_msg: Refusing mutation without exact verified UF artifact facts

- name: Define exact role-owned selected-version bootstrap assumptions
  ansible.builtin.set_fact:
    _detection_forwarder_expected_bootstrap_observation:
      version: "{{ detection_forwarder_artifact.version }}"
      build: "{{ detection_forwarder_artifact.build }}"
      seed:
        path: /opt/splunkforwarder/etc/system/local/user-seed.conf
        section: user_info
        username_key: USERNAME
        username: admin
        password_key: PASSWORD
        mode: "0600"
        owner: splunkfwd
        group: splunkfwd
      first_start:
        identity: splunkfwd
        argv: [start, --accept-license, --answer-yes, --no-prompt]
      boot_start:
        identity: root
        argv: [enable, boot-start, -user, splunkfwd, --accept-license, --answer-yes, --no-prompt]
      unit:
        path: /etc/systemd/system/SplunkForwarder.service
        service_name: SplunkForwarder.service
        effective_user: splunkfwd

- name: Validate selected-version bootstrap capability gate
  ansible.builtin.assert:
    that:
      - detection_forwarder_bootstrap_contract.keys() | sort == ['limitation', 'observed', 'source', 'status', 'stops']
      - detection_forwarder_bootstrap_contract.status == 'VERIFIED'
      - detection_forwarder_bootstrap_contract.stops == [4, 8, 9, 10]
      - detection_forwarder_bootstrap_contract.source.keys() | sort == ['observed_at', 'url']
      - detection_forwarder_bootstrap_contract.source.url is match('^https://')
      - detection_forwarder_bootstrap_contract.source.observed_at is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$')
      - detection_forwarder_bootstrap_contract.limitation is string and detection_forwarder_bootstrap_contract.limitation | length > 0
      - detection_forwarder_bootstrap_contract.observed is mapping
      - detection_forwarder_bootstrap_contract.observed == _detection_forwarder_expected_bootstrap_observation
    fail_msg: Selected-version UF first-start/license/boot-start capability is unknown

- name: Build canonical exact V1 common inputs
  ansible.builtin.set_fact:
    _detection_forwarder_common_inputs:
      - {path: /var/log/auth.log, index: de_linux, sourcetype: 'linux:auth', safe_fields: ['_time', host, source, sourcetype, message]}
      - {path: /var/log/syslog, index: de_linux, sourcetype: 'linux:system', safe_fields: ['_time', host, source, sourcetype, message]}
      - {path: /var/log/laurel/audit.log, index: de_linux, sourcetype: 'linux:audit:laurel', safe_fields: ['_time', host, source, sourcetype]}

- name: Initialize profiles without V1 additions
  ansible.builtin.set_fact:
    _detection_forwarder_profile_inputs: []
  when: detection_forwarder_profile in ['gitlab', 'workload']

- name: Build canonical runner additions
  ansible.builtin.set_fact:
    _detection_forwarder_profile_inputs:
      - {path: /var/log/detection-engineering/runner-registration.jsonl, index: de_runner, sourcetype: 'gitlab:runner:registration', safe_fields: ['_time', host, source, sourcetype, message]}
  when: detection_forwarder_profile == 'runner'

- name: Require exact canonical complete profile inputs
  ansible.builtin.assert:
    that:
      - detection_forwarder_inputs == _detection_forwarder_common_inputs + _detection_forwarder_profile_inputs
    fail_msg: Inputs must equal the complete canonical source set; arbitrary paths and omissions are refused

- name: Derive isolated execution paths after logical validation
  ansible.builtin.set_fact:
    _detection_forwarder_root: "{{ detection_forwarder_fixture_root if detection_forwarder_fixture_mode else '' }}"
    _detection_forwarder_expected_package:
      name: splunkforwarder
      version: "{{ detection_forwarder_artifact.version }}"
      build: "{{ detection_forwarder_artifact.build }}"
      architecture: amd64
      sha256: "{{ detection_forwarder_artifact.sha256 }}"
