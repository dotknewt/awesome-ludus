---
- name: Prove every producer-owned source readable as actual nonroot UF identity
  ansible.builtin.command:
    argv:
      - "{{ detection_forwarder_runuser }}"
      - --user
      - "{{ detection_forwarder_service_user }}"
      - --
      - test
      - -r
      - "{{ _detection_forwarder_root }}{{ item.path }}"
  loop: "{{ detection_forwarder_inputs }}"
  changed_when: false
