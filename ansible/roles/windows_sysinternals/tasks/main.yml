---
- name: Assert that host is a supported Operating System
  ansible.builtin.assert:
    that: >
      ansible_distribution is search("Microsoft Windows Server 2016") or
      ansible_distribution is search("Microsoft Windows Server 2019") or
      ansible_distribution is search("Microsoft Windows Server 2022") or
      ansible_distribution is search("Microsoft Windows 10") or
      ansible_distribution is search("Microsoft Windows 11")
    msg: "{{ ansible_distribution }} is not a supported Operating System for this role."
    quiet: true

# Role-owned completion marker, written only after a successful extraction, so
# an interrupted extraction is retried on the next run.
- name: Check for a completed Sysinternals installation
  ansible.windows.win_stat:
    path: '{{ sysinternals_install_dir }}\.windows_sysinternals_installed'
  register: windows_sysinternals_marker

- name: Download and extract the Sysinternals suite
  when: not windows_sysinternals_marker.stat.exists or sysinternals_update | bool
  block:
    - name: Create a staging directory
      ansible.windows.win_tempfile:
        state: directory
        suffix: sysinternals
      register: windows_sysinternals_staging

    - name: Download the Sysinternals suite
      ansible.windows.win_get_url:
        url: "{{ sysinternals_suite_url }}"
        dest: '{{ windows_sysinternals_staging.path }}\SysinternalsSuite.zip'
        checksum: "{{ sysinternals_suite_sha256 if sysinternals_suite_sha256 | length > 0 else omit }}"
        checksum_algorithm: "{{ 'sha256' if sysinternals_suite_sha256 | length > 0 else omit }}"
        force: true

    - name: Ensure the install directory exists
      ansible.windows.win_file:
        path: "{{ sysinternals_install_dir }}"
        state: directory

    - name: Extract the Sysinternals suite
      community.windows.win_unzip:
        src: '{{ windows_sysinternals_staging.path }}\SysinternalsSuite.zip'
        dest: "{{ sysinternals_install_dir }}"

    - name: Record the completed installation
      ansible.windows.win_copy:
        content: "{{ sysinternals_suite_url }}\n"
        dest: '{{ sysinternals_install_dir }}\.windows_sysinternals_installed'
  always:
    - name: Remove the staging directory
      when: windows_sysinternals_staging.path is defined
      ansible.windows.win_file:
        path: "{{ windows_sysinternals_staging.path }}"
        state: absent
      changed_when: false

- name: Add the install directory to the machine PATH
  when: sysinternals_add_to_path | bool
  ansible.windows.win_path:
    elements: "{{ sysinternals_install_dir }}"
    scope: machine
    state: present

# Tools read the global HKCU\Software\Sysinternals\EulaAccepted value. Write it
# to the Default profile (future users) and every existing user profile.
- name: Pre-accept the Sysinternals EULA for existing and future users
  when: sysinternals_accept_eula | bool
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $users = [Microsoft.Win32.Registry]::Users

      # Uses .NET keys closed in finally so no handle keeps a mounted hive open.
      function Set-EulaAccepted {
          param([string]$HiveName)
          $key = $users.CreateSubKey("$HiveName\Software\Sysinternals")
          try {
              if ($key.GetValue('EulaAccepted') -ne 1) {
                  $key.SetValue('EulaAccepted', 1, [Microsoft.Win32.RegistryValueKind]::DWord)
                  $Ansible.Changed = $true
              }
          } finally {
              $key.Close()
          }
      }

      function Test-HiveMounted {
          param([string]$HiveName)
          return @($users.GetSubKeyNames()) -contains $HiveName
      }

      $targets = @(
          [pscustomobject]@{ Sid = 'Default'; Hive = Join-Path $env:SystemDrive 'Users\Default\NTUSER.DAT' }
      )
      $profileList = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList'
      foreach ($key in Get-ChildItem -LiteralPath $profileList) {
          if ($key.PSChildName -notlike 'S-1-5-21-*') { continue }
          $profilePath = [Environment]::ExpandEnvironmentVariables([string]$key.GetValue('ProfileImagePath'))
          $targets += [pscustomobject]@{ Sid = $key.PSChildName; Hive = Join-Path $profilePath 'NTUSER.DAT' }
      }

      foreach ($target in $targets) {
          if ($target.Sid -ne 'Default' -and (Test-HiveMounted $target.Sid)) {
              Set-EulaAccepted -HiveName $target.Sid
              continue
          }
          if (-not (Test-Path -LiteralPath $target.Hive)) { continue }
          $mount = "AnsibleSysinternals_$($target.Sid)"
          # A mount left behind by an interrupted run is reused, then unloaded.
          if (-not (Test-HiveMounted $mount)) {
              & reg.exe load "HKU\$mount" $target.Hive | Out-Null
              if ($LASTEXITCODE -ne 0) {
                  throw "reg.exe load failed for $($target.Hive) (exit $LASTEXITCODE)"
              }
          }
          try {
              Set-EulaAccepted -HiveName $mount
          } finally {
              [gc]::Collect()
              [gc]::WaitForPendingFinalizers()
              $unloaded = $false
              for ($attempt = 1; $attempt -le 5 -and -not $unloaded; $attempt++) {
                  & reg.exe unload "HKU\$mount" | Out-Null
                  if ($LASTEXITCODE -eq 0) {
                      $unloaded = $true
                  } else {
                      Start-Sleep -Seconds 2
                  }
              }
              if (-not $unloaded) {
                  throw "reg.exe unload failed for HKU\$mount after 5 attempts"
              }
          }
      }
