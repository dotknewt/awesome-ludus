---
- name: Validate configured Splunk index names before filesystem inspection
  ansible.builtin.assert:
    that:
      - ludus_splunk_server_indexes | ludus_splunk_server_indexes_valid
    fail_msg: >-
      ludus_splunk_server_indexes must be a duplicate-free list of lowercase names
      matching [a-z][a-z0-9_]{0,79}; Splunk default and internal indexes are reserved.

- name: Inspect only index marker and app ownership paths before deciding whether full preflight is needed
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - /
    - /opt
    - /opt/splunk
    - /opt/splunk/etc
    - /opt/splunk/etc/apps
    - /opt/splunk/etc/apps/ludus_indexes
    - /opt/splunk/etc/apps/ludus_indexes/.ludus-managed.json
    - /opt/splunk/etc/apps/ludus_indexes/local
    - /opt/splunk/etc/apps/ludus_indexes/local/indexes.conf
  register: ludus_splunk_server_index_owner_path_stats

- name: Reject unsafe index ownership paths before deciding whether to scan
  ansible.builtin.assert:
    that:
      - not (item.stat.get('islnk', false) | bool)
      - >-
        not item.stat.get('exists', false)
        or (item.item in ['/opt/splunk/etc/apps/ludus_indexes/.ludus-managed.json',
                          '/opt/splunk/etc/apps/ludus_indexes/local/indexes.conf']
            and item.stat.get('isreg', false))
        or (item.item not in ['/opt/splunk/etc/apps/ludus_indexes/.ludus-managed.json',
                              '/opt/splunk/etc/apps/ludus_indexes/local/indexes.conf']
            and item.stat.get('isdir', false))
    fail_msg: Refusing symlinked or wrongly typed index ownership path.
  loop: "{{ ludus_splunk_server_index_owner_path_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Read the existing index marker when it is a real regular file
  ansible.builtin.slurp:
    src: /opt/splunk/etc/apps/ludus_indexes/.ludus-managed.json
  register: ludus_splunk_server_index_marker_contents
  when: ludus_splunk_server_index_owner_path_stats.results[6].stat.get('isreg', false)
  no_log: true

- name: Read the existing owned index config when it is a real regular file
  ansible.builtin.slurp:
    src: /opt/splunk/etc/apps/ludus_indexes/local/indexes.conf
  register: ludus_splunk_server_index_owned_config
  when: ludus_splunk_server_index_owner_path_stats.results[8].stat.get('isreg', false)
  no_log: true

- name: Require existing index app state to have an authoritative consistent marker
  ansible.builtin.assert:
    that:
      - >-
        not ludus_splunk_server_index_owner_path_stats.results[5].stat.get('exists', false)
        or (ludus_splunk_server_index_owner_path_stats.results[6].stat.get('isreg', false)
            and ludus_splunk_server_index_owner_path_stats.results[7].stat.get('isdir', false)
            and ludus_splunk_server_index_owner_path_stats.results[8].stat.get('isreg', false)
            and (ludus_splunk_server_index_marker_contents.content | b64decode
                 | ludus_splunk_server_index_marker_matches_config(
                     ludus_splunk_server_index_owned_config.content | b64decode)))
      - >-
        not ludus_splunk_server_index_owner_path_stats.results[6].stat.get('exists', false)
        or ludus_splunk_server_index_owner_path_stats.results[5].stat.get('isdir', false)
    fail_msg: >-
      Refusing unmanaged, partial, or inconsistent ludus_indexes app state. Preserve
      the files and reconcile marker/config schema explicitly; no files were changed.

- name: Require the requested list to retain every previously managed index
  ansible.builtin.assert:
    that:
      - ludus_splunk_server_index_marker_contents.content | b64decode
        | ludus_splunk_server_index_marker_allows_append(ludus_splunk_server_indexes)
    fail_msg: >-
      Removing a previously managed index is unsupported, including setting the
      requested list to []; preserve the owned indexes and append only.
  when: ludus_splunk_server_index_owner_path_stats.results[6].stat.get('exists', false)

- name: Inspect index app paths and fixed data roots for nonempty index requests only
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: >-
    {{ ['/opt/splunk/etc/apps/ludus_indexes',
        '/opt/splunk/etc/apps/ludus_indexes/.ludus-managed.json',
        '/opt/splunk/etc/apps/ludus_indexes/local',
        '/opt/splunk/etc/apps/ludus_indexes/local/indexes.conf',
        '/opt/splunk/var','/opt/splunk/var/lib','/opt/splunk/var/lib/splunk']
       + (ludus_splunk_server_indexes | map('regex_replace', '^', '/opt/splunk/var/lib/splunk/') | list)
       + (ludus_splunk_server_indexes | map('regex_replace', '^', '/opt/splunk/var/lib/splunk/')
          | map('regex_replace', '$', '/db') | list)
       + (ludus_splunk_server_indexes | map('regex_replace', '^', '/opt/splunk/var/lib/splunk/')
          | map('regex_replace', '$', '/colddb') | list)
       + (ludus_splunk_server_indexes | map('regex_replace', '^', '/opt/splunk/var/lib/splunk/')
          | map('regex_replace', '$', '/thaweddb') | list) }}
  register: ludus_splunk_server_index_path_stats
  when: ludus_splunk_server_indexes | length > 0

- name: Reject symlinked or wrongly typed opted-in index and data paths
  ansible.builtin.assert:
    that:
      - not (item.stat.get('islnk', false) | bool)
      - >-
        not item.stat.get('exists', false)
        or (item.item in ['/opt/splunk/etc/apps/ludus_indexes/.ludus-managed.json',
                          '/opt/splunk/etc/apps/ludus_indexes/local/indexes.conf']
            and item.stat.get('isreg', false))
        or (item.item not in ['/opt/splunk/etc/apps/ludus_indexes/.ludus-managed.json',
                              '/opt/splunk/etc/apps/ludus_indexes/local/indexes.conf']
            and item.stat.get('isdir', false))
    fail_msg: >-
      Refusing symlinked or wrongly typed index app, ancestor, or data path; inspect
      and reconcile the path explicitly.
  loop: "{{ ludus_splunk_server_index_path_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: ludus_splunk_server_indexes | length > 0

- name: Find every symlink under Splunk configuration without following it
  ansible.builtin.find:
    paths: /opt/splunk/etc
    recurse: true
    file_type: link
    follow: false
  register: ludus_splunk_server_index_symlinked_paths
  when:
    - ludus_splunk_server_indexes | length > 0
    - ludus_splunk_server_index_owner_path_stats.results[3].stat.get('isdir', false)

- name: Reject symlinks or incomplete traversal anywhere under Splunk configuration
  ansible.builtin.assert:
    that:
      - ludus_splunk_server_index_symlinked_paths.files | default([]) | length == 0
      - ludus_splunk_server_index_symlinked_paths.skipped_paths | default({}) | length == 0
    fail_msg: >-
      Refusing symlinked or incompletely inspected paths under /opt/splunk/etc;
      reconcile the tree before managing indexes.
  when:
    - ludus_splunk_server_indexes | length > 0
    - ludus_splunk_server_index_owner_path_stats.results[3].stat.get('isdir', false)

- name: Find all regular indexes.conf definitions without following links
  ansible.builtin.find:
    paths: /opt/splunk/etc
    patterns: indexes.conf
    recurse: true
    file_type: file
    follow: false
  register: ludus_splunk_server_index_existing_configs
  when:
    - ludus_splunk_server_indexes | length > 0
    - ludus_splunk_server_index_owner_path_stats.results[3].stat.get('isdir', false)

- name: Reject incomplete indexes.conf discovery
  ansible.builtin.assert:
    that:
      - ludus_splunk_server_index_existing_configs.skipped_paths | default({}) | length == 0
    fail_msg: Unable to inspect every indexes.conf under /opt/splunk/etc; refusing index changes.
  when:
    - ludus_splunk_server_indexes | length > 0
    - ludus_splunk_server_index_owner_path_stats.results[3].stat.get('isdir', false)

- name: Read discovered index configuration files for conflict checks
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ ludus_splunk_server_index_existing_configs.files | default([]) }}"
  register: ludus_splunk_server_index_existing_config_contents
  when:
    - ludus_splunk_server_indexes | length > 0
    - ludus_splunk_server_index_owner_path_stats.results[3].stat.get('isdir', false)
  no_log: true

- name: Reject malformed configs, conflicting index definitions, or extra owned-app configs
  ansible.builtin.assert:
    that:
      - item.content | b64decode | ludus_splunk_server_index_config_parseable
      - >-
        (ludus_splunk_server_indexes
         | intersect(item.content | b64decode | ludus_splunk_server_index_stanzas)
         | length) == 0
      - >-
        not item.item.path.startswith('/opt/splunk/etc/apps/ludus_indexes/')
        or item.item.path == '/opt/splunk/etc/apps/ludus_indexes/local/indexes.conf'
    fail_msg: >-
      A competing indexes.conf is malformed, defines a requested name, or adds an
      unexpected index config inside the owned app. Reconcile explicitly first.
  loop: "{{ ludus_splunk_server_index_existing_config_contents.results | default([]) }}"
  when:
    - ludus_splunk_server_indexes | length > 0
    - item.item.path != '/opt/splunk/etc/apps/ludus_indexes/local/indexes.conf'
  no_log: true

- name: Reject pre-existing requested data directories not recorded as owned indexes
  ansible.builtin.assert:
    that:
      - >-
        not item.stat.get('exists', false)
        or (ludus_splunk_server_index_owner_path_stats.results[6].stat.get('exists', false)
            and (ludus_splunk_server_index_marker_contents.content | b64decode
                 | ludus_splunk_server_index_marker_matches_config(
                     ludus_splunk_server_index_owned_config.content | b64decode))
            and (item.item | regex_replace('^/opt/splunk/var/lib/splunk/', '')
                 | regex_replace('/.*$', '')) in
                (ludus_splunk_server_index_marker_contents.content | b64decode | from_json).indexes)
    fail_msg: >-
      A requested index data directory already exists without matching authoritative
      ownership metadata; inspect it and explicitly reconcile before retrying.
  loop: "{{ ludus_splunk_server_index_path_stats.results[7:] | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: ludus_splunk_server_indexes | length > 0
