---
# Static-only syntax harness. Do not execute as a deployment playbook.
- name: Parse the native Splunk server role entrypoint
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Prevent accidental role execution
      ansible.builtin.fail:
        msg: This playbook is for --syntax-check only; do not run it normally.
  roles:
    - role: ludus_splunk_server
  vars:
    # Syntax-check inputs only; package settings inherit the role's pinned defaults.
    ludus_splunk_server_accept_license: true
    ludus_splunk_server_admin_password: "Syntax-Only-Password1!"
