---
# Static-only syntax harness. Do not execute as a deployment playbook.
- name: Parse the Docker installation role entrypoint
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Prevent accidental role execution
      ansible.builtin.fail:
        msg: This playbook is for --syntax-check only; do not run it normally.
  roles:
    - role: ludus_install_docker
  vars:
    ludus_install_docker_user: debian
