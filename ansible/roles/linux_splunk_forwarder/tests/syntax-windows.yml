---
- name: Parse the real collector entrypoint for Windows without executing it
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Stop before role tasks during ordinary execution
      ansible.builtin.fail:
        msg: This play is for ansible-playbook --syntax-check only.
  vars:
    ludus_splunk_collector_accept_license: true
    ludus_splunk_collector_admin_username: admin
    ludus_splunk_collector_admin_password: Syntax-Only-Password-123!
    ludus_splunk_collector_receiver_host: 127.0.0.1
    ludus_splunk_collector_receiver_port: 9997
  roles:
    - role: ludus_splunk_collector
