---
- name: Restart forwarder after owned configuration changes
  become: true
  ansible.builtin.systemd_service:
    name: SplunkForwarder.service
    state: restarted
  when:
    - ludus_splunk_collector_preflight_active.stdout | default('inactive') == 'active'
    - not (ludus_splunk_collector_capability_policy.changed | default(false))

- name: Restart Windows forwarder after managed configuration changes
  ansible.windows.win_service:
    name: SplunkForwarder
    state: restarted
  when:
    - ludus_splunk_collector_windows_phase | default('absent') == 'ready'
    - ludus_splunk_collector_windows_inspection.result.service_state | default('') == 'Running'
