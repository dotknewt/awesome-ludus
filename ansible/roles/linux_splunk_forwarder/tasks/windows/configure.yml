---
- name: Guard managed Windows paths after MSI installation
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $ErrorActionPreference = 'Stop'
      $managedPaths = @(
        @{ path = 'C:\'; kind = 'Directory' },
        @{ path = 'C:\ProgramData'; kind = 'Directory' },
        @{ path = 'C:\ProgramData\Ludus'; kind = 'Directory' },
        @{ path = 'C:\ProgramData\Ludus\SplunkCollector'; kind = 'Directory' },
        @{ path = 'C:\ProgramData\Ludus\SplunkCollector\staging'; kind = 'Directory' },
        @{ path = 'C:\ProgramData\Ludus\SplunkCollector\ownership.json'; kind = 'File' },
        @{ path = 'C:\ProgramData\Ludus\SplunkCollector\staging\splunkforwarder.msi'; kind = 'File' },
        @{ path = 'C:\Program Files'; kind = 'Directory' },
        @{ path = 'C:\Program Files\SplunkUniversalForwarder'; kind = 'Directory' },
        @{ path = 'C:\Program Files\SplunkUniversalForwarder\bin'; kind = 'Directory' },
        @{ path = 'C:\Program Files\SplunkUniversalForwarder\bin\splunkd.exe'; kind = 'File' },
        @{ path = 'C:\Program Files\SplunkUniversalForwarder\etc'; kind = 'Directory' },
        @{ path = 'C:\Program Files\SplunkUniversalForwarder\etc\passwd'; kind = 'File' },
        @{ path = 'C:\Program Files\SplunkUniversalForwarder\etc\system'; kind = 'Directory' },
        @{ path = 'C:\Program Files\SplunkUniversalForwarder\etc\system\default'; kind = 'Directory' },
        @{ path = 'C:\Program Files\SplunkUniversalForwarder\etc\system\local'; kind = 'Directory' },
        @{ path = 'C:\Program Files\SplunkUniversalForwarder\etc\system\local\user-seed.conf'; kind = 'File' },
        @{ path = 'C:\Program Files\SplunkUniversalForwarder\etc\apps'; kind = 'Directory' },
        @{ path = 'C:\Program Files\SplunkUniversalForwarder\etc\apps\ludus_collector'; kind = 'Directory' },
        @{ path = 'C:\Program Files\SplunkUniversalForwarder\etc\apps\ludus_collector\local'; kind = 'Directory' },
        @{ path = 'C:\Program Files\SplunkUniversalForwarder\etc\apps\ludus_collector\local\inputs.conf'; kind = 'File' },
        @{ path = 'C:\Program Files\SplunkUniversalForwarder\etc\apps\ludus_collector\local\outputs.conf'; kind = 'File' }
      )
      $checked = 0
      foreach ($entry in $managedPaths) {
        $pathExists = Test-Path -LiteralPath $entry.path
        $item = Get-Item -LiteralPath $entry.path -Force -ErrorAction SilentlyContinue
        if ($null -eq $item) {
          if ($pathExists) { throw "Unable to inspect managed path: $($entry.path)" }
          continue
        }
        if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
          throw "Reparse point on managed path: $($entry.path)"
        }
        if (($entry.kind -eq 'Directory' -and -not $item.PSIsContainer) -or
            ($entry.kind -eq 'File' -and $item.PSIsContainer)) {
          throw "Wrong type on managed path: $($entry.path)"
        }
        $checked += 1
      }
      $Ansible.Changed = $false
      $Ansible.Result = @{ managed_paths_checked = $checked }
  changed_when: false

- name: Preflight newly installed seed path types before marker or Event Log changes
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $ErrorActionPreference = 'Stop'
      function Test-SeedPath([string]$Path, [string]$ExpectedKind) {
        if (-not (Test-Path -LiteralPath $Path)) { return $false }
        $item = Get-Item -LiteralPath $Path -Force
        if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw "Reparse seed path: $Path" }
        if (($ExpectedKind -eq 'Directory' -and -not $item.PSIsContainer) -or
            ($ExpectedKind -eq 'File' -and $item.PSIsContainer)) { throw "Wrong seed path type: $Path" }
        return $true
      }
      $parent = 'C:\Program Files\SplunkUniversalForwarder\etc\system\local'
      $seed = Join-Path $parent 'user-seed.conf'
      $parentExists = Test-SeedPath $parent 'Directory'
      if (-not $parentExists -and (Test-Path -LiteralPath $seed)) {
        throw 'Seed file exists without its parent directory.'
      }
      $seedExists = Test-SeedPath $seed 'File'
      $Ansible.Changed = $false
      $Ansible.Result = @{ parent_exists = $parentExists; seed_exists = $seedExists }
  when: >-
    ludus_splunk_collector_windows_phase == 'bootstrapPending'
    or (ludus_splunk_collector_windows_phase in ['absent', 'pending']
        and ludus_splunk_collector_windows_package is defined
        and not (ludus_splunk_collector_windows_package.skipped | default(false)))

- name: Inspect fresh Windows service account and installation path before ownership transition
  ansible.windows.win_powershell:
    error_action: stop
    parameters:
      ExpectedVersion: "{{ ludus_splunk_collector_windows_version }}"
    script: |
      param([string]$ExpectedVersion)
      $ErrorActionPreference = 'Stop'
      $service = Get-CimInstance Win32_Service -Filter "Name='SplunkForwarder'"
      if ($null -eq $service) { throw 'SplunkForwarder service was not installed.' }
      if ($service.StartName -ne 'NT SERVICE\SplunkForwarder') { throw 'Service account is not the required virtual account.' }
      $expectedExe = 'C:\Program Files\SplunkUniversalForwarder\bin\splunkd.exe'
      $servicePattern = '^(?:"{0}"|{0})(?:\s|$)' -f [regex]::Escape($expectedExe)
      if ($service.PathName -notmatch $servicePattern) {
        throw 'Service executable path is unexpected.'
      }
      $exe = Get-Item -LiteralPath $expectedExe
      $rawVersion = [string]$exe.VersionInfo.ProductVersion
      if ($rawVersion -notmatch '^(\d+\.\d+\.\d+\.\d+)(?:\s+\(Build\s+[^)\r\n]+\))?$') {
        throw 'Installed executable ProductVersion is absent or malformed.'
      }
      $executableVersion = $Matches[1]
      if (-not [string]::Equals($executableVersion, $ExpectedVersion, [StringComparison]::Ordinal)) {
        throw 'Installed executable version does not match the pinned version.'
      }
      $Ansible.Result = @{ service_account = $service.StartName; service_path = $service.PathName; product_version = $executableVersion }
  register: ludus_splunk_collector_windows_verified_service
  when: ludus_splunk_collector_windows_inspection.result.marker_exists or
        (ludus_splunk_collector_windows_package is defined and
         not (ludus_splunk_collector_windows_package.skipped | default(false)))

- name: Advance the fresh verified installation from pending to bootstrapPending
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $ErrorActionPreference = 'Stop'
      $path = 'C:\ProgramData\Ludus\SplunkCollector\ownership.json'
      $marker = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
      if ($marker.phase -ne 'pending' -or $marker.schema_version -ne 1) {
        throw 'Fresh-install ownership transition requires a newly re-read pending marker.'
      }
      $marker.phase = 'bootstrapPending'
      $marker | ConvertTo-Json -Compress | Set-Content -LiteralPath $path -Encoding UTF8
  when:
    - ludus_splunk_collector_windows_package is defined
    - not (ludus_splunk_collector_windows_package.skipped | default(false))
    - ludus_splunk_collector_windows_phase in ['absent', 'pending']

- name: Record bootstrapPending phase after verified installation
  ansible.builtin.set_fact:
    ludus_splunk_collector_windows_phase: bootstrapPending
  when:
    - ludus_splunk_collector_windows_package is defined
    - not (ludus_splunk_collector_windows_package.skipped | default(false))
    - ludus_splunk_collector_windows_phase in ['absent', 'pending']

- name: Re-read and validate the current ownership marker after installation transition
  ansible.windows.win_powershell:
    error_action: stop
    parameters:
      ExpectedVersion: "{{ ludus_splunk_collector_windows_version }}"
      ExpectedUrl: "{{ ludus_splunk_collector_windows_package_url }}"
      ExpectedChecksum: "{{ ludus_splunk_collector_windows_package_checksum }}"
    script: |
      param([string]$ExpectedVersion, [string]$ExpectedUrl, [string]$ExpectedChecksum)
      $ErrorActionPreference = 'Stop'
      $path = 'C:\ProgramData\Ludus\SplunkCollector\ownership.json'
      $marker = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json -ErrorAction Stop
      if ($marker.schema_version -ne 1 -or
          $marker.phase -notin @('bootstrapPending', 'ready') -or
          $marker.service_name -cne 'SplunkForwarder' -or
          $marker.service_account -cne 'NT SERVICE\SplunkForwarder' -or
          $marker.version -cne $ExpectedVersion -or
          $marker.artifact_version -cne $ExpectedVersion -or
          $marker.artifact_url -cne $ExpectedUrl -or
          $marker.artifact_checksum -cne $ExpectedChecksum) {
        throw 'Current ownership marker is incomplete or does not match the configured installation.'
      }
      $hashPattern = '^(?:[a-fA-F0-9]{64})?$'
      if ([string]$marker.inputs_sha256 -notmatch $hashPattern -or
          [string]$marker.outputs_sha256 -notmatch $hashPattern -or
          ($marker.phase -eq 'ready' -and
           ([string]$marker.inputs_sha256 -notmatch '^[a-fA-F0-9]{64}$' -or
            [string]$marker.outputs_sha256 -notmatch '^[a-fA-F0-9]{64}$'))) {
        throw 'Current ownership marker has invalid managed configuration hash values.'
      }
      $Ansible.Result = @{ marker = $marker }
  register: ludus_splunk_collector_windows_current_marker
  when: ludus_splunk_collector_windows_inspection.result.marker_exists or
        (ludus_splunk_collector_windows_package is defined and
         not (ludus_splunk_collector_windows_package.skipped | default(false)))

- name: Record the current validated ownership phase
  ansible.builtin.set_fact:
    ludus_splunk_collector_windows_phase: "{{ ludus_splunk_collector_windows_current_marker.result.marker.phase }}"
  when: ludus_splunk_collector_windows_current_marker is defined

- name: Preflight and add only the local virtual account Event Log READ ACEs
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $ErrorActionPreference = 'Stop'
      $sid = ([System.Security.Principal.NTAccount]'NT SERVICE\SplunkForwarder').Translate([System.Security.Principal.SecurityIdentifier])
      $names = @('Security', 'Microsoft-Windows-Sysmon/Operational')
      $silk = Get-WinEvent -ListLog 'SilkService-Log' -ErrorAction SilentlyContinue
      if ($silk) { $names += 'SilkService-Log' }
      $plans = @()
      foreach ($name in $names) {
        $log = Get-WinEvent -ListLog $name -ErrorAction Stop
        $sddl = $log.SecurityDescriptor
        if ([string]::IsNullOrWhiteSpace($sddl)) { throw "Cannot inspect channel descriptor: $name" }
        $descriptor = New-Object System.Security.AccessControl.RawSecurityDescriptor($sddl)
        foreach ($ace in $descriptor.DiscretionaryAcl) {
          if ($ace -is [System.Security.AccessControl.QualifiedAce] -and $ace.SecurityIdentifier -eq $sid -and
              $ace.AceQualifier -eq [System.Security.AccessControl.AceQualifier]::AccessDenied -and
              ($ace.AccessMask -band 1) -ne 0) { throw "Explicit READ deny for service SID on channel: $name" }
        }
        $hasRead = $false
        foreach ($ace in $descriptor.DiscretionaryAcl) {
          if ($ace -is [System.Security.AccessControl.QualifiedAce] -and $ace.SecurityIdentifier -eq $sid -and
              $ace.AceQualifier -eq [System.Security.AccessControl.AceQualifier]::AccessAllowed -and
              ($ace.AccessMask -band 1) -ne 0) { $hasRead = $true }
        }
        $plans += @{ name = $name; log = $log; descriptor = $descriptor; sddl = $sddl; add = (-not $hasRead) }
      }
      foreach ($plan in $plans) {
        if (-not $plan.add) { continue }
        $ace = New-Object System.Security.AccessControl.CommonAce(
          [System.Security.AccessControl.AceFlags]::None,
          [System.Security.AccessControl.AceQualifier]::AccessAllowed,
          1, $sid, $false, $null)
        $plan.descriptor.DiscretionaryAcl.InsertAce($plan.descriptor.DiscretionaryAcl.Count, $ace)
        $plan.log.SecurityDescriptor = $plan.descriptor.GetSddlForm([System.Security.AccessControl.AccessControlSections]::All)
        $plan.log.SaveChanges()
      }
      $Ansible.Result = @{ changed_channels = @($plans | Where-Object { $_.add } | ForEach-Object { $_.name }); silk_present = [bool]$silk }
  register: ludus_splunk_collector_windows_channel_acl

- name: Confirm the forwarder passwd state before deciding whether to seed
  ansible.windows.win_stat:
    path: C:\Program Files\SplunkUniversalForwarder\etc\passwd
    follow: false
    get_checksum: false
  register: ludus_splunk_collector_windows_passwd

- name: Require an owned bootstrap phase before creating a fresh seed
  ansible.builtin.assert:
    that:
      - ludus_splunk_collector_windows_current_marker.result.marker is defined
      - ludus_splunk_collector_windows_phase == 'bootstrapPending'
      - not ludus_splunk_collector_windows_passwd.stat.exists
    fail_msg: Existing initialized authentication or ambiguous ownership requires manual recovery; credentials were not changed.
  when: ludus_splunk_collector_windows_current_marker is not defined or
        ludus_splunk_collector_windows_phase != 'ready'

- name: Create seed parent after ownership and path preflight
  ansible.windows.win_file:
    path: C:\Program Files\SplunkUniversalForwarder\etc\system\local
    state: directory
  when:
    - ludus_splunk_collector_windows_phase == 'bootstrapPending'
    - not ludus_splunk_collector_windows_passwd.stat.exists

- name: Validate seed parent and file path types before bootstrap
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $ErrorActionPreference = 'Stop'
      $parent = 'C:\Program Files\SplunkUniversalForwarder\etc\system\local'
      $seed = Join-Path $parent 'user-seed.conf'
      foreach ($entry in @(@{ path = $parent; kind = 'Directory' }, @{ path = $seed; kind = 'File' })) {
        if (-not (Test-Path -LiteralPath $entry.path)) { continue }
        $item = Get-Item -LiteralPath $entry.path -Force
        if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
            ($entry.kind -eq 'Directory' -and -not $item.PSIsContainer) -or
            ($entry.kind -eq 'File' -and $item.PSIsContainer)) {
          throw "Unsafe seed path type/reparse: $($entry.path)"
        }
      }
      if (-not (Test-Path -LiteralPath $parent) -and (Test-Path -LiteralPath $seed)) {
        throw 'Seed file exists without its parent directory.'
      }
      $Ansible.Changed = $false
      $Ansible.Result = @{
        parent_exists = Test-Path -LiteralPath $parent
        seed_exists = Test-Path -LiteralPath $seed
      }
  when:
    - ludus_splunk_collector_windows_phase == 'bootstrapPending'
    - not ludus_splunk_collector_windows_passwd.stat.exists

- name: Create empty seed file after its parent exists
  ansible.windows.win_file:
    path: C:\Program Files\SplunkUniversalForwarder\etc\system\local\user-seed.conf
    state: touch
  when:
    - ludus_splunk_collector_windows_phase == 'bootstrapPending'
    - not ludus_splunk_collector_windows_passwd.stat.exists

- name: Recheck seed parent and file path types immediately before secret rendering
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $ErrorActionPreference = 'Stop'
      $parent = 'C:\Program Files\SplunkUniversalForwarder\etc\system\local'
      $seed = Join-Path $parent 'user-seed.conf'
      if (-not (Test-Path -LiteralPath $parent -PathType Container)) {
        throw 'Seed parent is missing or is not a directory.'
      }
      $parentItem = Get-Item -LiteralPath $parent -Force
      if (($parentItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
        throw 'Seed parent is a reparse point.'
      }
      if (-not (Test-Path -LiteralPath $seed -PathType Leaf)) {
        throw 'Seed file is missing or is not a file.'
      }
      $seedItem = Get-Item -LiteralPath $seed -Force
      if (($seedItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
        throw 'Seed file is a reparse point.'
      }
      $Ansible.Changed = $false
      $Ansible.Result = @{ parent_checked = $true; seed_checked = $true }
  when:
    - ludus_splunk_collector_windows_phase == 'bootstrapPending'
    - not ludus_splunk_collector_windows_passwd.stat.exists

- name: Write the fresh administrator seed without logging or diffs
  ansible.windows.win_template:
    src: windows-user-seed.conf.j2
    dest: C:\Program Files\SplunkUniversalForwarder\etc\system\local\user-seed.conf
  when:
    - ludus_splunk_collector_windows_phase == 'bootstrapPending'
    - not ludus_splunk_collector_windows_passwd.stat.exists
  no_log: true
  diff: false

- name: Create the role-owned Windows app directory
  ansible.windows.win_file:
    path: C:\Program Files\SplunkUniversalForwarder\etc\apps\ludus_collector\local
    state: directory

- name: Render managed Windows event inputs
  ansible.windows.win_template:
    src: windows-inputs.conf.j2
    dest: C:\Program Files\SplunkUniversalForwarder\etc\apps\ludus_collector\local\inputs.conf
  register: ludus_splunk_collector_windows_inputs
  notify: Restart Windows forwarder after managed configuration changes

- name: Render managed Windows forwarding outputs
  ansible.windows.win_template:
    src: windows-outputs.conf.j2
    dest: C:\Program Files\SplunkUniversalForwarder\etc\apps\ludus_collector\local\outputs.conf
  register: ludus_splunk_collector_windows_outputs
  notify: Restart Windows forwarder after managed configuration changes

- name: Start and enable the forwarder only after managed configuration exists
  ansible.windows.win_service:
    name: SplunkForwarder
    start_mode: auto
    state: started

- name: Wait for the forwarder authentication database to initialize before seed cleanup
  ansible.windows.win_stat:
    path: C:\Program Files\SplunkUniversalForwarder\etc\passwd
    follow: false
    get_checksum: false
  register: ludus_splunk_collector_windows_passwd_initialized
  until: >-
    ludus_splunk_collector_windows_passwd_initialized.stat.isreg | default(false)
    and ludus_splunk_collector_windows_passwd_initialized.stat.size | default(0) | int > 0
  retries: 30
  delay: 10
  when:
    - ludus_splunk_collector_windows_phase == 'bootstrapPending'
    - not ludus_splunk_collector_windows_passwd.stat.exists

- name: Assert initialized passwd database before seed removal
  ansible.builtin.assert:
    that:
      - ludus_splunk_collector_windows_passwd_initialized.stat.isreg | default(false)
      - ludus_splunk_collector_windows_passwd_initialized.stat.size | default(0) | int > 0
    fail_msg: Bootstrap did not create a nonempty regular passwd database; seed and pending marker are retained.
  when:
    - ludus_splunk_collector_windows_phase == 'bootstrapPending'
    - not ludus_splunk_collector_windows_passwd.stat.exists

- name: Remove only the fresh seed after passwd initialization
  ansible.windows.win_file:
    path: C:\Program Files\SplunkUniversalForwarder\etc\system\local\user-seed.conf
    state: absent
  when:
    - ludus_splunk_collector_windows_phase == 'bootstrapPending'
    - not ludus_splunk_collector_windows_passwd.stat.exists

- name: Flush only hash-triggered Windows configuration restarts
  ansible.builtin.meta: flush_handlers

- name: Record ready marker and managed configuration hashes
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $ErrorActionPreference = 'Stop'
      $root = 'C:\Program Files\SplunkUniversalForwarder\etc\apps\ludus_collector\local'
      $markerPath = 'C:\ProgramData\Ludus\SplunkCollector\ownership.json'
      $marker = Get-Content -LiteralPath $markerPath -Raw | ConvertFrom-Json
      if ($marker.phase -notin @('bootstrapPending', 'ready')) { throw 'Ready transition is not permitted from this ownership phase.' }
      $inputs = (Get-FileHash -LiteralPath (Join-Path $root 'inputs.conf') -Algorithm SHA256).Hash.ToLowerInvariant()
      $outputs = (Get-FileHash -LiteralPath (Join-Path $root 'outputs.conf') -Algorithm SHA256).Hash.ToLowerInvariant()
      $changed = $marker.phase -ne 'ready'
      if ($marker.inputs_sha256 -cne $inputs -or $marker.outputs_sha256 -cne $outputs) {
        $changed = $true
      }
      if ($changed) {
        $marker.inputs_sha256 = $inputs
        $marker.outputs_sha256 = $outputs
        $marker.phase = 'ready'
        $marker | ConvertTo-Json -Compress | Set-Content -LiteralPath $markerPath -Encoding UTF8
      }
      $Ansible.Changed = $changed
  when: ludus_splunk_collector_windows_phase in ['bootstrapPending', 'ready']
