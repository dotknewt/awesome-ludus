---
- name: Validate Windows platform and every role input before mutation
  ansible.builtin.import_tasks: validate.yml

- name: Inspect Windows installation, ownership, paths, and configuration conflicts
  ansible.builtin.import_tasks: inspect.yml

- name: Install the checksum-verified Windows Universal Forwarder
  ansible.builtin.import_tasks: install.yml

- name: Configure bootstrap seed, channel ACLs, and managed forwarding state
  ansible.builtin.import_tasks: configure.yml
