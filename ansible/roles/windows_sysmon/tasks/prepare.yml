---
# These task-result names are established interfaces between the included tasks.
# Temporary staging does not represent a change to the installed Sysmon state.
- name: Create Sysmon staging directory
  ansible.windows.win_tempfile:
    state: directory
  register: sysmon_dl_temp  # noqa: var-naming[no-role-prefix]
  changed_when: false

- name: Copy bundled Sysmon archive
  when: not sysmon_download_latest | bool
  ansible.windows.win_copy:
    src: "{{ role_path }}/files/sysmon.zip"
    dest: '{{ sysmon_dl_temp.path }}\Sysmon.zip'
  changed_when: false

- name: Check bundled Sysmon archive checksum
  when: not sysmon_download_latest | bool
  ansible.windows.win_stat:
    path: '{{ sysmon_dl_temp.path }}\Sysmon.zip'
    get_checksum: true
    checksum_algorithm: sha256
  register: sysmon_bundled_archive  # noqa: var-naming[no-role-prefix]

- name: Validate bundled Sysmon archive checksum
  when: not sysmon_download_latest | bool
  ansible.builtin.assert:
    that:
      - >-
        sysmon_bundled_archive.stat.checksum | lower ==
        sysmon_archive_sha256sum | lower
    fail_msg: The bundled sysmon.zip does not match sysmon_archive_sha256sum.
    quiet: true

- name: Download latest Sysmon archive
  when: sysmon_download_latest | bool
  ansible.windows.win_get_url:
    url: "{{ sysmon_installer_url }}"
    validate_certs: true
    dest: '{{ sysmon_dl_temp.path }}\Sysmon.zip'
  register: sysmon_download  # noqa: var-naming[no-role-prefix]
  until: sysmon_download is succeeded
  retries: 10
  delay: 10
  changed_when: false

- name: Extract selected Sysmon archive
  community.windows.win_unzip:
    src: '{{ sysmon_dl_temp.path }}\Sysmon.zip'
    dest: "{{ sysmon_dl_temp.path }}"
  changed_when: false

- name: Check selected Sysmon executable
  ansible.windows.win_stat:
    path: '{{ sysmon_dl_temp.path }}\Sysmon64.exe'
    get_checksum: false
  register: sysmon_staged_exe  # noqa: var-naming[no-role-prefix]

- name: Validate selected Sysmon executable before changing installation
  ansible.builtin.assert:
    that:
      - sysmon_staged_exe.stat.isreg | default(false)
    fail_msg: The selected archive must contain Sysmon64.exe at its root.
    quiet: true

- name: Read downloaded Sysmon version
  when: sysmon_download_latest | bool
  community.windows.win_file_version:
    path: '{{ sysmon_dl_temp.path }}\Sysmon64.exe'
  register: sysmon_archive_version  # noqa: var-naming[no-role-prefix]

- name: Validate downloaded Sysmon version before changing installation
  when: sysmon_download_latest | bool
  ansible.builtin.assert:
    that:
      - >-
        sysmon_archive_version.win_file_version.product_version
        | default('') | length > 0
    fail_msg: >-
      The selected archive must contain Sysmon64.exe with a product version.
    quiet: true

- name: Use downloaded Sysmon version
  when: sysmon_download_latest | bool
  ansible.builtin.set_fact:
    sysmon_target_version: "{{ sysmon_archive_version.win_file_version.product_version }}"  # noqa: var-naming[no-role-prefix]
