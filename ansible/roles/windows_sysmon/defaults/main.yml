---
# Preserve these established public inputs for existing Ludus range configs.
sysmon_executable_path: 'C:\Windows\Sysmon64.exe'  # noqa: var-naming[no-role-prefix]
sysmon_config_dest: 'C:\Windows\sysmonconfig.xml'  # noqa: var-naming[no-role-prefix]
sysmon_drv_reg: "C:\\Windows\\Sysmon64.exe -i -accepteula"  # noqa: var-naming[no-role-prefix]
# Configuration filename in the role's files/ directory.
sysmon_config_file: sysmonconfig.xml  # noqa: var-naming[no-role-prefix]
# Searches files/ first.
sysmon_config_source: "{{ lookup('first_found', sysmon_config_file) }}"  # noqa: var-naming[no-role-prefix]
sysmon_installer_url: https://download.sysinternals.com/files/Sysmon.zip  # noqa: var-naming[no-role-prefix]
sysmon_download_latest: false  # noqa: var-naming[no-role-prefix]
# These values describe files/sysmon.zip.
sysmon_installer_version: "15.22"  # noqa: var-naming[no-role-prefix]
sysmon_archive_sha256sum: "00ecf1b46aec99299d3ae0bca79dc621458bd014b20b509d7c5c8e8c8611aa54"  # noqa: var-naming[no-role-prefix]
sysmon_eventlog_maxsize_gigabyte: 1  # noqa: var-naming[no-role-prefix]
