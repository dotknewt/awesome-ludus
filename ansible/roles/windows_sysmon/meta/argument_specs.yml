---
argument_specs:
  main:
    short_description: |
      This Ansible role installs, upgrades, and configures Sysmon on
      Windows Server (2016, 2019, and 2022), Windows 10 and Windows 11.
    options:
      sysmon_config_dest:
        type: str
        required: false
        default: 'C:\Windows\sysmonconfig.xml'
        description: Location of the Sysmon configuration file.
      sysmon_eventlog_maxsize_gigabyte:
        type: int
        required: false
        default: 1
        description: |
          Maximum capacity of the Sysmon operational log in gigabytes (GB).
          This parameter defines the log’s storage limit before it automatically overwrites the oldest events.
          Sysmon logs are stored in the Windows Event Log at Applications and Services Logs/Microsoft/Windows/Sysmon/Operational.
      sysmon_download_latest:
        type: bool
        required: false
        default: false
        description: >-
          Download the latest archive without checksum verification instead of
          using files/sysmon.zip.
      sysmon_installer_version:
        type: str
        required: false
        default: "15.22"
        description: >-
          Version of the bundled files/sysmon.zip archive. Assumed to match
          the archive; ignored when sysmon_download_latest is true.
      sysmon_archive_sha256sum:
        type: str
        required: false
        default: "00ecf1b46aec99299d3ae0bca79dc621458bd014b20b509d7c5c8e8c8611aa54"
        description: >-
          SHA256 checksum of the bundled files/sysmon.zip archive.
          Ignored when sysmon_download_latest is true.
      sysmon_installer_url:
        type: str
        required: false
        default: "https://download.sysinternals.com/files/Sysmon.zip"
        description: >-
          URL to the Sysmon.zip installer archive when sysmon_download_latest
          is true.
      sysmon_config_source:
        type: str
        required: false
        default: "file/sysmonconfig.xml"
        description: |
          XML file for Sysmon configuration. Used in configure.yml.
