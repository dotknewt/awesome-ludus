---
- name: Require checksum-pinned Laurel RuntimeArtifact before mutation
  ansible.builtin.assert:
    that:
      - detection_laurel_artifact is mapping
    fail_msg: A checksum-pinned Laurel RuntimeArtifact is required; installation facts remain BLOCKED

- name: Validate native Laurel role inputs
  ansible.builtin.assert:
    that:
      - detection_linux_host_id is string
      - detection_linux_host_id | length > 0
      - detection_laurel_artifact.keys() | sort == ['download_auth_required', 'sha256', 'url', 'version']
      - detection_laurel_artifact.version is string
      - detection_laurel_artifact.version | length > 0
      - detection_laurel_artifact.url is string
      - (detection_laurel_artifact.url is match('^https://')) or ((detection_logging_root | length > 0) and (detection_laurel_artifact.url is match('^file://')))
      - detection_laurel_artifact.sha256 is match('^[0-9a-f]{64}$')
      - detection_laurel_artifact.download_auth_required is sameas false
      - detection_laurel_read_user in ['splunkfwd', 'splunk']
      - detection_linux_auth_log_path == '/var/log/auth.log'
      - detection_linux_system_log_path == '/var/log/syslog'
      - detection_laurel_rotate_size == 5000000
      - detection_laurel_rotate_generations == 10
    fail_msg: Invalid native Laurel artifact, reader, canonical source, or rotation contract
