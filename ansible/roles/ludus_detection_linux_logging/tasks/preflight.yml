---
- name: Inspect effective audit plugin directory and raw sinks
  ansible.builtin.script:
    cmd: >-
      audit_preflight.py
      --root {{ (detection_logging_root | default('/')) | quote }}
      --auditd-config {{ detection_auditd_config_path | quote }}
      --allowed-name detection-engineering.conf
      --allowed-path {{ (detection_logging_root ~ '/usr/local/libexec/detection-engineering/audit_sanitize.py') | quote }}
      --allowed-args {{ ('--output ' ~ detection_logging_root ~ detection_logging_output_path ~ ' --owner ' ~ detection_audit_output_owner ~ ' --group ' ~ detection_audit_output_group) | quote }}
  changed_when: false
