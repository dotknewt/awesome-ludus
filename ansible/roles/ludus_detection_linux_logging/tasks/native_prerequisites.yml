---
- name: Inspect native rsyslog enablement
  ansible.builtin.command:
    argv: ["{{ detection_logging_service_command }}", is-enabled, rsyslog]
  register: detection_native_rsyslog_enabled_before
  changed_when: false
  failed_when: false

- name: Inspect native rsyslog activity
  ansible.builtin.command:
    argv: ["{{ detection_logging_service_command }}", is-active, rsyslog]
  register: detection_native_rsyslog_active_before
  changed_when: false
  failed_when: false

- name: Enable and start the distro-native rsyslog producer when required
  ansible.builtin.command:
    argv: ["{{ detection_logging_service_command }}", enable, --now, rsyslog]
  when: detection_native_rsyslog_enabled_before.rc != 0 or detection_native_rsyslog_active_before.rc != 0
  changed_when: true

- name: Require enabled native rsyslog producer
  ansible.builtin.command:
    argv: ["{{ detection_logging_service_command }}", is-enabled, rsyslog]
  changed_when: false

- name: Require active native rsyslog producer
  ansible.builtin.command:
    argv: ["{{ detection_logging_service_command }}", is-active, rsyslog]
  changed_when: false

- name: Wait for naturally produced canonical auth and system logs
  ansible.builtin.stat:
    path: "{{ detection_logging_root }}{{ item }}"
  loop:
    - "{{ detection_linux_auth_log_path }}"
    - "{{ detection_linux_system_log_path }}"
  register: detection_native_log_sources
  until:
    - detection_native_log_sources.stat.exists
    - detection_native_log_sources.stat.isreg
  retries: 12
  delay: 5
