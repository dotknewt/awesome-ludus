---
- name: Verify the distro auditd package is installed
  ansible.builtin.command:
    argv:
      - "{{ detection_logging_dpkg_query_command }}"
      - --show
      - "--showformat=${db:Status-Status}"
      - auditd
  changed_when: false
  failed_when: false
  register: detection_auditd_package

- name: Inspect required distro auditd tools
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ detection_auditd_augenrules_command }}"
    - "{{ detection_auditd_auditctl_command }}"
  register: detection_auditd_tools

- name: Inspect the auditd systemd unit
  ansible.builtin.command:
    argv:
      - "{{ detection_logging_service_command }}"
      - show
      - auditd
      - --property=LoadState
      - --value
  changed_when: false
  failed_when: false
  register: detection_auditd_unit

- name: Refuse mutation without the Task 8 distro auditd prerequisite
  ansible.builtin.assert:
    that:
      - detection_auditd_package.rc == 0
      - detection_auditd_package.stdout | trim == 'installed'
      - detection_auditd_tools.results[0].stat.exists
      - detection_auditd_tools.results[0].stat.executable | default(false)
      - detection_auditd_tools.results[1].stat.exists
      - detection_auditd_tools.results[1].stat.executable | default(false)
      - detection_auditd_unit.rc == 0
      - detection_auditd_unit.stdout | trim == 'loaded'
    fail_msg: Task 8 must provision distro auditd package, augenrules/auditctl tools, and loaded unit before this role mutates Laurel state

- name: Verify the assigned reader account already exists
  ansible.builtin.command:
    argv:
      - "{{ detection_logging_getent_command }}"
      - passwd
      - "{{ detection_laurel_read_user }}"
  changed_when: false
  register: detection_laurel_reader
  failed_when: false

- name: Refuse Laurel configuration before reader account provisioning
  ansible.builtin.assert:
    that: detection_laurel_reader.rc == 0
    fail_msg: Laurel reader account must exist before native read-users configuration; Task 8 owns ordering

- name: Inspect required common Linux log sources
  ansible.builtin.stat:
    path: "{{ detection_logging_root }}{{ item }}"
  loop:
    - "{{ detection_linux_auth_log_path }}"
    - "{{ detection_linux_system_log_path }}"
  register: detection_common_sources

- name: Require retained auth and system source files
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: Expected auth.log/syslog source is absent or not a regular file
  loop: "{{ detection_common_sources.results }}"

- name: Inspect the private state parent
  ansible.builtin.stat:
    path: "{{ detection_logging_root }}/var/lib"
    follow: false
  register: detection_stock_private_grandparent

- name: Require a trusted private state parent
  ansible.builtin.assert:
    that:
      - detection_stock_private_grandparent.stat.exists
      - detection_stock_private_grandparent.stat.isdir
      - not detection_stock_private_grandparent.stat.islnk
      - not detection_stock_private_grandparent.stat.wgrp
      - not detection_stock_private_grandparent.stat.woth
      - (detection_logging_root | length > 0) or detection_stock_private_grandparent.stat.uid == 0
    fail_msg: Refusing unsafe /var/lib parent before private stock-log state preparation

- name: Inspect the role-owned shared private state directory
  ansible.builtin.stat:
    path: "{{ detection_logging_root }}/var/lib/detection-engineering"
    follow: false
  register: detection_stock_private_parent_before

- name: Refuse an untrusted existing role-owned shared private state object
  ansible.builtin.assert:
    that:
      - >-
        not detection_stock_private_parent_before.stat.exists
        or (
          detection_stock_private_parent_before.stat.isdir
          and not detection_stock_private_parent_before.stat.islnk
          and not detection_stock_private_parent_before.stat.wgrp
          and not detection_stock_private_parent_before.stat.woth
          and ((detection_logging_root | length > 0) or detection_stock_private_parent_before.stat.uid == 0)
        )
    fail_msg: Refusing linked, non-directory, writable, or non-root role-owned shared private state

- name: Prepare the role-owned shared private state directory
  ansible.builtin.file:
    path: "{{ detection_logging_root }}/var/lib/detection-engineering"
    state: directory
    mode: "0700"
  register: detection_stock_private_parent_preparation

- name: Apply fixed stock-log reader access policy
  ansible.builtin.include_tasks: stock_log_access.yml

- name: Exercise common source reads as the actual assigned reader
  ansible.builtin.command:
    argv:
      - "{{ detection_logging_runuser_command }}"
      - -u
      - "{{ detection_laurel_read_user }}"
      - --
      - test
      - -r
      - "{{ detection_logging_root }}{{ item }}"
  loop:
    - "{{ detection_linux_auth_log_path }}"
    - "{{ detection_linux_system_log_path }}"
  changed_when: false
  register: detection_common_source_reads
  failed_when: false

- name: Refuse unreadable auth or system telemetry
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: Laurel reader cannot read required auth/system source after fixed stock-log access application
  loop: "{{ detection_common_source_reads.results }}"

- name: Create Laurel artifact cache directory
  ansible.builtin.file:
    path: "{{ detection_logging_root }}/var/cache/detection-engineering"
    state: directory
    mode: "0750"

- name: Download the pinned Laurel artifact
  ansible.builtin.get_url:
    url: "{{ detection_laurel_artifact.url }}"
    dest: "{{ detection_logging_root }}/var/cache/detection-engineering/laurel-{{ detection_laurel_artifact.sha256 }}.tar.gz"
    checksum: "sha256:{{ detection_laurel_artifact.sha256 }}"
    mode: "0600"
  register: detection_laurel_download

- name: Validate Laurel archive layout before account or binary mutation
  ansible.builtin.script:
    cmd: >-
      install_laurel_artifact.py
      --archive {{ (detection_logging_root ~ '/var/cache/detection-engineering/laurel-' ~ detection_laurel_artifact.sha256 ~ '.tar.gz') | quote }}
      --sha256 {{ detection_laurel_artifact.sha256 | quote }}
      --check-only
  changed_when: false

- name: Check for the native Laurel service account
  ansible.builtin.command:
    argv:
      - "{{ detection_logging_getent_command }}"
      - passwd
      - "{{ detection_laurel_service_user }}"
  changed_when: false
  failed_when: false
  register: detection_laurel_service_account

- name: Create only the Laurel-owned service account
  ansible.builtin.command:
    argv:
      - "{{ detection_logging_useradd_command }}"
      - --system
      - --home-dir
      - "{{ detection_logging_root }}/var/log/laurel"
      - --create-home
      - "{{ detection_laurel_service_user }}"
  when: detection_laurel_service_account.rc != 0
  changed_when: true

- name: Install the validated Laurel binary atomically
  ansible.builtin.script:
    cmd: >-
      install_laurel_artifact.py
      --archive {{ (detection_logging_root ~ '/var/cache/detection-engineering/laurel-' ~ detection_laurel_artifact.sha256 ~ '.tar.gz') | quote }}
      --sha256 {{ detection_laurel_artifact.sha256 | quote }}
      --destination {{ (detection_logging_root ~ detection_laurel_binary_path) | quote }}
  register: detection_laurel_install
  changed_when: "'CHANGED' in detection_laurel_install.stdout"

- name: Create native Laurel system configuration directories
  ansible.builtin.file:
    path: "{{ detection_logging_root }}{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - /etc/laurel
    - /etc/audit/plugins.d
    - /etc/audit/rules.d

- name: Enforce the Laurel output directory writable mode
  ansible.builtin.file:
    path: "{{ detection_logging_root }}/var/log/laurel"
    state: directory
    mode: "0750"
  register: detection_laurel_output_directory

- name: Enforce Laurel ownership on its output directory
  ansible.builtin.command:
    argv:
      - "{{ detection_logging_chown_command }}"
      - --changes
      - "{{ detection_laurel_service_user }}:{{ detection_laurel_service_user }}"
      - "{{ detection_logging_root }}/var/log/laurel"
  register: detection_laurel_output_owner
  changed_when: detection_laurel_output_owner.stdout | length > 0

- name: Inspect preexisting native Laurel output
  ansible.builtin.stat:
    path: "{{ detection_logging_root }}{{ detection_laurel_output_path }}"
  register: detection_laurel_existing_output

- name: Enforce writable mode on preexisting native Laurel output
  ansible.builtin.file:
    path: "{{ detection_logging_root }}{{ detection_laurel_output_path }}"
    mode: "0640"
  when: detection_laurel_existing_output.stat.exists
  register: detection_laurel_existing_output_mode

- name: Enforce Laurel ownership on preexisting native output
  ansible.builtin.command:
    argv:
      - "{{ detection_logging_chown_command }}"
      - --changes
      - "{{ detection_laurel_service_user }}:{{ detection_laurel_service_user }}"
      - "{{ detection_logging_root }}{{ detection_laurel_output_path }}"
  when: detection_laurel_existing_output.stat.exists
  register: detection_laurel_existing_output_owner
  changed_when: detection_laurel_existing_output_owner.stdout | length > 0

- name: Render version-reviewed native Laurel configuration
  ansible.builtin.template:
    src: laurel-config.toml.j2
    dest: "{{ detection_logging_root }}{{ detection_laurel_config_path }}"
    mode: "0640"
  register: detection_laurel_config

- name: Render version-reviewed auditd Laurel plugin
  ansible.builtin.template:
    src: laurel-plugin.conf.j2
    dest: "{{ detection_logging_root }}{{ detection_laurel_plugin_path }}"
    mode: "0640"
  register: detection_laurel_plugin

- name: Install bounded audit rules adapted from pinned guidance
  ansible.builtin.template:
    src: audit.rules.j2
    dest: "{{ detection_logging_root }}{{ detection_laurel_rules_path }}"
    mode: "0640"
  register: detection_laurel_rules

- name: Hash rendered application-driving files
  ansible.builtin.stat:
    path: "{{ detection_logging_root }}{{ item }}"
    checksum_algorithm: sha256
  loop:
    - "{{ detection_laurel_config_path }}"
    - "{{ detection_laurel_plugin_path }}"
    - "{{ detection_laurel_rules_path }}"
  register: detection_laurel_application_files

- name: Assemble deterministic native application state
  ansible.builtin.set_fact:
    detection_laurel_application_state:
      - "{{ detection_laurel_artifact.sha256 }}"
      - "{{ detection_laurel_read_user }}"
      - "{{ detection_laurel_rotate_size | string }}"
      - "{{ detection_laurel_rotate_generations | string }}"
      - "{{ detection_laurel_application_files.results[0].stat.checksum }}"
      - "{{ detection_laurel_application_files.results[1].stat.checksum }}"
      - "{{ detection_laurel_application_files.results[2].stat.checksum }}"

- name: Calculate desired native application digest
  ansible.builtin.set_fact:
    detection_laurel_application_digest: >-
      {{ detection_laurel_application_state | to_json | hash('sha256') }}

- name: Inspect the last successful native application marker
  ansible.builtin.stat:
    path: "{{ detection_logging_root }}/var/lib/detection-engineering/laurel-apply.sha256"
  register: detection_laurel_apply_marker

- name: Initialize persisted native application digest
  ansible.builtin.set_fact:
    detection_laurel_persisted_digest: ""

- name: Read persisted native application digest
  ansible.builtin.slurp:
    path: "{{ detection_logging_root }}/var/lib/detection-engineering/laurel-apply.sha256"
  when: detection_laurel_apply_marker.stat.exists
  register: detection_laurel_persisted_marker

- name: Decode persisted native application digest
  ansible.builtin.set_fact:
    detection_laurel_persisted_digest: >-
      {{ detection_laurel_persisted_marker.content | b64decode | trim }}
  when: detection_laurel_apply_marker.stat.exists

- name: Query current auditd enablement
  ansible.builtin.command:
    argv:
      - "{{ detection_logging_service_command }}"
      - is-enabled
      - auditd
  changed_when: false
  failed_when: false
  register: detection_auditd_enabled_before

- name: Enable auditd when Task 8 has not already enabled it
  ansible.builtin.command:
    argv:
      - "{{ detection_logging_service_command }}"
      - enable
      - auditd
  when: detection_auditd_enabled_before.rc != 0
  changed_when: true

- name: Query currently loaded audit rules
  ansible.builtin.command:
    argv:
      - "{{ detection_auditd_auditctl_command }}"
      - -l
  changed_when: false
  failed_when: false
  register: detection_auditd_rules_before

- name: Query current auditd activity
  ansible.builtin.command:
    argv:
      - "{{ detection_logging_service_command }}"
      - is-active
      - auditd
  changed_when: false
  failed_when: false
  register: detection_auditd_active_before

- name: Determine whether native auditd application is required
  ansible.builtin.set_fact:
    detection_laurel_apply_required: >-
      {{
        detection_laurel_install.changed
        or detection_laurel_output_directory.changed
        or detection_laurel_output_owner.changed
        or detection_laurel_existing_output_mode.changed
        or detection_laurel_existing_output_owner.changed
        or detection_laurel_config.changed
        or detection_laurel_plugin.changed
        or detection_laurel_rules.changed
        or detection_laurel_persisted_digest != detection_laurel_application_digest
        or detection_auditd_enabled_before.rc != 0
        or detection_auditd_active_before.rc != 0
        or detection_auditd_rules_before.rc != 0
        or 'key=detection_process' not in detection_auditd_rules_before.stdout
      }}

- name: Invalidate successful application marker before native mutation
  ansible.builtin.file:
    path: "{{ detection_logging_root }}/var/lib/detection-engineering/laurel-apply.sha256"
    state: absent
  when: detection_laurel_apply_required | bool

- name: Load the bounded rules through the distro auditd lifecycle
  ansible.builtin.command:
    argv:
      - "{{ detection_auditd_augenrules_command }}"
      - --load
  when: detection_laurel_apply_required | bool
  changed_when: true

- name: Restart auditd after native configuration application
  ansible.builtin.command:
    argv:
      - "{{ detection_logging_service_command }}"
      - restart
      - auditd
  when: detection_laurel_apply_required | bool
  changed_when: true

- name: Verify auditd remains enabled
  ansible.builtin.command:
    argv:
      - "{{ detection_logging_service_command }}"
      - is-enabled
      - auditd
  changed_when: false

- name: Verify auditd is active
  ansible.builtin.command:
    argv:
      - "{{ detection_logging_service_command }}"
      - is-active
      - auditd
  changed_when: false

- name: Read loaded audit rules after native application
  ansible.builtin.command:
    argv:
      - "{{ detection_auditd_auditctl_command }}"
      - -l
  changed_when: false
  register: detection_auditd_rules_after

- name: Require the bounded process rule to be loaded
  ansible.builtin.assert:
    that:
      - detection_auditd_rules_after.rc == 0
      - "'key=detection_process' in detection_auditd_rules_after.stdout"
    fail_msg: auditd did not report the required detection_process rule key after augenrules application

- name: Wait for native Laurel output after auditd start
  ansible.builtin.wait_for:
    path: "{{ detection_logging_root }}{{ detection_laurel_output_path }}"
    state: present
    timeout: "{{ detection_laurel_output_wait_timeout }}"

- name: Exercise native Laurel output read as assigned reader
  ansible.builtin.command:
    argv:
      - "{{ detection_logging_runuser_command }}"
      - -u
      - "{{ detection_laurel_read_user }}"
      - --
      - test
      - -r
      - "{{ detection_logging_root }}{{ detection_laurel_output_path }}"
  changed_when: false

- name: Create native application marker directory
  ansible.builtin.file:
    path: "{{ detection_logging_root }}/var/lib/detection-engineering"
    state: directory
    mode: "0700"

- name: Record successful native auditd and Laurel application
  ansible.builtin.copy:
    content: "{{ detection_laurel_application_digest }}\n"
    dest: "{{ detection_logging_root }}/var/lib/detection-engineering/laurel-apply.sha256"
    mode: "0600"
