---
- name: Validate firewall inputs before mutation
  ansible.builtin.assert:
    that:
      - detection_firewall_profile in ['gitlab', 'runner', 'malcolm', 'splunk', 'workload']
      - detection_firewall_lab_ip is string
      - detection_firewall_management_cidrs is sequence
      - detection_firewall_vpn_cidrs is sequence
      - detection_firewall_docker_bridges is sequence
      - detection_firewall_docker_bridges | length > 0
      - detection_firewall_allowed_tcp is sequence
      - detection_firewall_expected_tcp is sequence
      - detection_firewall_expected_tcp | length > 0
      - detection_firewall_verified_service_ports is sequence
      - detection_firewall_verified_service_ports | length > 0
    fail_msg: Invalid typed detection firewall contract

- name: Validate typed firewall policy and verified relationships
  ansible.builtin.script:
    cmd: >-
      validate_policy.py '{{ {
        "profile": detection_firewall_profile,
        "lab_ip": detection_firewall_lab_ip,
        "management_cidrs": detection_firewall_management_cidrs,
        "vpn_cidrs": detection_firewall_vpn_cidrs,
        "docker_bridges": detection_firewall_docker_bridges,
        "allowed": detection_firewall_allowed_tcp,
        "expected": detection_firewall_expected_tcp,
        "service_ports": detection_firewall_verified_service_ports
      } | to_json }}'
  changed_when: false

- name: Create firewall configuration directory
  ansible.builtin.file:
    path: "{{ detection_firewall_rules_path | dirname }}"
    state: directory
    mode: "0755"

- name: Render owned firewall table
  ansible.builtin.template:
    src: nftables-detection.nft.j2
    dest: "{{ detection_firewall_rules_path }}"
    mode: "0600"
  notify: Apply detection firewall table

- name: Install owned-table apply helper
  ansible.builtin.copy:
    src: apply-owned-table.sh
    dest: "{{ detection_firewall_apply_helper_path }}"
    mode: "0755"
  when: detection_firewall_apply | bool
  notify: Apply detection firewall table

- name: Install persistent owned-table service
  ansible.builtin.template:
    src: ludus-detection-firewall.service.j2
    dest: /etc/systemd/system/ludus-detection-firewall.service
    mode: "0644"
  when: detection_firewall_apply | bool
  notify: Apply detection firewall table

- name: Enable persistent owned-table service
  ansible.builtin.systemd_service:
    name: ludus-detection-firewall.service
    enabled: true
    daemon_reload: true
  when: detection_firewall_apply | bool

- name: Apply firewall immediately
  ansible.builtin.meta: flush_handlers
  when: detection_firewall_apply | bool
