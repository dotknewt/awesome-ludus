---
# Install Gitlab-CE

# Ensure prerequisites exist without replacing installed versions.
- name: (GITLAB-CE) Install prerequisites
  ansible.builtin.package:
    name: "{{ package }}"
    state: present
  loop:
    - curl
    - openssh-server
    - ca-certificates
  loop_control:
    loop_var: package

- name: (GITLAB-CE) Check if GitLab-CE is already installed
  ansible.builtin.stat:
    path: /etc/gitlab
  register: ludus_gitlab_ce_installed  # noqa: var-naming[no-role-prefix] — Existing task variable retained for compatibility.

- name: (GITLAB-CE) Download GitLab-CE Deb script
  ansible.builtin.get_url:
    url: https://packages.gitlab.com/install/repositories/gitlab/gitlab-ce/script.deb.sh
    dest: /tmp/gitlab-ce.deb.sh
    mode: "0644"
  when: not ludus_gitlab_ce_installed.stat.exists

- name: (GITLAB-CE) Execute GitLab-CE Deb script
  ansible.builtin.command: /bin/bash /tmp/gitlab-ce.deb.sh
  changed_when: true
  when: not ludus_gitlab_ce_installed.stat.exists

- name: (GITLAB-CE) Install Latest GitLab Community Edition
  ansible.builtin.package:
    name: gitlab-ce
    state: present
  when: not ludus_gitlab_ce_installed.stat.exists and not ludus_gitlab.version is defined

- name: (GITLAB-CE) Install Specific GitLab Community Edition
  ansible.builtin.package:
    name: gitlab-ce={{ ludus_gitlab.version }}-ce.0
    state: present
    allow_downgrade: true
  when: not ludus_gitlab_ce_installed.stat.exists and ludus_gitlab.version is defined

- name: (GITLAB-CE) Copy configuration
  ansible.builtin.template:
    src: gitlab.rb
    dest: /etc/gitlab/gitlab.rb
    force: true
    owner: root
    group: root
    mode: "0600"
  when: not ludus_gitlab_ce_installed.stat.exists

- name: (GITLAB-CE) Reconfigure GitLab Community Edition
  ansible.builtin.command: gitlab-ctl reconfigure
  changed_when: true
  when: not ludus_gitlab_ce_installed.stat.exists

- name: (GITLAB-CE) Set root email
  ansible.builtin.command: >-
    gitlab-rails runner "user = User.find_by_username('root'); user.email='{{ ludus_gitlab.emailroot }}';user.skip_reconfirmation!; user.save!"
  changed_when: true
  when: not ludus_gitlab_ce_installed.stat.exists

# Populate with content
- name: (GITLAB-CE) Run playbook to add content
  ansible.builtin.include_tasks: content.yml
  when: ludus_gitlab.groups is defined or ludus_gitlab.users is defined

# Create the separately delegated API credential even when groups/users are not configured.
- name: (GITLAB-CE) Bootstrap delegated runner API credential
  ansible.builtin.include_tasks: bootstrap.yml
  when: ((ludus_gitlab | default({})).bootstrap | default({})).enabled | default(false) | bool
