---
# yamllint disable rule:line-length
- name: Inspect cleanup tools without installing them
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop:
    - {name: helm, path: "{{ detection_helm_path }}"}
    - {name: kubectl, path: "{{ detection_kubectl_path }}"}
  register: _detection_absent_tool_stats

- name: Index cleanup tool state
  ansible.builtin.set_fact:
    _detection_absent_helm_binary: "{{ _detection_absent_tool_stats.results | selectattr('item.name', 'equalto', 'helm') | first }}"
    _detection_absent_kubectl_binary: "{{ _detection_absent_tool_stats.results | selectattr('item.name', 'equalto', 'kubectl') | first }}"
    cacheable: false

- name: Require usable authoritative cleanup inspection tools
  ansible.builtin.assert:
    that:
      - _detection_absent_helm_binary.stat.exists
      - _detection_absent_helm_binary.stat.isreg | default(false)
      - _detection_absent_helm_binary.stat.executable | default(false)
      - _detection_absent_kubectl_binary.stat.exists
      - _detection_absent_kubectl_binary.stat.isreg | default(false)
      - _detection_absent_kubectl_binary.stat.executable | default(false)
    fail_msg: Helm and kubectl inspection paths must both be usable before scoped cleanup

- name: Inspect host collector unit load state
  ansible.builtin.command:
    argv: ["{{ detection_systemctl }}", show, --property=LoadState, --value, otel-host.service]
  register: _detection_absent_host_load_state
  changed_when: false
  failed_when: _detection_absent_host_load_state.rc != 0 or _detection_absent_host_load_state.stdout | trim not in ['loaded', 'not-found']

- name: Inspect loaded host collector activity
  ansible.builtin.command:
    argv: ["{{ detection_systemctl }}", is-active, otel-host.service]
  when: _detection_absent_host_load_state.stdout | trim == 'loaded'
  register: _detection_absent_host_active
  changed_when: false
  failed_when: >-
    not (
      (_detection_absent_host_active.rc == 0 and _detection_absent_host_active.stdout | trim == 'active') or
      (_detection_absent_host_active.rc == 3 and _detection_absent_host_active.stdout | trim in ['inactive', 'failed'])
    )

- name: Inspect loaded host collector enablement
  ansible.builtin.command:
    argv: ["{{ detection_systemctl }}", is-enabled, otel-host.service]
  when: _detection_absent_host_load_state.stdout | trim == 'loaded'
  register: _detection_absent_host_enabled
  changed_when: false
  failed_when: >-
    not (
      (_detection_absent_host_enabled.rc == 0 and _detection_absent_host_enabled.stdout | trim == 'enabled') or
      (_detection_absent_host_enabled.rc == 1 and _detection_absent_host_enabled.stdout | trim in ['disabled', 'static', 'indirect'])
    )

- name: Probe scoped Helm release before any teardown
  ansible.builtin.command:
    argv: ["{{ detection_runuser }}", -u, "{{ detection_workload_user }}", --, env, "HOME={{ detection_workload_home }}", "KUBECONFIG={{ detection_kubeconfig_path }}", "{{ detection_helm_path }}", "--kube-context={{ detection_cluster_name }}", status, otel-runtime, --namespace, otel-system, --output, json]
  register: _detection_absent_helm_status
  changed_when: false
  failed_when: >-
    not (
      (_detection_absent_helm_status.rc == 0 and _detection_absent_helm_status.stdout | from_json is mapping) or
      (_detection_absent_helm_status.rc == 1 and 'release: not found' in _detection_absent_helm_status.stderr)
    )

- name: Probe scoped Kubernetes Secret before any teardown
  ansible.builtin.command:
    argv: ["{{ detection_runuser }}", -u, "{{ detection_workload_user }}", --, env, "HOME={{ detection_workload_home }}", "KUBECONFIG={{ detection_kubeconfig_path }}", "{{ detection_kubectl_path }}", "--context={{ detection_cluster_name }}", -n, otel-system, get, secret, splunk-hec, --output=name]
  register: _detection_absent_secret_status
  changed_when: false
  failed_when: >-
    not (
      (_detection_absent_secret_status.rc == 0 and _detection_absent_secret_status.stdout | trim == 'secret/splunk-hec') or
      (_detection_absent_secret_status.rc == 1 and '(NotFound)' in _detection_absent_secret_status.stderr)
    )

- name: Stop proven-active host collector before credential removal
  ansible.builtin.command:
    argv: ["{{ detection_systemctl }}", stop, otel-host.service]
  when:
    - _detection_absent_host_load_state.stdout | trim == 'loaded'
    - _detection_absent_host_active.stdout | trim == 'active'
  changed_when: true

- name: Disable proven-enabled host collector before credential removal
  ansible.builtin.command:
    argv: ["{{ detection_systemctl }}", disable, otel-host.service]
  when:
    - _detection_absent_host_load_state.stdout | trim == 'loaded'
    - _detection_absent_host_enabled.stdout | trim == 'enabled'
  changed_when: true

- name: Remove only proven-present scoped Helm collector
  ansible.builtin.command:
    argv: ["{{ detection_runuser }}", -u, "{{ detection_workload_user }}", --, env, "HOME={{ detection_workload_home }}", "KUBECONFIG={{ detection_kubeconfig_path }}", "{{ detection_helm_path }}", "--kube-context={{ detection_cluster_name }}", uninstall, otel-runtime, --namespace, otel-system]
  when:
    - _detection_absent_helm_status.rc == 0
  changed_when: true

- name: Clear Helm management proof after established release absence
  ansible.builtin.file:
    path: "{{ detection_workload_config_dir }}/.otel-runtime-managed"
    state: absent

- name: Inspect scoped role-owned Splunk HEC input
  ansible.builtin.stat:
    path: "{{ detection_splunk_hec_handoff.input_path }}"
  delegate_to: "{{ detection_splunk_hec_handoff.delegate_host }}"
  register: _detection_splunk_input

- name: Inspect pending scoped HEC restart marker
  ansible.builtin.stat:
    path: "{{ detection_splunk_hec_handoff.input_path | dirname }}/.workload-hec-restart-pending"
  delegate_to: "{{ detection_splunk_hec_handoff.delegate_host }}"
  register: _detection_splunk_restart_pending

- name: Persist pending restart before scoped HEC input mutation
  ansible.builtin.file:
    path: "{{ detection_splunk_hec_handoff.input_path | dirname }}/.workload-hec-restart-pending"
    state: touch
    owner: "{{ detection_root_owner }}"
    group: "{{ detection_root_group }}"
    mode: "0600"
  delegate_to: "{{ detection_splunk_hec_handoff.delegate_host }}"
  when:
    - _detection_splunk_input.stat.exists
    - not _detection_splunk_restart_pending.stat.exists

- name: Remove only scoped role-owned Splunk HEC input
  ansible.builtin.file:
    path: "{{ detection_splunk_hec_handoff.input_path }}"
    state: absent
  delegate_to: "{{ detection_splunk_hec_handoff.delegate_host }}"
  when: _detection_splunk_input.stat.exists

- name: Restart Splunk for pending scoped HEC revocation
  ansible.builtin.command:
    argv: ["{{ detection_systemctl }}", restart, "{{ detection_splunk_hec_handoff.service_name }}"]
  delegate_to: "{{ detection_splunk_hec_handoff.delegate_host }}"
  when: _detection_splunk_input.stat.exists or _detection_splunk_restart_pending.stat.exists
  changed_when: true

- name: Clear completed scoped HEC restart marker
  ansible.builtin.file:
    path: "{{ detection_splunk_hec_handoff.input_path | dirname }}/.workload-hec-restart-pending"
    state: absent
  delegate_to: "{{ detection_splunk_hec_handoff.delegate_host }}"
  when: _detection_splunk_input.stat.exists or _detection_splunk_restart_pending.stat.exists

- name: Delete only proven-present workload Kubernetes Secret
  ansible.builtin.command:
    argv: ["{{ detection_runuser }}", -u, "{{ detection_workload_user }}", --, env, "HOME={{ detection_workload_home }}", "KUBECONFIG={{ detection_kubeconfig_path }}", "{{ detection_kubectl_path }}", "--context={{ detection_cluster_name }}", -n, otel-system, delete, secret, splunk-hec, --ignore-not-found=true]
  when:
    - _detection_absent_secret_status.rc == 0
  register: _detection_secret_delete
  changed_when: _detection_secret_delete.rc == 0 and _detection_secret_delete.stdout | trim == 'secret "splunk-hec" deleted'
  failed_when: _detection_secret_delete.rc != 0 or _detection_secret_delete.stdout | trim != 'secret "splunk-hec" deleted'
  no_log: true

- name: Clear Secret management proof after established Secret absence
  ansible.builtin.file:
    path: "{{ detection_workload_config_dir }}/.splunk-hec-secret-managed"
    state: absent

- name: Remove host token remnant
  ansible.builtin.file:
    path: "{{ detection_host_token_path }}"
    state: absent
  no_log: true

- name: Remove role-owned directories only when empty with errno-aware outcomes
  ansible.builtin.command:
    argv:
      - "{{ detection_python }}"
      - -c
      - |
        import errno
        import os
        import sys
        try:
            os.rmdir(sys.argv[1])
        except FileNotFoundError:
            raise SystemExit(10)
        except OSError as error:
            if error.errno in {errno.ENOTEMPTY, errno.EEXIST}:
                raise SystemExit(11)
            raise
      - "{{ item }}"
  loop:
    - "{{ detection_secret_dir }}"
    - "{{ detection_etc_dir }}"
  register: _detection_empty_directories
  failed_when: _detection_empty_directories.rc not in [0, 10, 11]
  changed_when: _detection_empty_directories.rc == 0
