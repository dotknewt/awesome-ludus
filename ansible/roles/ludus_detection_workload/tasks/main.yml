---
# yamllint disable rule:line-length
- name: Validate workload lifecycle and exact scoped HEC handoff
  ansible.builtin.assert:
    that:
      - range_id is string and range_id | length > 0
      - detection_cluster_name == range_id + '-minikube'
      - detection_workload_user == 'debian'
      - detection_workload_home is match('^/')
      - detection_runtime_token_state in ['present', 'absent']
      - detection_splunk_hec_handoff is mapping
      - detection_splunk_hec_handoff.keys() | sort == ['delegate_host', 'input_path', 'service_name', 'source_path']
      - detection_splunk_hec_handoff.delegate_host is string and detection_splunk_hec_handoff.delegate_host | length > 0
      - detection_splunk_hec_handoff.source_path == '/etc/detection-engineering/secrets/hec-workload.token'
      - detection_splunk_hec_handoff.input_path == '/opt/splunk/etc/apps/detection_hec/local/inputs.conf'
      - detection_splunk_hec_handoff.service_name == 'Splunkd.service'
    fail_msg: Refusing workload lifecycle without exact range and scoped HEC inputs

- name: Revoke absent workload state before any provisioning
  ansible.builtin.include_tasks: absent.yml
  when: detection_runtime_token_state == 'absent'

- name: Provision present workload state
  ansible.builtin.include_tasks: present.yml
  when: detection_runtime_token_state == 'present'
