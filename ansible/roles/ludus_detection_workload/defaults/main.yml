---
# yamllint disable rule:line-length
# All factual inputs are deliberately empty. The blueprint must map VERIFIED
# gates into these values before this role may mutate a target.
detection_docker_packages: []
detection_docker_repository_url: ""
detection_docker_signing_key_url: ""
detection_docker_signing_key_fingerprint: ""
detection_minikube_artifact: {}
detection_kubectl_artifact: {}
detection_helm_artifact: {}
detection_otel_host_artifact: {}
detection_runtime_artifact_layouts: {}
detection_otel_chart: {}
detection_otel_contract: {}
detection_splunk_hec_handoff: {}
detection_workload_user: deworkload
detection_workload_home: /home/deworkload
detection_cluster_name: ""
detection_kubeconfig_path: /home/deworkload/.kube/config
detection_splunk_hec_url: ""
detection_runtime_token_state: present

detection_root_owner: root
detection_root_group: root
detection_workload_owner: deworkload
detection_workload_group: deworkload
detection_otel_owner: deotel
detection_otel_group: deotel
detection_etc_dir: /etc/detection-engineering
detection_secret_dir: /etc/detection-engineering/secrets
detection_host_token_path: /etc/detection-engineering/secrets/hec-workload.token
detection_workload_config_dir: /etc/detection-engineering/workload
detection_minikube_home: /home/deworkload/.minikube
detection_audit_policy_stage_path: /home/deworkload/.minikube/files/etc/kubernetes/audit-policy.yaml
detection_systemd_dir: /etc/systemd/system
detection_cache_dir: /var/cache/detection-engineering/workload
detection_minikube_path: /usr/local/bin/minikube
detection_kubectl_path: /usr/local/bin/kubectl
detection_helm_path: /usr/local/bin/helm
detection_otel_host_path: /usr/local/bin/otelcol-contrib
detection_otel_chart_archive_path: "{{ detection_cache_dir }}/{{ detection_otel_chart.chart }}-{{ detection_otel_chart.version }}.tgz"
detection_docker_keyring_path: /etc/apt/keyrings/docker.asc
detection_docker_source_path: /etc/apt/sources.list.d/docker.sources
detection_docker_root: /var/lib/docker
detection_minikube_artifact_path: "{{ detection_cache_dir }}/minikube.artifact"
detection_kubectl_artifact_path: "{{ detection_cache_dir }}/kubectl.artifact"
detection_helm_artifact_path: "{{ detection_cache_dir }}/helm.artifact"
detection_otel_host_artifact_path: "{{ detection_cache_dir }}/otel-host.artifact"
detection_artifact_installer_path: "{{ detection_cache_dir }}/install-runtime-artifact.py"

detection_python: /usr/bin/python3
detection_os_release_path: /etc/os-release
detection_apt_get: /usr/bin/apt-get
detection_useradd: /usr/sbin/useradd
detection_usermod: /usr/sbin/usermod
detection_id: /usr/bin/id
detection_gpasswd: /usr/bin/gpasswd
detection_dpkg_query: /usr/bin/dpkg-query
detection_find: /usr/bin/find
detection_getfacl: /usr/bin/getfacl
detection_runuser: /usr/sbin/runuser
detection_docker_cli: /usr/bin/docker
detection_setfacl: /usr/bin/setfacl
detection_gpg: /usr/bin/gpg
detection_systemctl: /usr/bin/systemctl
detection_ps: /usr/bin/ps
detection_rmdir: /usr/bin/rmdir
