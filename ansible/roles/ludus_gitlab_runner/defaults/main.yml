---
ludus_gitlab_runner_url: ""
ludus_gitlab_runner_auth_token: ""
ludus_gitlab_runner_bootstrap_from_server: false
ludus_gitlab_runner_bootstrap_host: ""
ludus_gitlab_runner_name: "ludus-docker-runner"
ludus_gitlab_runner_tags: ["docker"]
ludus_gitlab_runner_executor_image: "alpine:latest"
ludus_gitlab_runner_config_path: /etc/gitlab-runner/config.toml
ludus_gitlab_runner_user: gitlab-runner
ludus_gitlab_runner_project_name: "ludus-runner-demo"
ludus_gitlab_runner_project_namespace: "root"
ludus_gitlab_runner_project_path: "root/ludus-runner-demo"
ludus_gitlab_runner_api_token: ""
ludus_gitlab_runner_smoke_ci_enabled: true
ludus_gitlab_runner_ci_file: .gitlab-ci.yml
ludus_gitlab_runner_allow_ci_file_replace: false
ludus_gitlab_runner_state_path: /var/lib/ludus/gitlab-runner/runner.json
