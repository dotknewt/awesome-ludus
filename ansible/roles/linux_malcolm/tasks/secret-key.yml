---
- name: Inspect durable secret-file initialization evidence
  ansible.builtin.stat:
    path: "{{ _ludus_install_malcolm_secret_evidence }}"
  register: _ludus_install_malcolm_secret_evidence_stat
  no_log: true
  diff: false

- name: Read persistent secret file
  ansible.builtin.slurp:
    src: "{{ _ludus_install_malcolm_secret_file }}"
  register: _ludus_install_malcolm_secret_slurp
  changed_when: false
  no_log: true
  diff: false

- name: Resolve persistent secret value
  ansible.builtin.set_fact:
    _ludus_install_malcolm_secret_value: >-
      {{ ((_ludus_install_malcolm_secret_slurp.content | b64decode)
          | regex_findall('(?m)^' ~ _ludus_install_malcolm_secret_key ~ '=(.*)$')
          | first) | default('') }}
  no_log: true
  diff: false

- name: Validate established persistent secret
  ansible.builtin.assert:
    that:
      - >-
        (not _ludus_install_malcolm_secret_evidence_stat.stat.exists
         and ((_ludus_install_malcolm_secret_value | length == 0)
              or (_ludus_install_malcolm_secret_value is match('^[xX]+$'))))
        or (_ludus_install_malcolm_secret_value is match(_ludus_install_malcolm_secret_pattern))
    fail_msg: >-
      Existing {{ _ludus_install_malcolm_secret_key }} is neither an
      initialization placeholder nor a valid established secret; it was not rotated.
  no_log: true
  diff: false

- name: Generate only a missing persistent secret
  ansible.builtin.command:
    argv:
      - "{{ ludus_install_malcolm_venv_dir }}/bin/python"
      - -c
      - "import secrets,sys; print(''.join(secrets.choice(sys.argv[2]) for _ in range(int(sys.argv[1]))))"
      - "{{ _ludus_install_malcolm_secret_length }}"
      - "{{ _ludus_install_malcolm_secret_alphabet }}"
  register: _ludus_install_malcolm_generated_secret
  changed_when: true
  when: >-
    not _ludus_install_malcolm_secret_evidence_stat.stat.exists
    and ((_ludus_install_malcolm_secret_value | length == 0)
         or (_ludus_install_malcolm_secret_value is match('^[xX]+$')))
  no_log: true
  diff: false

- name: Persist only a newly generated secret
  ansible.builtin.lineinfile:
    path: "{{ _ludus_install_malcolm_secret_file }}"
    regexp: "^{{ _ludus_install_malcolm_secret_key }}="
    line: "{{ _ludus_install_malcolm_secret_key }}={{ _ludus_install_malcolm_generated_secret.stdout }}"
    owner: "{{ _ludus_install_malcolm_uid }}"
    group: "{{ _ludus_install_malcolm_gid }}"
    mode: "0600"
  when: _ludus_install_malcolm_generated_secret is not skipped
  notify: Restart Malcolm
  no_log: true
  diff: false

- name: Read final persisted secret before recording evidence
  ansible.builtin.slurp:
    src: "{{ _ludus_install_malcolm_secret_file }}"
  register: _ludus_install_malcolm_final_secret_slurp
  when: _ludus_install_malcolm_secret_finalize_file | bool
  no_log: true
  diff: false

- name: Validate final persisted secret before recording evidence
  ansible.builtin.assert:
    that:
      - >-
        ((_ludus_install_malcolm_final_secret_slurp.content | b64decode)
         | regex_findall('(?m)^' ~ _ludus_install_malcolm_secret_key ~ '=(.*)$')
         | length) == 1
      - >-
        (((_ludus_install_malcolm_final_secret_slurp.content | b64decode)
          | regex_findall('(?m)^' ~ _ludus_install_malcolm_secret_key ~ '=(.*)$')
          | first) is match(_ludus_install_malcolm_secret_pattern))
    fail_msg: >-
      Final {{ _ludus_install_malcolm_secret_key }} persistence did not reach
      its required semantic state; initialization evidence was not recorded.
  when: _ludus_install_malcolm_secret_finalize_file | bool
  no_log: true
  diff: false

- name: Record durable secret-file initialization evidence
  ansible.builtin.copy:
    content: "role_malcolm_install initialized config/{{ item.file }}\n"
    dest: "{{ _ludus_install_malcolm_secret_evidence }}"
    force: false
    owner: "{{ _ludus_install_malcolm_uid }}"
    group: "{{ _ludus_install_malcolm_gid }}"
    mode: "0600"
  when: _ludus_install_malcolm_secret_finalize_file | bool
  no_log: true
  diff: false
