---
- name: Ensure Malcolm TLS directories exist
  ansible.builtin.file:
    path: "{{ ludus_install_malcolm_install_dir }}/{{ item }}"
    state: directory
    owner: "{{ _ludus_install_malcolm_uid }}"
    group: "{{ _ludus_install_malcolm_gid }}"
    mode: "0750"
  loop:
    - nginx/certs
    - logstash/certs
    - filebeat/certs
    - .ludus-initialization
  no_log: true
  diff: false

- name: Classify and converge forwarding CA trust
  ansible.builtin.include_tasks: tls-ca.yml
  no_log: true

- name: Converge Malcolm web TLS leaf
  ansible.builtin.include_tasks: tls-leaf.yml
  vars:
    _ludus_install_malcolm_tls_name: web
    _ludus_install_malcolm_tls_key: "{{ ludus_install_malcolm_install_dir }}/nginx/certs/key.pem"
    _ludus_install_malcolm_tls_cert: "{{ ludus_install_malcolm_install_dir }}/nginx/certs/cert.pem"
    _ludus_install_malcolm_tls_csr: "{{ ludus_install_malcolm_install_dir }}/nginx/certs/cert.csr"
    _ludus_install_malcolm_tls_key_format: auto_ignore
    _ludus_install_malcolm_tls_common_name: malcolm
    _ludus_install_malcolm_tls_subject_alt_name: ["DNS:malcolm", "DNS:localhost", "IP:127.0.0.1"]
    _ludus_install_malcolm_tls_extended_key_usage: [serverAuth]
    _ludus_install_malcolm_tls_provider: selfsigned
  no_log: true

- name: Inspect Malcolm web DH parameters
  ansible.builtin.stat:
    path: "{{ ludus_install_malcolm_install_dir }}/nginx/certs/dhparam.pem"
  register: _ludus_install_malcolm_dhparam_stat
  no_log: true
  diff: false

- name: Validate established Malcolm web DH parameters
  ansible.builtin.command:
    argv: [openssl, dhparam, -check, -noout, -in, "{{ ludus_install_malcolm_install_dir }}/nginx/certs/dhparam.pem"]
  changed_when: false
  when: _ludus_install_malcolm_dhparam_stat.stat.exists
  no_log: true
  diff: false

- name: Generate missing Malcolm web DH parameters
  community.crypto.openssl_dhparam:
    path: "{{ ludus_install_malcolm_install_dir }}/nginx/certs/dhparam.pem"
    size: "{{ ludus_install_malcolm_tls_dhparam_size }}"
    owner: "{{ _ludus_install_malcolm_uid }}"
    group: "{{ _ludus_install_malcolm_gid }}"
    mode: "0600"
  when: not _ludus_install_malcolm_dhparam_stat.stat.exists
  notify: Restart Malcolm
  no_log: true
  diff: false

- name: Converge Logstash forwarding server TLS leaf
  ansible.builtin.include_tasks: tls-leaf.yml
  vars:
    _ludus_install_malcolm_tls_name: forwarding server
    _ludus_install_malcolm_tls_key: "{{ ludus_install_malcolm_install_dir }}/logstash/certs/server.key"
    _ludus_install_malcolm_tls_cert: "{{ ludus_install_malcolm_install_dir }}/logstash/certs/server.crt"
    _ludus_install_malcolm_tls_csr: "{{ ludus_install_malcolm_install_dir }}/logstash/certs/server.csr"
    _ludus_install_malcolm_tls_key_format: pkcs8
    _ludus_install_malcolm_tls_common_name: malcolm
    _ludus_install_malcolm_tls_subject_alt_name: ["DNS:malcolm", "DNS:logstash", "DNS:localhost", "IP:127.0.0.1"]
    _ludus_install_malcolm_tls_extended_key_usage: [serverAuth]
    _ludus_install_malcolm_tls_provider: ownca
    _ludus_install_malcolm_tls_ownca_cert: "{{ ludus_install_malcolm_install_dir }}/logstash/certs/ca.crt"
    _ludus_install_malcolm_tls_ownca_key: "{{ ludus_install_malcolm_install_dir }}/logstash/certs/ca.key"
  no_log: true

- name: Converge Filebeat forwarding client TLS leaf
  ansible.builtin.include_tasks: tls-leaf.yml
  vars:
    _ludus_install_malcolm_tls_name: forwarding client
    _ludus_install_malcolm_tls_key: "{{ ludus_install_malcolm_install_dir }}/filebeat/certs/client.key"
    _ludus_install_malcolm_tls_cert: "{{ ludus_install_malcolm_install_dir }}/filebeat/certs/client.crt"
    _ludus_install_malcolm_tls_csr: "{{ ludus_install_malcolm_install_dir }}/filebeat/certs/client.csr"
    _ludus_install_malcolm_tls_key_format: auto_ignore
    _ludus_install_malcolm_tls_common_name: malcolm-forwarder
    _ludus_install_malcolm_tls_subject_alt_name: ["DNS:malcolm-forwarder"]
    _ludus_install_malcolm_tls_extended_key_usage: [clientAuth]
    _ludus_install_malcolm_tls_provider: ownca
    _ludus_install_malcolm_tls_ownca_cert: "{{ ludus_install_malcolm_install_dir }}/logstash/certs/ca.crt"
    _ludus_install_malcolm_tls_ownca_key: "{{ ludus_install_malcolm_install_dir }}/logstash/certs/ca.key"
  no_log: true
