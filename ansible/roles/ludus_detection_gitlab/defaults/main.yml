---
# This role deliberately has no product/package defaults. Task 1 gates must
# supply exact verified values before main.yml can install anything.
detection_gitlab_secret_dir: /etc/detection-engineering/secrets
detection_runner_api_bootstrap_path: "{{ detection_gitlab_secret_dir }}/runner-api-bootstrap.token"
detection_runner_auth_path: "{{ detection_gitlab_secret_dir }}/runner-auth.token"
detection_gitlab_api_work_dir: /run/detection-engineering/gitlab-bootstrap
detection_gitlab_readiness_path: /var/lib/detection-engineering/gitlab-readiness.json
detection_gitlab_config_path: /etc/gitlab/gitlab.rb
detection_gitlab_key_download_path: /usr/share/keyrings/gitlab-ce.asc
detection_gitlab_keyring_path: /usr/share/keyrings/gitlab-ce.gpg
detection_gitlab_key_verifier_path: /usr/local/libexec/detection-engineering/verify-gpg-primary
detection_gitlab_fixture_mode: false
detection_gitlab_apply_reconfigure: true
detection_gitlab_expected_secret_owner: root
detection_gitlab_expected_secret_uid: 0
