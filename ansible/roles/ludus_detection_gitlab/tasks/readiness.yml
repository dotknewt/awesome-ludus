---
- name: Validate the bounded selected-version readiness contract
  ansible.builtin.include_tasks: validate_readiness_contract.yml

- name: Create protected readiness work directory
  ansible.builtin.file:
    path: "{{ detection_gitlab_api_work_dir }}"
    state: directory
    owner: "{{ detection_gitlab_expected_secret_owner }}"
    mode: '0700'

- name: Pre-create protected readiness response
  ansible.builtin.file:
    path: "{{ detection_gitlab_api_work_dir }}/readiness.json"
    state: touch
    owner: "{{ detection_gitlab_expected_secret_owner }}"
    mode: '0600'

- name: Remove any stale readiness handoff before probing
  ansible.builtin.file:
    path: "{{ detection_gitlab_readiness_path }}"
    state: absent

- name: Establish and record bounded selected-version GitLab readiness
  block:
    - name: Wait boundedly for selected-version GitLab readiness
      ansible.builtin.command:
        argv: [curl, --config, '-']
        stdin: |
          silent
          show-error
          url = "{{ detection_gitlab_readiness_contract.transport_base_url }}{{ detection_gitlab_readiness_contract.endpoint }}"
          request = "{{ detection_gitlab_readiness_contract.method }}"
          output = "{{ detection_gitlab_api_work_dir }}/readiness.json"
          write-out = "%{http_code}"
      register: detection_gitlab_readiness_result
      changed_when: false
      retries: "{{ detection_gitlab_readiness_contract.attempts | int - 1 }}"
      delay: "{{ detection_gitlab_readiness_contract.delay_seconds }}"
      until:
        - detection_gitlab_readiness_result.rc == 0
        - detection_gitlab_readiness_result.stdout | int in detection_gitlab_readiness_contract.success_statuses

    - name: Ensure readiness handoff directory exists
      ansible.builtin.file:
        path: "{{ detection_gitlab_readiness_path | dirname }}"
        state: directory
        owner: "{{ detection_gitlab_expected_secret_owner }}"
        mode: '0755'

    - name: Record factual readiness handoff for later roles
      ansible.builtin.copy:
        dest: "{{ detection_gitlab_readiness_path }}"
        owner: "{{ detection_gitlab_expected_secret_owner }}"
        mode: '0644'
        content: >-
          {{ {
            'schema_version': 1,
            'status': 'READY',
            'transport_base_url': detection_gitlab_readiness_contract.transport_base_url,
            'endpoint': detection_gitlab_readiness_contract.endpoint,
            'method': detection_gitlab_readiness_contract.method,
            'http_status': detection_gitlab_readiness_result.stdout | int,
            'attempts_used': detection_gitlab_readiness_result.attempts | default(1)
          } | to_nice_json }}
  always:
    - name: Remove transient readiness response
      ansible.builtin.file:
        path: "{{ detection_gitlab_api_work_dir }}/readiness.json"
        state: absent
