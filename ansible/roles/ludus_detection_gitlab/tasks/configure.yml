---
- name: Render the range-specific GitLab configuration
  ansible.builtin.template:
    src: gitlab-detection.rb.j2
    dest: "{{ detection_gitlab_config_path }}"
    mode: '0600'

- name: Apply range-specific GitLab configuration
  ansible.builtin.command: gitlab-ctl reconfigure
  changed_when: true
  when: detection_gitlab_apply_reconfigure | bool
