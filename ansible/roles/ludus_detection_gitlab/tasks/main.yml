---
- name: Validate verified GitLab inputs
  ansible.builtin.include_tasks: preflight.yml

- name: Install pinned GitLab CE
  ansible.builtin.include_tasks: install.yml

- name: Configure producer-safe GitLab telemetry
  ansible.builtin.include_tasks: configure.yml

- name: Prove selected-version GitLab readiness before credential mutations
  ansible.builtin.include_tasks: readiness.yml

- name: Set the fixed isolated-lab root password through protected stdin
  ansible.builtin.command:
    argv: [gitlab-rails, runner, '-']
    stdin: |
      user = User.find_by_username('root')
      raise 'root account missing' unless user
      user.password = {{ detection_gitlab_root_password | to_json }}
      user.password_confirmation = {{ detection_gitlab_root_password | to_json }}
      raise 'root password update failed' unless user.save
  changed_when: true
  no_log: true

- name: Bootstrap the stable paused runner identity
  ansible.builtin.include_tasks: bootstrap.yml
