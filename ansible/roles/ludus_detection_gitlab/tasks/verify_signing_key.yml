---
- name: Read all identities in the downloaded GitLab signing-key material
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --with-colons
      - --fingerprint
      - --show-keys
      - "{{ detection_gitlab_key_download_path }}"
  register: detection_gitlab_key_details
  changed_when: false

- name: Ensure the signing-key verifier directory exists
  ansible.builtin.file:
    path: "{{ detection_gitlab_key_verifier_path | dirname }}"
    state: directory
    mode: '0755'

- name: Install the strict primary-key identity verifier
  ansible.builtin.copy:
    src: verify_gpg_primary.py
    dest: "{{ detection_gitlab_key_verifier_path }}"
    mode: '0755'

- name: Require exactly one matching primary signing key
  ansible.builtin.command:
    argv:
      - "{{ detection_gitlab_key_verifier_path }}"
      - "{{ detection_gitlab_signing_key_fingerprint }}"
    stdin: "{{ detection_gitlab_key_details.stdout }}"
  changed_when: false

- name: Build the apt keyring only from the validated single-primary material
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --yes
      - --dearmor
      - --output
      - "{{ detection_gitlab_keyring_path }}"
      - "{{ detection_gitlab_key_download_path }}"
  changed_when: true
