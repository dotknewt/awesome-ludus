---
- name: Install prerequisites for the verified GitLab repository
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, openssh-server]
    state: present
    update_cache: true

- name: Download the verified GitLab signing key
  ansible.builtin.get_url:
    url: "{{ detection_gitlab_signing_key_url }}"
    dest: "{{ detection_gitlab_key_download_path }}"
    mode: '0644'

- name: Verify the exact single primary signing-key identity
  ansible.builtin.include_tasks: verify_signing_key.yml

- name: Configure only the verified GitLab apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by={{ detection_gitlab_keyring_path }}]
      {{ detection_gitlab_repository_url }} {{ ansible_distribution_release }} main
    filename: detection-gitlab-ce
    state: present
    update_cache: true

- name: Install exact verified GitLab package versions
  ansible.builtin.apt:
    name: "{{ item.name }}={{ item.version }}"
    state: present
    allow_downgrade: false
  loop: "{{ detection_gitlab_packages }}"
  environment:
    EXTERNAL_URL: "{{ detection_gitlab_external_url }}"
