---
# Task 6 alone revokes and removes the protected temporary credential handle.
- name: Validate structured runner API bootstrap contract
  ansible.builtin.assert:
    that:
      - range_id is string
      - range_id | length > 0
      - detection_gitlab_external_url is match('^https?://[^?\s]+$')
      - detection_runner_api_contract.bootstrap_auth.creation_argv == ['gitlab-rails', 'runner', '-']
      - detection_runner_api_contract.bootstrap_auth.keys() | list | sort == ['creation_argv', 'credential_type', 'expiration_days', 'mode', 'protected_path', 'revoke_endpoint', 'revoke_method', 'scopes'] | sort
      - detection_runner_api_contract.bootstrap_auth.credential_type == 'personal_access_token'
      - detection_runner_api_contract.bootstrap_auth.scopes is sequence
      - detection_runner_api_contract.bootstrap_auth.scopes is not string
      - detection_runner_api_contract.bootstrap_auth.scopes | length == 2
      - detection_runner_api_contract.bootstrap_auth.scopes | unique | length == detection_runner_api_contract.bootstrap_auth.scopes | length
      - detection_runner_api_contract.bootstrap_auth.expiration_days == 1
      - detection_runner_api_contract.bootstrap_auth.mode == '0600'
      - detection_runner_api_contract.bootstrap_auth.protected_path == '/etc/detection-engineering/secrets/runner-api-bootstrap.token'
      - detection_runner_api_contract.manager.create_scope in detection_runner_api_contract.bootstrap_auth.scopes
      - detection_runner_api_contract.manager.manage_scope in detection_runner_api_contract.bootstrap_auth.scopes
      - detection_runner_api_contract.manager.create_scope != detection_runner_api_contract.manager.manage_scope
      - detection_runner_api_contract.bootstrap_auth.scopes | sort == [detection_runner_api_contract.manager.create_scope, detection_runner_api_contract.manager.manage_scope] | sort
      - detection_runner_api_contract.manager.keys() | list | sort == ['create_endpoint', 'create_method', 'create_scope', 'detail_endpoint', 'detail_method', 'local_verify_command', 'lookup_endpoint', 'lookup_method', 'manage_scope', 'pause_at_create', 'request_fields', 'response_token_field', 'runner_type', 'update_endpoint', 'update_method'] | sort
      - detection_runner_api_contract.manager.pause_at_create | bool
      - detection_runner_api_contract.manager.request_fields | sort == ['description', 'paused', 'runner_type'] | sort
      - detection_runner_api_contract.manager.create_method == 'POST'
      - detection_runner_api_contract.manager.lookup_method == 'GET'
      - detection_runner_api_contract.manager.detail_method == 'GET'
      - detection_runner_api_contract.manager.update_method == 'PUT'
      - detection_runner_api_contract.manager.create_endpoint is match('^/[^?\s]+$')
      - detection_runner_api_contract.manager.lookup_endpoint is match('^/[^?\s]+$')
      - detection_runner_api_contract.manager.detail_endpoint is match('^/[^?\s]+$')
      - detection_runner_api_contract.manager.update_endpoint is match('^/[^?\s]+$')
      - (':id' in detection_runner_api_contract.manager.detail_endpoint) or ('{id}' in detection_runner_api_contract.manager.detail_endpoint)
      - (':id' in detection_runner_api_contract.manager.update_endpoint) or ('{id}' in detection_runner_api_contract.manager.update_endpoint)
  no_log: true

- name: Validate every structured temporary credential scope
  ansible.builtin.assert:
    that:
      - item is match('^[a-z][a-z0-9_]*$')
  loop: "{{ detection_runner_api_contract.bootstrap_auth.scopes }}"
  no_log: true

- name: Create root-protected transaction directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ detection_gitlab_expected_secret_owner }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ detection_gitlab_secret_dir }}", mode: '0700'}
    - {path: "{{ detection_gitlab_api_work_dir }}", mode: '0700'}
  no_log: true

- name: Inspect the delegated revocation handle before minting
  ansible.builtin.stat:
    path: "{{ detection_runner_api_bootstrap_path }}"
  register: detection_gitlab_prior_bootstrap_file
  no_log: true

- name: Preserve and refuse an unrevoked prior bootstrap credential
  ansible.builtin.assert:
    that:
      - not detection_gitlab_prior_bootstrap_file.stat.exists
    fail_msg: >-
      BLOCKED: prior bootstrap credential remains pending Task 6 revocation;
      refusing to orphan it or mint another credential
  no_log: true

- name: Generate the vetted Rails-stdin credential operation from structured inputs
  ansible.builtin.set_fact:
    detection_gitlab_bootstrap_operation: |
      require 'date'
      path = ENV.fetch('DETECTION_RUNNER_API_BOOTSTRAP_PATH')
      raise 'bootstrap credential path already exists' if File.exist?(path)
      user = User.find_by_username!('root')
      credential = nil
      owned_file = nil
      owned_device = nil
      owned_inode = nil
      begin
        owned_file = File.open(path, File::WRONLY | File::CREAT | File::EXCL, 0o600)
        owned_stat = owned_file.stat
        owned_device = owned_stat.dev
        owned_inode = owned_stat.ino
        expires_on = Time.now.utc.to_date + {{ detection_runner_api_contract.bootstrap_auth.expiration_days }}
        credential = user.personal_access_tokens.create!(
          name: {{ (range_id ~ '-runner-bootstrap') | to_json }},
          scopes: %i[{{ detection_runner_api_contract.bootstrap_auth.scopes | join(' ') }}],
          expires_at: expires_on
        )
        credential.ensure_token
        written = owned_file.write(credential.token)
        raise 'incomplete bootstrap credential write' unless written == credential.token.bytesize
        owned_file.flush
        owned_file.fsync
        current_stat = File.lstat(path)
        current_inode = current_stat.ino
        raise 'bootstrap credential handle ownership changed' unless current_stat.dev == owned_device && current_inode == owned_inode
        owned_file.close
        owned_file = nil
      rescue StandardError => persistence_error
        rollback_error = nil
        if credential&.persisted?
          begin
            credential.destroy!
          rescue StandardError => error
            rollback_error = error
          end
        end
        close_error = nil
        begin
          owned_file.close if owned_file && !owned_file.closed?
        rescue StandardError => error
          close_error = error
        end
        if rollback_error || close_error
          failure_classes = ["persistence=#{persistence_error.class}"]
          failure_classes << "rollback=#{rollback_error.class}" if rollback_error
          failure_classes << "close=#{close_error.class}" if close_error
          raise "bootstrap credential transaction failed (#{failure_classes.join(', ')})"
        else
          # Retain this attempt's empty/partial fixed-path handle. Never unlink a
          # path that another process could replace; an operator must inspect and
          # explicitly clean it before a subsequent run can mint another PAT.
          raise
        end
      end
  no_log: true

- name: Mint a fresh date-limited runner API credential through canonical Rails stdin
  ansible.builtin.command:
    argv: [gitlab-rails, runner, '-']
    stdin: "{{ detection_gitlab_bootstrap_operation }}"
    stdin_add_newline: false
  environment:
    DETECTION_RUNNER_API_BOOTSTRAP_PATH: "{{ detection_runner_api_bootstrap_path }}"
  register: detection_gitlab_bootstrap_mint
  changed_when: true
  no_log: true

- name: Refuse credential material on Rails stdout or stderr
  ansible.builtin.assert:
    that:
      - detection_gitlab_bootstrap_mint.stdout | length == 0
      - detection_gitlab_bootstrap_mint.stderr | length == 0
  no_log: true

- name: Inspect the newly created temporary credential
  ansible.builtin.stat:
    path: "{{ detection_runner_api_bootstrap_path }}"
  register: detection_gitlab_bootstrap_token_file
  no_log: true

- name: Require a fresh root-owned protected temporary credential
  ansible.builtin.assert:
    that:
      - detection_gitlab_bootstrap_token_file.stat.exists
      - detection_gitlab_bootstrap_token_file.stat.isreg
      - detection_gitlab_bootstrap_token_file.stat.mode == '0600'
      - detection_gitlab_bootstrap_token_file.stat.uid == detection_gitlab_expected_secret_uid
  no_log: true

- name: Read the protected temporary credential without stdout
  ansible.builtin.slurp:
    src: "{{ detection_runner_api_bootstrap_path }}"
  register: detection_gitlab_bootstrap_token_slurp
  no_log: true

- name: Hold the temporary credential only as a non-cacheable secret fact
  ansible.builtin.set_fact:
    detection_gitlab_bootstrap_token: "{{ detection_gitlab_bootstrap_token_slurp.content | b64decode }}"
    detection_gitlab_runner_description: "{{ range_id }}-runner"
    detection_gitlab_lookup_response_path: "{{ detection_gitlab_api_work_dir }}/lookup.json"
    detection_gitlab_create_response_path: "{{ detection_gitlab_api_work_dir }}/create.json"
    detection_gitlab_detail_response_path: "{{ detection_gitlab_api_work_dir }}/detail.json"
    detection_gitlab_update_response_path: "{{ detection_gitlab_api_work_dir }}/update.json"
    cacheable: false
  no_log: true

- name: Refuse an empty or multiline temporary credential
  ansible.builtin.assert:
    that:
      - detection_gitlab_bootstrap_token | length > 0
      - "'\n' not in detection_gitlab_bootstrap_token"
  no_log: true

- name: Execute paused runner identity transaction
  block:
    - name: Pre-create protected API response files
      ansible.builtin.file:
        path: "{{ item }}"
        state: touch
        owner: "{{ detection_gitlab_expected_secret_owner }}"
        mode: '0600'
        access_time: preserve
        modification_time: preserve
      loop:
        - "{{ detection_gitlab_lookup_response_path }}"
        - "{{ detection_gitlab_create_response_path }}"
        - "{{ detection_gitlab_detail_response_path }}"
        - "{{ detection_gitlab_update_response_path }}"

    - name: Look up runner identities without query credentials or filters
      ansible.builtin.command:
        argv: [curl, --config, '-']
        stdin: |
          silent
          show-error
          fail-with-body
          url = "{{ detection_gitlab_external_url | regex_replace('/+$', '') }}{{ detection_runner_api_contract.manager.lookup_endpoint }}"
          request = "{{ detection_runner_api_contract.manager.lookup_method }}"
          header = "Authorization: Bearer {{ detection_gitlab_bootstrap_token }}"
          output = "{{ detection_gitlab_lookup_response_path }}"
      changed_when: false

    - name: Read the protected runner lookup response
      ansible.builtin.slurp:
        src: "{{ detection_gitlab_lookup_response_path }}"
      register: detection_gitlab_lookup_file

    - name: Select the exact runner identity locally
      ansible.builtin.set_fact:
        detection_gitlab_runner_matches: >-
          {{ (detection_gitlab_lookup_file.content | b64decode | from_json)
             | selectattr('runner_type', 'equalto', detection_runner_api_contract.manager.runner_type)
             | selectattr('description', 'equalto', detection_gitlab_runner_description)
             | list }}

    - name: Reject duplicate runner identities
      ansible.builtin.assert:
        that:
          - detection_gitlab_runner_matches | length <= 1
        fail_msg: "BLOCKED: duplicate paused-runner identities prevent safe token handoff"

    - name: Inspect the stable manager token
      ansible.builtin.stat:
        path: "{{ detection_runner_auth_path }}"
      register: detection_gitlab_manager_token_file

    - name: Refuse inconsistent identity and stable-token state
      ansible.builtin.assert:
        that:
          - not (detection_gitlab_runner_matches | length == 1 and not detection_gitlab_manager_token_file.stat.exists)
          - not (detection_gitlab_runner_matches | length == 0 and detection_gitlab_manager_token_file.stat.exists)
          - not detection_gitlab_manager_token_file.stat.exists or detection_gitlab_manager_token_file.stat.isreg
          - not detection_gitlab_manager_token_file.stat.exists or detection_gitlab_manager_token_file.stat.mode == '0600'
          - not detection_gitlab_manager_token_file.stat.exists or detection_gitlab_manager_token_file.stat.uid == detection_gitlab_expected_secret_uid
        fail_msg: "BLOCKED: runner identity/token state cannot safely recover the one-time manager token"

    - name: Select the existing exact identity ID
      ansible.builtin.set_fact:
        detection_gitlab_runner_id: "{{ detection_gitlab_runner_matches[0].id }}"
      when: detection_gitlab_runner_matches | length == 1

    - name: Write the paused runner creation request
      ansible.builtin.copy:
        dest: "{{ detection_gitlab_api_work_dir }}/create-request.json"
        owner: "{{ detection_gitlab_expected_secret_owner }}"
        mode: '0600'
        content: >-
          {{ {
            'runner_type': detection_runner_api_contract.manager.runner_type,
            'description': detection_gitlab_runner_description,
            'paused': true
          } | to_json }}
      when: detection_gitlab_runner_matches | length == 0

    - name: Create the runner identity paused from inception
      ansible.builtin.command:
        argv: [curl, --config, '-']
        stdin: |
          silent
          show-error
          fail-with-body
          url = "{{ detection_gitlab_external_url | regex_replace('/+$', '') }}{{ detection_runner_api_contract.manager.create_endpoint }}"
          request = "{{ detection_runner_api_contract.manager.create_method }}"
          header = "Authorization: Bearer {{ detection_gitlab_bootstrap_token }}"
          header = "Content-Type: application/json"
          data = "@{{ detection_gitlab_api_work_dir }}/create-request.json"
          output = "{{ detection_gitlab_create_response_path }}"
      when: detection_gitlab_runner_matches | length == 0
      changed_when: true

    - name: Read the protected create response
      ansible.builtin.slurp:
        src: "{{ detection_gitlab_create_response_path }}"
      register: detection_gitlab_create_file
      when: detection_gitlab_runner_matches | length == 0

    - name: Parse the documented create response shape
      ansible.builtin.set_fact:
        detection_gitlab_create_response: "{{ detection_gitlab_create_file.content | b64decode | from_json }}"
      when: detection_gitlab_runner_matches | length == 0

    - name: Validate created ID token and optional CE token expiry
      ansible.builtin.assert:
        that:
          - detection_gitlab_create_response.keys() | list | sort == ['id', 'token', 'token_expires_at']
          - detection_gitlab_create_response.id is integer
          - detection_gitlab_create_response.id > 0
          - detection_gitlab_create_response[detection_runner_api_contract.manager.response_token_field] is string
          - detection_gitlab_create_response[detection_runner_api_contract.manager.response_token_field] | length > 0
          - detection_gitlab_create_response.token_expires_at is none or detection_gitlab_create_response.token_expires_at is string
      when: detection_gitlab_runner_matches | length == 0

    - name: Select the newly created identity ID
      ansible.builtin.set_fact:
        detection_gitlab_runner_id: "{{ detection_gitlab_create_response.id }}"
      when: detection_gitlab_runner_matches | length == 0

    - name: Write the pause request for an existing identity
      ansible.builtin.copy:
        dest: "{{ detection_gitlab_api_work_dir }}/update-request.json"
        owner: "{{ detection_gitlab_expected_secret_owner }}"
        mode: '0600'
        content: "{{ {'paused': true} | to_json }}"
      when: detection_gitlab_runner_matches | length == 1

    - name: Pause an existing runner identity before handoff
      ansible.builtin.command:
        argv: [curl, --config, '-']
        stdin: |
          silent
          show-error
          fail-with-body
          url = "{{ detection_gitlab_external_url | regex_replace('/+$', '') }}{{ detection_runner_api_contract.manager.update_endpoint | replace(':id', detection_gitlab_runner_id | string) | replace('{id}', detection_gitlab_runner_id | string) }}"
          request = "{{ detection_runner_api_contract.manager.update_method }}"
          header = "Authorization: Bearer {{ detection_gitlab_bootstrap_token }}"
          header = "Content-Type: application/json"
          data = "@{{ detection_gitlab_api_work_dir }}/update-request.json"
          output = "{{ detection_gitlab_update_response_path }}"
      when: detection_gitlab_runner_matches | length == 1
      changed_when: true

    - name: Re-read the exact identity by its documented detail endpoint
      ansible.builtin.command:
        argv: [curl, --config, '-']
        stdin: |
          silent
          show-error
          fail-with-body
          url = "{{ detection_gitlab_external_url | regex_replace('/+$', '') }}{{ detection_runner_api_contract.manager.detail_endpoint | replace(':id', detection_gitlab_runner_id | string) | replace('{id}', detection_gitlab_runner_id | string) }}"
          request = "{{ detection_runner_api_contract.manager.detail_method }}"
          header = "Authorization: Bearer {{ detection_gitlab_bootstrap_token }}"
          output = "{{ detection_gitlab_detail_response_path }}"
      changed_when: false

    - name: Read the exact identity detail response
      ansible.builtin.slurp:
        src: "{{ detection_gitlab_detail_response_path }}"
      register: detection_gitlab_detail_file

    - name: Parse the exact identity detail
      ansible.builtin.set_fact:
        detection_gitlab_runner_detail: "{{ detection_gitlab_detail_file.content | b64decode | from_json }}"

    - name: Prove the exact identity tuple and pause before token persistence
      ansible.builtin.assert:
        that:
          - detection_gitlab_runner_detail.id == detection_gitlab_runner_id | int
          - detection_gitlab_runner_detail.runner_type == detection_runner_api_contract.manager.runner_type
          - detection_gitlab_runner_detail.description == detection_gitlab_runner_description
          - detection_gitlab_runner_detail.paused | bool

    - name: Persist the one-time stable manager token only after exact identity proof
      ansible.builtin.copy:
        dest: "{{ detection_runner_auth_path }}"
        content: "{{ detection_gitlab_create_response[detection_runner_api_contract.manager.response_token_field] }}"
        owner: "{{ detection_gitlab_expected_secret_owner }}"
        mode: '0600'
        force: false
      when: detection_gitlab_runner_matches | length == 0

  always:
    - name: Remove transient API request and response secret copies
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ detection_gitlab_api_work_dir }}/create-request.json"
        - "{{ detection_gitlab_api_work_dir }}/update-request.json"
        - "{{ detection_gitlab_lookup_response_path }}"
        - "{{ detection_gitlab_create_response_path }}"
        - "{{ detection_gitlab_detail_response_path }}"
        - "{{ detection_gitlab_update_response_path }}"
  no_log: true
