---
- name: Install prerequisites for the verified runner repository
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    state: present
    update_cache: true
  tags: [detection_runner_live_repository]

- name: Create runner key verification directory
  ansible.builtin.file:
    path: "{{ detection_runner_key_verifier_path | dirname }}"
    state: directory
    mode: '0755'
  tags: [detection_runner_live_repository]

- name: Install strict primary-key verifier
  ansible.builtin.copy:
    src: verify_gpg_primary.py
    dest: "{{ detection_runner_key_verifier_path }}"
    mode: '0755'
  tags: [detection_runner_live_repository]

- name: Download verified runner signing key
  ansible.builtin.get_url:
    url: "{{ detection_runner_signing_key_url }}"
    dest: "{{ detection_runner_key_download_path }}"
    mode: '0644'
  tags: [detection_runner_live_repository]

- name: Verify exact single primary runner signing key
  ansible.builtin.command:
    argv:
      - "{{ detection_runner_key_verifier_path }}"
      - "{{ detection_runner_key_download_path }}"
      - "{{ detection_runner_signing_key_fingerprint }}"
      - "{{ detection_runner_keyring_path }}"
  changed_when: true
  tags: [detection_runner_live_repository]

- name: Configure only the verified runner apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by={{ detection_runner_keyring_path }}]
      {{ detection_runner_repository_url }} {{ ansible_distribution_release }} main
    filename: detection-gitlab-runner
    state: present
    update_cache: true
  tags: [detection_runner_live_repository]

- name: Create runner policy helper directory
  ansible.builtin.file:
    path: "{{ detection_runner_policy_helper_path | dirname }}"
    state: directory
    owner: "{{ detection_runner_expected_local_owner }}"
    mode: '0755'

- name: Install bounded runner policy transaction helper
  ansible.builtin.copy:
    src: runner_policy_transaction.py
    dest: "{{ detection_runner_policy_helper_path }}"
    owner: "{{ detection_runner_expected_local_owner }}"
    mode: '0755'

- name: Run scoped package transaction
  ansible.builtin.include_tasks: install-package.yml
