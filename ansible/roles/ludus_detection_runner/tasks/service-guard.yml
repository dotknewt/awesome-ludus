---
- name: Attempt to stop the runner service
  ansible.builtin.command:
    argv: [systemctl, stop, gitlab-runner.service]
  register: detection_runner_guard_stop
  changed_when: detection_runner_guard_stop.rc == 0
  failed_when: false

- name: Attempt to disable the runner service
  ansible.builtin.command:
    argv: [systemctl, disable, gitlab-runner.service]
  register: detection_runner_guard_disable
  changed_when: detection_runner_guard_disable.rc == 0
  failed_when: false

- name: Attempt to mask the runner service
  ansible.builtin.command:
    argv: [systemctl, mask, gitlab-runner.service]
  register: detection_runner_guard_mask
  changed_when: detection_runner_guard_mask.rc == 0
  failed_when: false

- name: Inspect final runner active state
  ansible.builtin.command:
    argv: [systemctl, is-active, gitlab-runner.service]
  register: detection_runner_guard_active
  changed_when: false
  failed_when: false

- name: Inspect final runner enablement state
  ansible.builtin.command:
    argv: [systemctl, is-enabled, gitlab-runner.service]
  register: detection_runner_guard_enabled
  changed_when: false
  failed_when: false

- name: Require the runner service inactive and masked
  ansible.builtin.assert:
    that:
      - detection_runner_guard_active.stdout | trim == 'inactive'
      - detection_runner_guard_enabled.stdout | trim == 'masked'
    fail_msg: "FAIL: runner service guard could not prove inactive and masked state"
