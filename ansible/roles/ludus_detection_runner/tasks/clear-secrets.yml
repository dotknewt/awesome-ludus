---
- name: Remove transient local API material
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ detection_runner_api_work_dir }}/lookup.json"
    - "{{ detection_runner_api_work_dir }}/update.json"
    - "{{ detection_runner_api_work_dir }}/detail.json"
    - "{{ detection_runner_api_work_dir }}/post-detail.json"
    - "{{ detection_runner_api_work_dir }}/jobs.json"
    - "{{ detection_runner_api_work_dir }}/pause-request.json"
  register: detection_runner_transient_cleanup
  failed_when: false
  no_log: true

- name: Clear all secret-bearing and protected response facts
  ansible.builtin.set_fact:
    detection_runner_bootstrap_token: null
    detection_runner_bootstrap_slurp: null
    detection_runner_manager_token: null
    detection_runner_manager_slurp: null
    detection_runner_lookup_slurp: null
    detection_runner_detail_slurp: null
    detection_runner_postcheck_slurps: null
    detection_runner_revoke_slurp: null
    detection_runner_readiness_slurp: null
    detection_runner_registration_core_succeeded: null
    cacheable: false
  no_log: true

- name: Report transient cleanup failure only after secret facts are cleared
  ansible.builtin.assert:
    that:
      - detection_runner_transient_cleanup.results | selectattr('failed', 'defined') | selectattr('failed', 'equalto', true) | list | length == 0
    fail_msg: "FAIL: one or more transient API paths could not be removed after secret facts were cleared"
