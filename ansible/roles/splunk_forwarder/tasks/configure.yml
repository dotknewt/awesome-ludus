---
- name: Check current service active state before making policy changes  # noqa: var-naming[no-role-prefix]
  ansible.builtin.command:
    argv: [systemctl, show, SplunkForwarder.service, --property=ActiveState, --value]
  register: splunk_forwarder_preflight_active
  changed_when: false
  when: splunk_forwarder_unit_loadstate.stdout != 'not-found'

- name: Create Splunk local system configuration directory only when absent
  ansible.builtin.file:
    path: /opt/splunkforwarder/etc/system/local
    state: directory
    owner: splunkfwd
    group: splunkfwd
    mode: "0750"
  when: not splunk_forwarder_path_state.system_local.get('exists', false)

- name: Create the initial administrator seed only for an uninitialized instance  # noqa: var-naming[no-role-prefix]
  ansible.builtin.template:
    src: user-seed.conf.j2
    dest: /opt/splunkforwarder/etc/system/local/user-seed.conf
    owner: splunkfwd
    group: splunkfwd
    mode: "0600"
  when: not splunk_forwarder_path_state.passwd.get('exists', false)
  register: splunk_forwarder_seed_created
  no_log: true
  diff: false

- name: Create the dedicated collector app directory
  ansible.builtin.file:
    path: /opt/splunkforwarder/etc/apps/ludus_collector/local
    state: directory
    owner: splunkfwd
    group: splunkfwd
    mode: "0750"

- name: Write collector app ownership marker
  ansible.builtin.copy:
    dest: /opt/splunkforwarder/etc/apps/ludus_collector/local/ludus-managed.conf
    content: "# Managed by ludus_splunk_collector; do not edit.\n"
    owner: splunkfwd
    group: splunkfwd
    mode: "0640"

- name: Configure monitor inputs in the role-owned app
  ansible.builtin.template:
    src: inputs.conf.j2
    dest: /opt/splunkforwarder/etc/apps/ludus_collector/local/inputs.conf
    owner: splunkfwd
    group: splunkfwd
    mode: "0640"
  notify: Restart forwarder after owned configuration changes

- name: Configure explicit cooked TCP receiver in the role-owned app
  ansible.builtin.template:
    src: outputs.conf.j2
    dest: /opt/splunkforwarder/etc/apps/ludus_collector/local/outputs.conf
    owner: splunkfwd
    group: splunkfwd
    mode: "0640"
  notify: Restart forwarder after owned configuration changes

- name: Generate the vendor-managed systemd service when absent
  ansible.builtin.command:
    argv:
      - /opt/splunkforwarder/bin/splunk
      - enable
      - boot-start
      - -systemd-managed
      - "1"
      - -user
      - splunkfwd
      - -group
      - splunkfwd
      - -systemd-unit-file-name
      - SplunkForwarder
      - --accept-license
      - --answer-yes
      - --no-prompt
  when: not splunk_forwarder_path_state.unit.get('exists', false) and splunk_forwarder_unit_loadstate.stdout == 'not-found'
  changed_when: true
  no_log: true
  diff: false

- name: Create owned systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/SplunkForwarder.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install explicit capability-reset policy for the forwarder  # noqa: var-naming[no-role-prefix]
  ansible.builtin.template:
    src: capabilities.conf.j2
    dest: /etc/systemd/system/SplunkForwarder.service.d/10-ludus-capabilities.conf
    owner: root
    group: root
    mode: "0644"
  register: splunk_forwarder_capability_policy
  notify: Restart forwarder after owned configuration changes

- name: Stop an active service before applying a changed capability policy
  ansible.builtin.systemd_service:
    name: SplunkForwarder.service
    state: stopped
  when:
    - splunk_forwarder_capability_policy.changed
    - splunk_forwarder_preflight_active.stdout | default('inactive') == 'active'

- name: Reload systemd definitions before effective unit checks
  ansible.builtin.systemd_service:
    name: SplunkForwarder.service
    daemon_reload: true

- name: Read effective generated service properties  # noqa: var-naming[no-role-prefix]
  ansible.builtin.command:
    argv: [systemctl, show, SplunkForwarder.service, "--property={{ item }}", --value]
  loop: [User, Group, FragmentPath, DropInPaths, CapabilityBoundingSet, AmbientCapabilities, NoNewPrivileges]
  register: splunk_forwarder_effective_properties
  changed_when: false

- name: Inspect effective unit fragment without following symlinks  # noqa: var-naming[no-role-prefix]
  ansible.builtin.stat:
    path: "{{ (splunk_forwarder_effective_properties.results | selectattr('item', 'equalto', 'FragmentPath') | first).stdout }}"
    follow: false
  register: splunk_forwarder_effective_fragment_stat

- name: Read effective vendor-generated unit file  # noqa: var-naming[no-role-prefix]
  ansible.builtin.slurp:
    src: "{{ (splunk_forwarder_effective_properties.results | selectattr('item', 'equalto', 'FragmentPath') | first).stdout }}"
  register: splunk_forwarder_effective_unit_content
  no_log: true

- name: Fail closed unless the effective service is non-root and capability-restricted
  ansible.builtin.assert:
    that:
      - (splunk_forwarder_effective_properties.results | selectattr('item', 'equalto', 'User') | first).stdout == 'splunkfwd'
      - (splunk_forwarder_effective_properties.results | selectattr('item', 'equalto', 'Group') | first).stdout == 'splunkfwd'
      - (splunk_forwarder_effective_properties.results | selectattr('item', 'equalto', 'FragmentPath') | first).stdout | length > 0
      - splunk_forwarder_effective_fragment_stat.stat.get('isreg', false)
      - not (splunk_forwarder_effective_fragment_stat.stat.get('islnk', false) | bool)
      - >-
        (splunk_forwarder_effective_properties.results
        | selectattr('item', 'equalto', 'DropInPaths') | first).stdout | trim
        == '/etc/systemd/system/SplunkForwarder.service.d/10-ludus-capabilities.conf'
      - (splunk_forwarder_effective_properties.results | selectattr('item', 'equalto', 'CapabilityBoundingSet') | first).stdout | trim == ''
      - (splunk_forwarder_effective_properties.results | selectattr('item', 'equalto', 'AmbientCapabilities') | first).stdout | trim == ''
      - (splunk_forwarder_effective_properties.results | selectattr('item', 'equalto', 'NoNewPrivileges') | first).stdout | trim == 'yes'
      - splunk_forwarder_effective_unit_content.content | b64decode | ludus_splunk_collector_validate_forwarder_unit_execs
    fail_msg: Refusing to start an unexpected, root-run, or capability-enabled forwarder unit.

- name: Enable and start the verified forwarder service  # noqa: var-naming[no-role-prefix]
  ansible.builtin.systemd_service:
    name: SplunkForwarder.service
    enabled: true
    state: started
  register: splunk_forwarder_service_start

- name: Apply queued forwarder restarts before readiness checks
  ansible.builtin.meta: flush_handlers

- name: Wait for the local Universal Forwarder management API over its Unix socket  # noqa: var-naming[no-role-prefix]
  ansible.builtin.uri:
    url: http://localhost:8089/services/server/info?output_mode=json
    method: GET
    unix_socket: /opt/splunkforwarder/var/run/splunk/cli.socket
    status_code: 401
    timeout: 15
    use_proxy: false
    use_netrc: false
    follow_redirects: none
    return_content: false
  register: splunk_forwarder_unauthenticated_readiness
  until: splunk_forwarder_unauthenticated_readiness.status | default(0) == 401
  retries: 60
  delay: 10

- name: Verify fresh administrator authentication over the Unix-socket management API  # noqa: var-naming[no-role-prefix]
  ansible.builtin.uri:
    url: http://localhost:8089/services/server/info?output_mode=json
    method: GET
    unix_socket: /opt/splunkforwarder/var/run/splunk/cli.socket
    user: "{{ splunk_forwarder_admin_user }}"
    password: "{{ splunk_forwarder_linux_admin_password }}"
    force_basic_auth: true
    status_code: 200
    timeout: 15
    use_proxy: false
    use_netrc: false
    follow_redirects: none
    unredirected_headers: [Authorization]
    return_content: false
  register: splunk_forwarder_auth_check
  until: splunk_forwarder_auth_check.status | default(0) == 200
  retries: 30
  delay: 10
  when: splunk_forwarder_seed_created is defined and splunk_forwarder_seed_created.changed
  no_log: true
  diff: false

- name: Confirm initialized authentication database after fresh authentication  # noqa: var-naming[no-role-prefix]
  ansible.builtin.stat:
    path: /opt/splunkforwarder/etc/passwd
  register: splunk_forwarder_passwd_after_bootstrap
  when: splunk_forwarder_seed_created is defined and splunk_forwarder_seed_created.changed

- name: Require a nonempty initialized authentication database
  ansible.builtin.assert:
    that:
      - splunk_forwarder_passwd_after_bootstrap.stat.get('exists', false)
      - splunk_forwarder_passwd_after_bootstrap.stat.get('size', 0) | int > 0
  when: splunk_forwarder_seed_created is defined and splunk_forwarder_seed_created.changed

- name: Remove only the fresh seed created by this successful invocation
  ansible.builtin.file:
    path: /opt/splunkforwarder/etc/system/local/user-seed.conf
    state: absent
  when: splunk_forwarder_seed_created is defined and splunk_forwarder_seed_created.changed
