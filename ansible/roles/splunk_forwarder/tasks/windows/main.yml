---
- name: Require explicit shared license acceptance before Windows checks or changes
  ansible.builtin.assert:
    that:
      - splunk_accept_license is boolean
      - splunk_accept_license
    fail_msg: Set splunk_accept_license to true before installing or configuring the Windows forwarder.

- name: Set Splunk UF package filename  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    splunk_forwarder_package: "splunkforwarder-{{ splunk_version }}-{{ splunk_build }}-windows-x64.msi"

- name: Check if SplunkForwarder service exists  # noqa: var-naming[no-role-prefix]
  ansible.windows.win_service:
    name: SplunkForwarder
  register: splunk_forwarder_service
  failed_when: false

- name: Set installation status  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    splunk_forwarder_installed: "{{ splunk_forwarder_service.exists | default(false) }}"

- name: Display installation status
  ansible.builtin.debug:
    msg: >-
      {{ 'Splunk UF service ' ~
         ('found' if splunk_forwarder_installed else 'not found') ~
         ' - will ' ~
         ('reconfigure' if splunk_forwarder_installed else 'install') }}

- name: Create temp directory
  ansible.windows.win_file:
    path: 'C:\Temp'
    state: directory

- name: Download Splunk UF from splunk.com (with token)
  ansible.windows.win_get_url:
    url: >-
      {{ 'https://download.splunk.com/products/universalforwarder/releases/' ~
         splunk_version ~ '/windows/' ~ splunk_forwarder_package ~ '?token=' ~ splunk_forwarder_download_token }}
    dest: 'C:\Temp\{{ splunk_forwarder_package }}'
    force: false
  when:
    - not splunk_forwarder_installed
    - splunk_forwarder_download_token | length > 0

- name: Download Splunk UF from splunk.com (no token required)
  ansible.windows.win_get_url:
    url: "https://download.splunk.com/products/universalforwarder/releases/{{ splunk_version }}/windows/{{ splunk_forwarder_package }}"
    dest: 'C:\Temp\{{ splunk_forwarder_package }}'
    validate_certs: false
    force: false
  when:
    - not splunk_forwarder_installed
    - splunk_forwarder_download_token | length == 0

- name: Build MSI install arguments  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    splunk_forwarder_msi_args: >-
      AGREETOLICENSE=yes
      SPLUNKUSERNAME={{ splunk_forwarder_admin_user }}
      SPLUNKPASSWORD={{ splunk_forwarder_windows_admin_password }}
      RECEIVING_INDEXER={{ splunk_receiver_ip }}:{{ splunk_receiver_port }}
      {% if splunk_forwarder_deployment_server | length > 0 %}DEPLOYMENT_SERVER={{ splunk_forwarder_deployment_server }}{% endif %}
  when: not splunk_forwarder_installed

- name: Install Splunk Universal Forwarder  # noqa: var-naming[no-role-prefix]
  ansible.windows.win_package:
    path: 'C:\Temp\{{ splunk_forwarder_package }}'
    product_id: "Splunk Universal Forwarder"
    arguments: "{{ splunk_forwarder_msi_args }}"
    state: present
  when: not splunk_forwarder_installed
  register: splunk_forwarder_install

# This must precede config rendering, rather than run as an end-of-play handler.
- name: Wait for installation to complete  # noqa: no-handler
  ansible.windows.win_wait_for:
    path: '{{ splunk_forwarder_install_dir }}\bin\splunk.exe'
    timeout: 120
  when: splunk_forwarder_install.changed

- name: Get SplunkForwarder service account  # noqa: var-naming[no-role-prefix]
  ansible.windows.win_service:
    name: SplunkForwarder
  register: splunk_forwarder_account_info

- name: Identify LocalSystem service identity  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    splunk_forwarder_runs_as_local_system: >-
      {{ splunk_forwarder_account_info.username | trim | lower in
         ['localsystem', 'system', 'nt authority\\system', 's-1-5-18'] }}

- name: Detect Windows domain controller role without changing host state  # noqa: var-naming[no-role-prefix]
  ansible.windows.win_powershell:
    script: |
      $computer = Get-CimInstance -ClassName Win32_ComputerSystem -ErrorAction Stop
      $Ansible.Result = [int]$computer.DomainRole -in @(4, 5)
      $Ansible.Changed = $false
  register: splunk_forwarder_is_domain_controller

- name: Resolve localized Event Log Readers group name  # noqa: var-naming[no-role-prefix]
  ansible.windows.win_powershell:
    script: |
      $group = Get-LocalGroup -SID 'S-1-5-32-573' -ErrorAction Stop
      $Ansible.Result = $group.Name
      $Ansible.Changed = $false
  register: splunk_forwarder_event_log_readers_group
  when:
    - not splunk_forwarder_is_domain_controller.result
    - not splunk_forwarder_runs_as_local_system

- name: Add SplunkForwarder service account to Event Log Readers  # noqa: var-naming[no-role-prefix]
  ansible.windows.win_group_membership:
    name: "{{ splunk_forwarder_event_log_readers_group.result }}"
    members:
      - "{{ splunk_forwarder_account_info.username }}"
    state: present
  register: splunk_forwarder_event_log_readers_membership
  when:
    - not splunk_forwarder_is_domain_controller.result
    - not splunk_forwarder_runs_as_local_system

- name: Grant SplunkForwarder account Security log access on domain controllers  # noqa: var-naming[no-role-prefix]
  ansible.windows.win_user_right:
    name: SeSecurityPrivilege
    users:
      - "{{ splunk_forwarder_account_info.username }}"
    action: add
  register: splunk_forwarder_security_privilege
  when:
    - splunk_forwarder_is_domain_controller.result
    - not splunk_forwarder_runs_as_local_system

- name: Restart SplunkForwarder after access changes
  ansible.windows.win_service:
    name: SplunkForwarder
    state: restarted
  when:
    - not splunk_forwarder_runs_as_local_system
    - (splunk_forwarder_security_privilege.changed if splunk_forwarder_is_domain_controller.result else splunk_forwarder_event_log_readers_membership.changed)
    - splunk_forwarder_start_service

- name: Ensure local config directory exists
  ansible.windows.win_file:
    path: '{{ splunk_forwarder_install_dir }}\etc\system\local'
    state: directory

- name: Create inputs.conf from template
  ansible.windows.win_template:
    src: windows-inputs.conf.j2
    dest: '{{ splunk_forwarder_install_dir }}\etc\system\local\inputs.conf'
  notify: Restart SplunkForwarder

- name: Create outputs.conf from template
  ansible.windows.win_template:
    src: windows-outputs.conf.j2
    dest: '{{ splunk_forwarder_install_dir }}\etc\system\local\outputs.conf'
  when: splunk_receiver_ip | length > 0
  notify: Restart SplunkForwarder

- name: Stop SplunkForwarder for reconfiguration  # noqa: var-naming[no-role-prefix]
  ansible.windows.win_service:
    name: SplunkForwarder
    state: stopped
  when:
    - splunk_forwarder_installed
    - splunk_forwarder_start_service
  register: splunk_forwarder_service_stop
  failed_when: false

- name: Wait for service to stop
  ansible.builtin.pause:
    seconds: 5
  when:
    - splunk_forwarder_installed
    - splunk_forwarder_start_service
    - splunk_forwarder_service_stop is defined

- name: Start SplunkForwarder after reconfiguration
  ansible.windows.win_service:
    name: SplunkForwarder
    state: started
  when:
    - splunk_forwarder_installed
    - splunk_forwarder_start_service

- name: Ensure SplunkForwarder service exists and is configured  # noqa: var-naming[no-role-prefix]
  ansible.windows.win_service:
    name: SplunkForwarder
    start_mode: auto
    state: started
  when: splunk_forwarder_start_service
  register: splunk_forwarder_service_start
  failed_when: false

- name: Handle service start failure
  ansible.builtin.debug:
    msg: "WARNING: Service failed to start. It may need manual intervention."
  when:
    - splunk_forwarder_start_service
    - splunk_forwarder_service_start.failed is defined
    - splunk_forwarder_service_start.failed

- name: Verify service is running  # noqa: var-naming[no-role-prefix]
  ansible.windows.win_service:
    name: SplunkForwarder
  register: splunk_forwarder_final_service_status
  failed_when: false

- name: Display Splunk UF installation info
  ansible.builtin.debug:
    msg: |
      Splunk Universal Forwarder {{ 'installed' if not splunk_forwarder_installed else 'configured' }} successfully!
      Install path: {{ splunk_forwarder_install_dir }}
      Forwarding to: {{ splunk_receiver_ip }}:{{ splunk_receiver_port }}
      Service status: {{ splunk_forwarder_final_service_status.state | default('unknown') }}
      Configured inputs: {{ splunk_forwarder_inputs | map(attribute='name') | list | join(', ') }}
