---
- name: Reject unsupported collector operating systems before either platform branch
  ansible.builtin.assert:
    that: ansible_system in ['Win32NT', 'Linux']
    fail_msg: This collector supports only its declared Linux and Windows target branches.

- name: Validate and configure the Windows Universal Forwarder collector
  ansible.builtin.import_tasks: windows/main.yml
  when: ansible_system == 'Win32NT'

- name: Validate and configure the Linux Universal Forwarder collector
  become: true
  when: ansible_system == 'Linux'
  block:
    - name: Validate platform and role inputs before mutation
      ansible.builtin.import_tasks: validate.yml

    - name: Inspect existing collector state and reject conflicts
      ansible.builtin.import_tasks: inspect.yml

    - name: Download and install the exact verified forwarder package
      ansible.builtin.import_tasks: install.yml

    - name: Configure and bootstrap the collector
      ansible.builtin.import_tasks: configure.yml
