---
- name: Create a protected package cache directory
  ansible.builtin.file:
    path: /var/cache/ludus-splunk-collector
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: splunk_forwarder_installed.rc != 0

- name: Download Universal Forwarder with publisher checksum verification
  ansible.builtin.get_url:
    url: "{{ splunk_forwarder_package_url }}"
    dest: /var/cache/ludus-splunk-collector/splunkforwarder.deb
    checksum: "{{ splunk_forwarder_package_checksum }}"
    owner: root
    group: root
    mode: "0600"
    validate_certs: true
    force: false
  when: splunk_forwarder_installed.rc != 0

- name: Read Debian package identity using explicit metadata fields  # noqa: var-naming[no-role-prefix]
  ansible.builtin.command:
    argv:
      - dpkg-deb
      - -W
      - "--showformat=${Package}\\n${Version}\\n${Architecture}\\n"
      - /var/cache/ludus-splunk-collector/splunkforwarder.deb
    expand_argument_vars: false
  register: splunk_forwarder_deb_metadata
  changed_when: false
  when: splunk_forwarder_installed.rc != 0

- name: Require exact Universal Forwarder package identity and version
  ansible.builtin.assert:
    that:
      - splunk_forwarder_deb_metadata.stdout_lines | length == 3
      - splunk_forwarder_deb_metadata.stdout_lines[0] == 'splunkforwarder' and splunk_forwarder_deb_metadata.stdout_lines[2] == 'amd64'
      - splunk_forwarder_deb_metadata.stdout_lines[1] == splunk_version
    fail_msg: The checksum-verified artifact is not the requested splunkforwarder amd64 package/version.
  when: splunk_forwarder_installed.rc != 0

- name: Create dedicated Universal Forwarder service group
  ansible.builtin.group:
    name: splunkfwd
    system: true
    state: present
  when: splunk_forwarder_installed.rc != 0

- name: Create dedicated non-root Universal Forwarder service user
  ansible.builtin.user:
    name: splunkfwd
    group: splunkfwd
    home: /opt/splunkforwarder
    create_home: false
    system: true
    shell: /usr/sbin/nologin
    state: present
  when: splunk_forwarder_installed.rc != 0

- name: Install the verified local package without implicit upgrades or downgrades
  ansible.builtin.apt:
    deb: /var/cache/ludus-splunk-collector/splunkforwarder.deb
    state: present
    allow_downgrade: false
  when: splunk_forwarder_installed.rc != 0

- name: Confirm installed package status and exact version  # noqa: var-naming[no-role-prefix]
  ansible.builtin.command:
    argv: [dpkg-query, -W, "-f=${db:Status-Status}\\t${Version}\\n", splunkforwarder]
    expand_argument_vars: false
  register: splunk_forwarder_final_package
  changed_when: false
  failed_when: >-
    splunk_forwarder_final_package.rc != 0
    or splunk_forwarder_final_package.stdout.split('\t') | length != 2
    or splunk_forwarder_final_package.stdout.split('\t')[0] != 'installed'
    or splunk_forwarder_final_package.stdout.split('\t')[1] != splunk_version

- name: Inspect newly installed application home without following symlinks  # noqa: var-naming[no-role-prefix]
  ansible.builtin.stat:
    path: /opt/splunkforwarder
    follow: false
  register: splunk_forwarder_fresh_home
  when: splunk_forwarder_installed.rc != 0

- name: Require newly installed application home to be a real directory
  ansible.builtin.assert:
    that:
      - splunk_forwarder_fresh_home.stat.get('exists', false)
      - splunk_forwarder_fresh_home.stat.get('isdir', false)
      - not (splunk_forwarder_fresh_home.stat.get('islnk', false) | bool)
  when: splunk_forwarder_installed.rc != 0

- name: Set ownership of the newly installed application tree
  ansible.builtin.file:
    path: /opt/splunkforwarder
    state: directory
    owner: splunkfwd
    group: splunkfwd
    recurse: true
  when: splunk_forwarder_installed.rc != 0
