---
- name: Restart forwarder after owned configuration changes
  become: true
  ansible.builtin.systemd_service:
    name: SplunkForwarder.service
    state: restarted
  when:
    - splunk_forwarder_preflight_active.stdout | default('inactive') == 'active'
    - not (splunk_forwarder_capability_policy.changed | default(false))

- name: Restart SplunkForwarder
  ansible.windows.win_service:
    name: SplunkForwarder
    state: restarted
    force_dependent_services: true
  when: splunk_forwarder_start_service
