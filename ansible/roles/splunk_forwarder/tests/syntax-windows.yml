---
# Static parsing of the actual dev1 Windows forwarder entrypoint; no runtime proof.
# Intentionally refuse ordinary execution outside the authorized Ludus deployment.
- name: Parse dev1 Windows forwarder installation and event inputs
  hosts: dev1_win11
  gather_facts: false
  pre_tasks:
    - name: Refuse execution of this static parser target
      ansible.builtin.fail:
        msg: Use the authorized Ludus deployment, not this syntax-only playbook.
  vars:
    splunk_version: "10.6.1.1"
    splunk_build: b2ae2962645c
    splunk_accept_license: true
    splunk_receiver_ip: "10.5.10.11"
    splunk_forwarder_inputs:
      - name: "WinEventLog://Security"
        index: wineventlog
      - name: "WinEventLog://Microsoft-Windows-Sysmon/Operational"
        index: sysmon
        sourcetype: "XmlWinEventLog:Microsoft-Windows-Sysmon/Operational"
      - name: "WinEventLog://Microsoft-Windows-PowerShell/Operational"
        index: wineventlog
  roles:
    - role: dotknewt.splunk_forwarder
