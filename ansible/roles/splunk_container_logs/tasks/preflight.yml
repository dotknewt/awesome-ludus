---
- name: Require exactly one supported mode scalar
  ansible.builtin.assert:
    that:
      - splunk_container_logs_mode is string
      - splunk_container_logs_mode in ['docker', 'kubernetes']
    fail_msg: >-
      splunk_container_logs_mode must be exactly one scalar: docker or kubernetes.

- name: Validate shared HEC transport and bounded queue inputs
  block:
    - name: Validate shared HEC transport and bounded queue inputs
      ansible.builtin.assert:
        that:
          - splunk_container_logs_owner_id is string
          - splunk_container_logs_owner_id | length > 0
          - splunk_container_logs_owner_id is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
          - splunk_container_logs_hec_endpoint is string
          - splunk_container_logs_hec_endpoint | length > 0
          - splunk_container_logs_hec_endpoint | urlsplit('hostname') | length > 0
          - splunk_container_logs_hec_endpoint | urlsplit('path') == '/services/collector/event'
          - splunk_container_logs_hec_endpoint | urlsplit('query') | length == 0
          - splunk_container_logs_hec_endpoint | urlsplit('fragment') | length == 0
          - splunk_container_logs_hec_endpoint | urlsplit('username') is none
          - splunk_container_logs_hec_endpoint | urlsplit('password') is none
          - splunk_container_logs_hec_endpoint.startswith('https://') or
            (splunk_container_logs_hec_endpoint.startswith('http://') and
             splunk_container_logs_allow_insecure_http)
          - splunk_container_logs_hec_index is string
          - splunk_container_logs_hec_index | length > 0
          - splunk_container_logs_hec_token is string
          - splunk_container_logs_hec_token | length > 0 or
            (splunk_container_logs_mode == 'kubernetes' and
             splunk_container_logs_k8s_existing_secret | length > 0)
          - splunk_container_logs_tls_verify is boolean
          - splunk_container_logs_allow_insecure_http is boolean
          - splunk_container_logs_ca_file is string
          - splunk_container_logs_start_at in ['end', 'beginning']
          - (splunk_container_logs_queue_size | splunk_container_queue_size) is integer
          - (splunk_container_logs_queue_max_disk_mib | splunk_container_queue_disk_mib) is integer
          - splunk_container_logs_mode != 'docker' or
            (splunk_container_logs_collector_url is string and
             splunk_container_logs_collector_url.startswith('https://'))
        fail_msg: >-
          Supply an exact HEC event endpoint, nonempty index/token, explicit HTTP
          permission where needed, valid TLS controls, and positive bounded queues.
      no_log: true
  rescue:
    - name: Diagnose shared HEC input validation failure without exposing values
      block:
        - name: Evaluate fixed shared HEC input diagnostics
          action: splunk_container_logs_input_diagnostics
          register: splunk_container_logs_input_diagnostics_result
          no_log: true
        - name: Publish the sanitized shared HEC input diagnostic report
          ansible.builtin.debug:
            msg: "{{ splunk_container_logs_input_diagnostics_result.report }}"
          no_log: false
      rescue:
        - name: Report fixed shared HEC diagnostic evaluation error
          ansible.builtin.debug:
            msg: Input diagnostics unavailable (evaluation_error).
          no_log: false
      always:
        - name: Fail after reporting rejected shared HEC input
          ansible.builtin.fail:
            msg: Shared HEC input validation failed; no role changes were made.
          no_log: true

- name: Inspect an optional collector CA file
  ansible.builtin.stat:
    path: "{{ splunk_container_logs_ca_file }}"
  register: splunk_container_logs_ca_status
  when:
    - splunk_container_logs_ca_file | length > 0
    - splunk_container_logs_mode == 'docker' or
      splunk_container_logs_k8s_existing_secret | length == 0

- name: Require a readable regular collector CA file
  ansible.builtin.assert:
    that:
      - splunk_container_logs_ca_status.stat.exists
      - splunk_container_logs_ca_status.stat.isreg
      - splunk_container_logs_ca_status.stat.readable | default(false)
    fail_msg: splunk_container_logs_ca_file must be a readable regular file
  when:
    - splunk_container_logs_ca_file | length > 0
    - splunk_container_logs_mode == 'docker' or
      splunk_container_logs_k8s_existing_secret | length == 0
