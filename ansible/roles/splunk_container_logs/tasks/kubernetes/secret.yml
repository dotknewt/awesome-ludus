---
- name: Inspect the selected Secret read-only
  kubernetes.core.k8s_info:
    kubeconfig: "{{ splunk_container_logs_kubeconfig }}"
    context: "{{ splunk_container_logs_kube_context }}"
    api_version: v1
    kind: Secret
    namespace: "{{ splunk_container_logs_k8s_namespace }}"
    name: "{{ splunk_container_logs_k8s_secret_name }}"
  register: splunk_container_logs_secret_info
  when: splunk_container_logs_namespace_info.resources | length == 1
  no_log: true

- name: Require the existing Secret namespace
  ansible.builtin.assert:
    that: splunk_container_logs_namespace_info.resources | length == 1
    fail_msg: existing Secret mode requires its managed namespace
  when: splunk_container_logs_k8s_existing_secret | length > 0
  no_log: true

- name: Require the existing Secret token key
  ansible.builtin.assert:
    that:
      - splunk_container_logs_secret_info.resources | length == 1
      - splunk_container_logs_secret_info.resources.0.data.splunk_platform_hec_token is defined
    fail_msg: existing Secret must contain splunk_platform_hec_token
  when:
    - splunk_container_logs_k8s_existing_secret | length > 0
    - splunk_container_logs_namespace_info.resources | length == 1
  no_log: true

- name: Reject an unowned role Secret destination
  ansible.builtin.assert:
    that:
      - splunk_container_logs_secret_info.resources | length == 0 or
        (splunk_container_logs_secret_info.resources.0.metadata.annotations |
         default({})).get('ludus.splunk/owner-id', '') == splunk_container_logs_owner_id
      - splunk_container_logs_secret_info.resources | length == 0 or
        (splunk_container_logs_secret_info.resources.0.metadata.annotations |
         default({})).get('ludus.splunk/cluster-name', '') ==
        splunk_container_logs_k8s_cluster_name
    fail_msg: role Secret destination exists without matching managed ownership
  when:
    - splunk_container_logs_k8s_existing_secret | length == 0
    - splunk_container_logs_namespace_info.resources | length == 1
  no_log: true

- name: Read an optional caller-token CA for the owned Secret
  ansible.builtin.slurp:
    src: "{{ splunk_container_logs_ca_file }}"
  register: splunk_container_logs_k8s_ca_raw
  when:
    - splunk_container_logs_k8s_existing_secret | length == 0
    - splunk_container_logs_ca_file | length > 0
  no_log: true

- name: Normalize the desired token and CA as strict base64 inputs
  ansible.builtin.set_fact:
    splunk_container_logs_k8s_token_b64: >-
      {{ splunk_container_logs_secret_info.resources.0.data.splunk_platform_hec_token
         if splunk_container_logs_k8s_existing_secret | length > 0
         else splunk_container_logs_hec_token | b64encode }}
    splunk_container_logs_k8s_ca_b64: >-
      {{ splunk_container_logs_secret_info.resources.0.data.splunk_platform_hec_ca_file | default('')
         if splunk_container_logs_k8s_existing_secret | length > 0
         else (splunk_container_logs_k8s_ca_raw | default({})).get('content', '') }}
  no_log: true

- name: Strictly validate credentials and derive a nonplaintext rollout digest
  ansible.builtin.set_fact:
    splunk_container_logs_k8s_credential_contract: >-
      {{ splunk_container_logs_k8s_token_b64 |
         splunk_k8s_credential_contract(splunk_container_logs_k8s_ca_b64) }}
  no_log: true

- name: Record only nonsecret credential render inputs
  ansible.builtin.set_fact:
    splunk_container_logs_k8s_use_custom_ca: >-
      {{ splunk_container_logs_k8s_credential_contract.has_ca }}
    splunk_container_logs_k8s_credential_digest: >-
      {{ splunk_container_logs_k8s_credential_contract.digest }}
  no_log: true

- name: Refuse check mode for an unrendered fresh installation
  ansible.builtin.assert:
    that:
      - splunk_container_logs_namespace_info.resources | length == 1
      - splunk_container_logs_release_info.status is defined
    fail_msg: >-
      Check mode cannot validate render or diff for an absent namespace or
      release; fresh-install planning remains unvalidated until an authorized
      normal invocation creates the managed destination.
  when: ansible_check_mode
  no_log: true
