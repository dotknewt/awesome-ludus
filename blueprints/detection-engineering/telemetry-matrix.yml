---
schema_version: 1
sources:
  - &source_defaults
    id: gitlab-auth
    boundary: host
    vm_role: gitlab
    class: os_authentication
    path_or_input: /var/log/auth.log
    reader: forwarder
    index: de_linux
    sourcetype: linux:auth
    safe_fields: [_time, host, source, sourcetype, message]
    negative_fields: []
    required: true
    capability_gate: null
  - <<: *source_defaults
    id: gitlab-system
    class: system
    path_or_input: /var/log/syslog
    sourcetype: linux:system
  - <<: *source_defaults
    id: gitlab-audit-laurel
    class: audit_process
    path_or_input: /var/log/laurel/audit.log
    sourcetype: linux:audit:laurel
    safe_fields: [_time, host, source, sourcetype]
    negative_fields: []
  - <<: *source_defaults
    id: runner-auth
    vm_role: runner
  - <<: *source_defaults
    id: runner-system
    vm_role: runner
    class: system
    path_or_input: /var/log/syslog
    sourcetype: linux:system
  - <<: *source_defaults
    id: runner-audit-laurel
    vm_role: runner
    class: audit_process
    path_or_input: /var/log/laurel/audit.log
    sourcetype: linux:audit:laurel
    safe_fields: [_time, host, source, sourcetype]
    negative_fields: []
  - <<: *source_defaults
    id: workload-auth
    vm_role: workload
  - <<: *source_defaults
    id: workload-system
    vm_role: workload
    class: system
    path_or_input: /var/log/syslog
    sourcetype: linux:system
  - <<: *source_defaults
    id: workload-audit-laurel
    vm_role: workload
    class: audit_process
    path_or_input: /var/log/laurel/audit.log
    sourcetype: linux:audit:laurel
    safe_fields: [_time, host, source, sourcetype]
    negative_fields: []
  - <<: *source_defaults
    id: splunk-auth
    vm_role: splunk
    reader: splunk_local
  - <<: *source_defaults
    id: splunk-system
    vm_role: splunk
    class: system
    path_or_input: /var/log/syslog
    reader: splunk_local
    sourcetype: linux:system
  - <<: *source_defaults
    id: splunk-audit-laurel
    vm_role: splunk
    class: audit_process
    path_or_input: /var/log/laurel/audit.log
    reader: splunk_local
    sourcetype: linux:audit:laurel
    safe_fields: [_time, host, source, sourcetype]
    negative_fields: []
  - <<: *source_defaults
    id: runner-registration
    vm_role: runner
    class: runner_registration
    path_or_input: /var/log/detection-engineering/runner-registration.jsonl
    index: de_runner
    sourcetype: gitlab:runner:registration
    capability_gate: capabilities.runner_api
  - <<: *source_defaults
    id: splunk-internal
    vm_role: splunk
    class: splunk_service
    path_or_input: $SPLUNK_HOME/var/log/splunk/*.log
    reader: splunk_local
    index: _internal
    sourcetype: splunk:native
    capability_gate: capabilities.splunk
  - <<: *source_defaults
    id: workload-docker-container
    vm_role: workload
    class: docker_container
    path_or_input: /var/lib/docker/containers/*/*-json.log
    reader: otel_host
    index: de_runtime
    sourcetype: docker:container
    capability_gate: capabilities.otel
  - <<: *source_defaults
    id: minikube-api-audit
    boundary: node
    vm_role: workload
    class: kubernetes_audit
    path_or_input: capabilities.otel.observed.audit_path
    reader: otel_cluster
    index: de_runtime
    sourcetype: kube:audit
    negative_fields: [request_body, response_body]
    capability_gate: capabilities.otel
  - <<: *source_defaults
    id: minikube-node-service
    boundary: node
    vm_role: workload
    class: kubernetes_node
    path_or_input: systemd:kubelet
    reader: otel_cluster
    index: de_runtime
    sourcetype: kube:node
    capability_gate: capabilities.otel
  - <<: *source_defaults
    id: minikube-container
    boundary: node
    vm_role: workload
    class: kubernetes_container
    path_or_input: /var/log/containers/*.log
    reader: otel_cluster
    index: de_runtime
    sourcetype: kube:container
    capability_gate: capabilities.otel
