      version: 0.80.0
      digest: sha256:35b3be7684e81cb247a10bb9c9001845ac39ed4d373512f04d3d9dc7bce439a6
    detection_otel_contract:
      secret_file_provider: true
      audit_path: /var/log/kubernetes/audit/audit.log
      node_log_inputs:
      - /var/log/containers/*.log
      - /var/log/pods/kube-system_*/*/*.log
      required_rbac:
        nodes:
        - get
        - list
        - watch
        pods:
        - get
        - list
        - watch
    detection_workload_user: debian
    detection_workload_home: /home/debian
    detection_kubeconfig_path: /home/debian/.kube/config
    detection_minikube_home: /home/debian/.minikube
    detection_audit_policy_stage_path: /home/debian/.minikube/files/etc/kubernetes/audit-policy.yaml
    detection_cluster_name: '{{ range_id }}-minikube'
    detection_splunk_hec_url: http://{{ range_id }}-splunk:8088/services/collector/event
    detection_runtime_token_state: present
    detection_splunk_hec_handoff:
      delegate_host: '{{ range_id }}-splunk'
      source_path: /etc/detection-engineering/secrets/hec-workload.token
      input_path: /opt/splunk/etc/apps/detection_hec/local/inputs.conf
      service_name: Splunkd.service
ludus_extensions:
  detection_engineering_contract:
    stage: SAVE_READY_RANGE_CONFIGURATION
    offline_contract_status: IMPLEMENTED
    lifecycle_gates:
      initial_provisioning:
        requires:
        - selected_product_contract
        - template_metadata
        - capacity_decision
        - ludus_network
        - protected_inputs
      provisioning_time:
        checks:
        - existing_debian_login_and_home
        - guest_capture_interface
        - selected_product_installation_and_bootstrap
        - native_producers
      post_provisioning_runtime_acceptance:
        required: true
        checks:
        - services
        - APIs
        - runner_pause_and_zero_jobs
        - telemetry_delivery
        - cleanup
    gate_file: verified-inputs.yml
    telemetry_matrix: telemetry-matrix.yml
    target_inventory_policy:
      collection_method: MCP
      collection_stage: PREDEPLOYMENT
      required_for:
      - DEPLOYMENT
      not_required_for:
      - OFFLINE_CONTRACT_VALIDATION
      - ROLE_DEVELOPMENT
      automatic_action: false
    new_range_requirement:
      required: false
      stage: NOT_APPLICABLE_EXISTING_EMPTY_RANGE
      existing_range_reuse: AUTHORIZED_THRUNT_ONLY
      creation_authorized: false
      automatic_action: false
    cluster_name_template: '{{ range_id }}-minikube'
    planned_vms:
    - identity_suffix: gitlab
      vm_name_template: '{{ range_id }}-gitlab'
      host_id_template: '{{ range_id }}-gitlab'
      ram_gb: 8
      cpus: 4
      vlan: 10
      ip_last_octet: 11
    - identity_suffix: runner
      vm_name_template: '{{ range_id }}-runner'
      host_id_template: '{{ range_id }}-runner'
      ram_gb: 8
      cpus: 4
      vlan: 10
      ip_last_octet: 12
    - identity_suffix: malcolm
      vm_name_template: '{{ range_id }}-malcolm'
      host_id_template: '{{ range_id }}-malcolm'
      ram_gb: 64
      cpus: 8
      vlan: 10
      ip_last_octet: 13
    - identity_suffix: splunk
      vm_name_template: '{{ range_id }}-splunk'
      host_id_template: '{{ range_id }}-splunk'
      ram_gb: 12
      cpus: 4
      vlan: 10
      ip_last_octet: 14
    - identity_suffix: workload
      vm_name_template: '{{ range_id }}-workload'
      host_id_template: '{{ range_id }}-workload'
      ram_gb: 16
      cpus: 6
      vlan: 10
      ip_last_octet: 15
    mapping_source_schema:
      planned_vm:
        identity_suffix:
          type: enum[gitlab,runner,malcolm,splunk,workload]
        host_id_template:
          type: range_template[str]
        ip_last_octet:
          type: int
        provisioning_user:
          type: linux_user
          required_at: RANGE_FILE_MATERIALIZATION
          value: debian
        lab_ip:
          type: str
          derive:
            operation: derive_lab_ip
            inputs:
            - target_inputs.network.observed.lab_cidr
            - planned_vm.ip_last_octet
        dependencies:
          gitlab:
            host_id_template:
              type: range_template[str]
              derive:
                operation: lookup_dependency_host
                role: gitlab
          splunk:
            host_id_template:
              type: range_template[str]
              derive:
                operation: lookup_dependency_host
                role: splunk
            hec_url:
              type: url
              derive:
                operation: build_dependency_url
                role: splunk
                scheme: http
                port: 8088
                path: /services/collector/event
    forwarder_source_policy:
      common:
      - id_suffix: auth
        path: /var/log/auth.log
        index: de_linux
        sourcetype: linux:auth
      - id_suffix: system
        path: /var/log/syslog
        index: de_linux
        sourcetype: linux:system
      - id_suffix: audit-laurel
        path: /var/log/laurel/audit.log
        index: de_linux
        sourcetype: linux:audit:laurel
      profiles:
        gitlab:
          required_ids: []
        runner:
          required_ids:
          - runner-registration
          registration_path: /var/log/detection-engineering/runner-registration.jsonl
        workload:
          required_ids: []
    artifact_layout_policy:
      formats:
      - raw
      - tar.gz
      raw_member: null
      tar_member_match: exact_one_regular
      reject_member_types:
      - symlink
      - hardlink
      - device
      - fifo
      - socket
      reject_member_paths:
      - absolute
      - traversal
      - duplicate
      staging: private_stream_selected_member
      extractall: false
      version_verification: role_owned_command_and_parser
    role_variable_contracts:
      linux_logging:
        detection_linux_host_id:
          source: planned_vm.host_id_template
          type: range_template[str]
        detection_laurel_artifact:
          operation: project_runtime_artifact
          inputs:
            artifact:
              source: product_pins.downloads.laurel.observed
          type: RuntimeArtifact
        detection_laurel_read_user:
          operation: map_laurel_read_user
          inputs:
            profile:
              source: planned_vm.identity_suffix
          type: enum[splunkfwd,splunk]
        detection_laurel_rotate_size:
          value: 5000000
          type: int
        detection_laurel_rotate_generations:
          value: 10
          type: int
      splunk:
        detection_splunk_artifact:
          source: product_pins.downloads.splunk.observed
          type: Artifact
        detection_splunk_download_auth_path:
          source: runtime_secret.splunk_download_auth_path
          type: str|null
        detection_splunk_license:
          source: product_pins.capabilities.splunk.observed
          type: SplunkTrialCapability
        detection_splunk_hec_supported:
          source: product_pins.capabilities.splunk.observed.hec
          type: bool
        detection_splunk_search_api_supported:
          source: product_pins.capabilities.splunk.observed.search_api
          type: bool
        detection_splunk_bind_ip:
          operation: derive_lab_ip
          inputs:
            lab_cidr:
              source: target_inputs.network.observed.lab_cidr
            ip_last_octet:
              source: planned_vm.ip_last_octet
          type: str
        detection_splunk_admin_password:
          source: runtime_secret.splunk_admin_password
          type: str
        detection_splunk_restore_authorized:
          value: false
          type: bool
        detection_splunk_maintenance_state_path:
          value: /var/lib/detection-engineering/splunk-maintenance-state.json
          type: absolute_path
        detection_splunk_admin_username:
          value: debian
          type: str
      forwarder:
        detection_forwarder_artifact:
          source: product_pins.downloads.forwarder.observed
          type: Artifact
        detection_forwarder_download_auth_path:
          source: runtime_secret.forwarder_download_auth_path
          type: str|null
        detection_forwarder_bootstrap_contract:
          source: product_pins.capabilities.forwarder_bootstrap_contract
          type: ForwarderBootstrapGate
        detection_forwarder_profile:
          source: planned_vm.identity_suffix
          type: enum[gitlab,runner,workload]
        detection_forwarder_inputs:
          operation: project_forwarder_inputs
          inputs:
            telemetry_sources:
              source: contract.telemetry_matrix.sources
            policy:
              source: contract.forwarder_source_policy
            profile:
              source: planned_vm.identity_suffix
          type: list[ForwarderInput]
        detection_splunk_receiver_host:
          operation: lookup_dependency_host
          inputs:
            planned_vms:
              source: contract.planned_vms
            role:
              value: splunk
          type: range_template[str]
        detection_splunk_receiver_port:
          value: 9997
          type: int
      gitlab:
        detection_gitlab_packages:
          source: product_pins.apt.gitlab.observed.packages
          type: list[PackagePin]
        detection_gitlab_repository_url:
          source: product_pins.apt.gitlab.observed.repository_url
          type: https_url
        detection_gitlab_signing_key_url:
          source: product_pins.apt.gitlab.observed.signing_key_url
          type: https_url
        detection_gitlab_signing_key_fingerprint:
          source: product_pins.apt.gitlab.observed.signing_key_fingerprint
          type: str
        detection_gitlab_external_url:
          operation: build_dependency_url
          inputs:
            planned_vms:
              source: contract.planned_vms
            role:
              value: gitlab
            scheme:
              value: http
            port:
              value: 80
            path:
              value: /
          type: url
        detection_gitlab_readiness_contract:
          source: product_pins.capabilities.gitlab_readiness_contract.observed
          type: GitLabReadinessContract
        detection_runner_api_contract:
          source: product_pins.capabilities.runner_api.observed
          type: RunnerApiContract
      runner:
        detection_runner_packages:
          source: product_pins.apt.runner.observed.packages
          type: list[PackagePin]
        detection_runner_repository_url:
          source: product_pins.apt.runner.observed.repository_url
          type: https_url
        detection_runner_signing_key_url:
          source: product_pins.apt.runner.observed.signing_key_url
          type: https_url
        detection_runner_signing_key_fingerprint:
          source: product_pins.apt.runner.observed.signing_key_fingerprint
          type: str
        detection_runner_description:
          source: planned_vm.host_id_template
          type: range_template[str]
        detection_gitlab_host:
          operation: lookup_dependency_host
          inputs:
            planned_vms:
              source: contract.planned_vms
            role:
              value: gitlab
          type: range_template[str]
        detection_runner_api_contract:
          source: product_pins.capabilities.runner_api.observed
          type: RunnerApiContract
        detection_gitlab_readiness_contract:
          source: product_pins.capabilities.gitlab_readiness_contract.observed
          type: GitLabReadinessContract
        detection_runner_jobs_contract:
          source: product_pins.capabilities.runner_jobs_contract.observed
          type: RunnerJobsContract
      workload:
        detection_docker_packages:
          operation: combine_apt_package_gates
          inputs:
            docker_gate: &id001
              source: product_pins.apt.docker
            containerd_gate: &id002
              source: product_pins.apt.containerd
            docker_plugins_gate: &id003
              source: product_pins.apt.docker_plugins
          type: list[PackagePin]
        detection_docker_repository_url:
          operation: project_combined_apt_field
          inputs:
            docker_gate: *id001
            containerd_gate: *id002
            docker_plugins_gate: *id003
            field:
              value: repository_url
          type: https_url
        detection_docker_signing_key_url:
          operation: project_combined_apt_field
          inputs:
            docker_gate: *id001
            containerd_gate: *id002
            docker_plugins_gate: *id003
            field:
              value: signing_key_url
          type: https_url
        detection_docker_signing_key_fingerprint:
          operation: project_combined_apt_field
          inputs:
            docker_gate: *id001
            containerd_gate: *id002
            docker_plugins_gate: *id003
            field:
              value: signing_key_fingerprint
          type: str
        detection_minikube_artifact:
          operation: project_runtime_artifact
          inputs:
            artifact:
              source: product_pins.downloads.minikube.observed
          type: RuntimeArtifact
        detection_kubectl_artifact:
          operation: project_runtime_artifact
          inputs:
            artifact:
              source: product_pins.downloads.kubectl.observed
          type: RuntimeArtifact
        detection_helm_artifact:
          operation: project_runtime_artifact
          inputs:
            artifact:
              source: product_pins.downloads.helm.observed
          type: RuntimeArtifact
        detection_otel_host_artifact:
          source: product_pins.downloads.otel_host.observed
          type: Artifact
        detection_runtime_artifact_layouts:
          operation: bind_artifact_layouts
          inputs:
            minikube_artifact_gate:
              source: product_pins.downloads.minikube
            kubectl_artifact_gate:
              source: product_pins.downloads.kubectl
            helm_artifact_gate:
              source: product_pins.downloads.helm
            otel_host_artifact_gate:
              source: product_pins.downloads.otel_host
            minikube_layout_gate:
              source: product_pins.artifact_layouts.minikube
            kubectl_layout_gate:
              source: product_pins.artifact_layouts.kubectl
            helm_layout_gate:
              source: product_pins.artifact_layouts.helm
            otel_host_layout_gate:
              source: product_pins.artifact_layouts.otel_host
          type: ArtifactLayoutGateMap
        detection_otel_chart:
          source: product_pins.charts.otel.observed
          type: HelmChartPin
        detection_otel_contract:
          source: product_pins.capabilities.otel.observed
          type: OtelContract
        detection_workload_user:
          value: debian
          type: linux_user
        detection_cluster_name:
          source: contract.cluster_name_template
          type: range_template[str]
        detection_splunk_hec_url:
          operation: build_dependency_url
          inputs:
            planned_vms:
              source: contract.planned_vms
            role:
              value: splunk
            scheme:
              value: http
            port:
              value: 8088
            path:
              value: /services/collector/event
          type: url
        detection_splunk_hec_handoff:
          value:
            delegate_host: '{{ range_id }}-splunk'
            source_path: /etc/detection-engineering/secrets/hec-workload.token
            input_path: /opt/splunk/etc/apps/detection_hec/local/inputs.conf
            service_name: Splunkd.service
          type: SplunkHecHandoff
        detection_runtime_token_state:
          source: runtime_secret.hec_workload.state
          type: enum[present,absent]
      malcolm:
        ludus_install_malcolm_user:
          source: planned_vm.provisioning_user
          type: linux_user
        ludus_install_malcolm_install_dir:
          source: role_defaults.ludus_install_malcolm.install_dir
          type: absolute_path
        ludus_install_malcolm_version:
          source: product_pins.git.malcolm.observed.tag
          type: str
        ludus_install_malcolm_commit:
          source: product_pins.git.malcolm.observed.commit
          type: hex40
        ludus_install_malcolm_venv_dir:
          source: role_defaults.ludus_install_malcolm.venv_dir
          type: absolute_path
        ludus_install_malcolm_admin_username:
          source: runtime_secret.malcolm_admin_username
          type: str
        ludus_install_malcolm_admin_password:
          source: runtime_secret.malcolm_admin_password
          type: str
        ludus_install_malcolm_capture_enabled:
          value: true
          type: bool
        ludus_install_malcolm_capture_interface:
          source: provisioning_time.guest_capture_interface_discovery
          type: str
        ludus_install_malcolm_capture_filter:
          source: role_defaults.ludus_install_malcolm.capture_filter
          type: str
        ludus_install_malcolm_capture_rotation_megabytes:
          source: role_defaults.ludus_install_malcolm.capture_rotation_megabytes
          type: int
        ludus_install_malcolm_capture_rotation_minutes:
          source: role_defaults.ludus_install_malcolm.capture_rotation_minutes
          type: int
        ludus_install_malcolm_image_pull_timeout_seconds:
          source: role_defaults.ludus_install_malcolm.image_pull_timeout_seconds
          type: int
        ludus_install_malcolm_start_timeout_seconds:
          source: role_defaults.ludus_install_malcolm.start_timeout_seconds
          type: int
        ludus_install_malcolm_stop_timeout_seconds:
          source: role_defaults.ludus_install_malcolm.stop_timeout_seconds
          type: int
        ludus_install_malcolm_readiness_timeout_seconds:
          source: role_defaults.ludus_install_malcolm.readiness_timeout_seconds
          type: int
        ludus_install_malcolm_health_poll_interval_seconds:
          source: role_defaults.ludus_install_malcolm.health_poll_interval_seconds
          type: int
        ludus_install_malcolm_tls_dhparam_size:
          source: role_defaults.ludus_install_malcolm.tls_dhparam_size
          type: int
        ludus_install_malcolm_systemd_unit_path:
          source: role_defaults.ludus_install_malcolm.systemd_unit_path
          type: absolute_path
        ludus_install_malcolm_tcp_retries2:
          source: role_defaults.ludus_install_malcolm.tcp_retries2
          type: int|null
    save_readiness: READY
    deployment_authorization: NOT_GRANTED
  detection_engineering_publication:
    mode: public-save
    save_ready: true
    contains_protected_credentials: false
    deployment_authorized: false
    runtime_acceptance: PENDING_POST_PROVISIONING
    provisioning_time_checks:
    - existing_debian_account_and_home
    - guest_capture_interface_discovery_and_validation
    - selected_product_installation_and_bootstrap
    - native_producer_and_service_readiness
    post_provisioning_acceptance_checks:
    - gitlab_external_readiness
    - runner_registered_paused_and_zero_jobs
    - splunk_hec_search_and_authentication
    - telemetry_delivery_and_packet_visibility
    - credential_cleanup_and_final_service_state
    post_provisioning_acceptance_required: true
    target_range:
      name: thrunt
      range_number: 3
      range_cidr: 10.3.0.0/16
      state: NEVER_DEPLOYED
      vm_count: 0
      testing: false
    target_network:
      range_cidr: 10.3.0.0/16
      lab_cidr: 10.3.10.0/24
      host_bridge: vmbr3
      host_bridge_promiscuous_mode: USER_MANAGED_NOT_A_PROVISIONING_GATE
    unresolved_execution_facts:
    - capacity
    - target_range.source.observed_at
    - templates.gitlab
    - templates.malcolm
    - templates.runner
    - templates.splunk
    - templates.workload
    warning: Saving this configuration does not authorize apply or deployment.
    application_password_placeholders:
    - ludus_install_malcolm_admin_password
    - detection_splunk_admin_password
