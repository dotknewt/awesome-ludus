# yaml-language-server: $schema=https://docs.ludus.cloud/schemas/range-config.json
---
ludus:
- vm_name: '{{ range_id }}-gitlab'
  hostname: '{{ range_id }}-gitlab'
  template: debian-12-x64-server-template
  vlan: 10
  ip_last_octet: 11
  ram_gb: 8
  cpus: 4
  linux:
    packages:
    - acl
    - auditd
    - ca-certificates
    - curl
    - gnupg
    - logrotate
    - python3
    - rsyslog
  roles:
  - ludus_detection_gitlab
  - name: ludus_detection_forwarder_pipeline
    depends_on:
    - vm_name: '{{ range_id }}-splunk'
      role: ludus_detection_splunk
  role_vars:
    detection_linux_host_id: '{{ range_id }}-gitlab'
    detection_laurel_artifact:
      version: 0.6.3
      url: https://github.com/threathunters-io/laurel/releases/download/v0.6.3/laurel-v0.6.3-x86_64-glibc.tar.gz
      sha256: 110fd0436cb492fafab2ee68fcae681e611488baf376657ff9eab875608ceb6c
      download_auth_required: false
    detection_laurel_read_user: splunkfwd
    detection_laurel_rotate_size: 5000000
    detection_laurel_rotate_generations: 10
    detection_forwarder_artifact:
      version: 10.6.1.1
      build: b2ae2962645c
      url: https://download.splunk.com/products/universalforwarder/releases/10.6.1.1/linux/splunkforwarder-10.6.1.1-b2ae2962645c-linux-amd64.deb
      sha256: c2ff5b4f53dce3f245231044291a9732a141099c24dabfe32d565e1487e4707e
      download_auth_required: false
    detection_forwarder_bootstrap_contract:
      status: VERIFIED
      source:
        url: https://download.splunk.com/products/universalforwarder/releases/10.6.1.1/linux/splunkforwarder-10.6.1.1-b2ae2962645c-linux-amd64.deb
        observed_at: '2026-10-18T16:33:55Z'
      observed:
        version: 10.6.1.1
        build: b2ae2962645c
        seed:
          path: /opt/splunkforwarder/etc/system/local/user-seed.conf
          section: user_info
          username_key: USERNAME
          username: admin
          password_key: PASSWORD
          mode: '0600'
          owner: splunkfwd
          group: splunkfwd
        first_start:
          identity: splunkfwd
          argv:
          - start
          - --accept-license
          - --answer-yes
          - --no-prompt
        boot_start:
          identity: root
          argv:
          - enable
          - boot-start
          - -user
          - splunkfwd
          - --accept-license
          - --answer-yes
          - --no-prompt
        unit:
          path: /etc/systemd/system/SplunkForwarder.service
          service_name: SplunkForwarder.service
          effective_user: splunkfwd
      limitation: Package scripts, configuration specifications, launcher strings, and default unit identity were inspected statically; first start and generated unit remain runtime acceptance work.
      stops:
      - 4
      - 8
      - 9
      - 10
    detection_forwarder_download_auth_path: null
    detection_forwarder_profile: gitlab
    detection_forwarder_inputs:
    - path: /var/log/auth.log
      index: de_linux
      sourcetype: linux:auth
      safe_fields:
      - _time
      - host
      - source
      - sourcetype
      - message
    - path: /var/log/syslog
      index: de_linux
      sourcetype: linux:system
      safe_fields:
      - _time
      - host
      - source
      - sourcetype
      - message
    - path: /var/log/laurel/audit.log
      index: de_linux
      sourcetype: linux:audit:laurel
      safe_fields:
      - _time
      - host
      - source
      - sourcetype
    detection_splunk_receiver_host: '{{ range_id }}-splunk'
    detection_splunk_receiver_port: 9997
    detection_gitlab_packages:
    - name: gitlab-ce
      version: 19.4.2-ce.0
    detection_gitlab_repository_url: https://packages.gitlab.com/gitlab/gitlab-ce/debian/bookworm
    detection_gitlab_signing_key_url: https://packages.gitlab.com/gpg.key
    detection_gitlab_signing_key_fingerprint: F6403F6544A38863DAA0B6E03F01618A51312F3F
    detection_runner_api_contract:
      bootstrap_auth:
        credential_type: personal_access_token
        scopes:
        - create_runner
        - manage_runner
        - read_api
        expiration_days: 1
        creation_argv:
        - gitlab-rails
        - runner
        - '-'
        protected_path: /etc/detection-engineering/secrets/runner-api-bootstrap.token
        mode: '0600'
        revoke_endpoint: /api/v4/personal_access_tokens/self
        revoke_method: DELETE
      manager:
        runner_type: instance_type
        create_scope: create_runner
        manage_scope: manage_runner
        read_scope: read_api
        create_endpoint: /api/v4/user/runners
        create_method: POST
        lookup_endpoint: /api/v4/runners/all
        lookup_method: GET
        detail_endpoint: /api/v4/runners/:id
        detail_method: GET
        update_endpoint: /api/v4/runners/:id
        update_method: PUT
        request_fields:
        - runner_type
        - description
        - paused
        response_token_field: token
        local_verify_command:
        - gitlab-runner
        - verify
        pause_at_create: true
    detection_gitlab_external_url: http://{{ range_id }}-gitlab:80/
    detection_gitlab_readiness_contract:
      transport_base_url: http://localhost
      endpoint: /-/readiness
      method: GET
      success_statuses:
      - 200
      attempts: 60
      delay_seconds: 5
