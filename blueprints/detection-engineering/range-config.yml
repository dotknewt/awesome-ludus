# yaml-language-server: $schema=https://docs.ludus.cloud/schemas/range-config.json
---
defaults:
  snapshot_with_RAM: true
  stale_hours: 0
  timezone: Europe/Oslo

ludus:

  - vm_name: '{{ range_id }}-splunk'
    hostname: '{{ range_id }}-splunk'
    template: debian-13.5-x64-server-no-template
    vlan: 10
    ip_last_octet: 14
    ram_gb: 12
    cpus: 4
    linux:
      packages:
      - acl
      - auditd
      - ca-certificates
      - curl
      - gnupg
      - logrotate
      - python3
      - rsyslog
    roles:
      - ludus_detection_splunk

  - vm_name: "{{ range_id }}-pcap"
    hostname: "{{ range_id }}-pcap"
    template: debian-13.5-x64-server-no-template
    vlan: 10
    ip_last_octet: 200
    ram_gb: 64
    cpus: 8
    linux: true
    roles:
      - ludus_install_malcolm
    role_vars:
      # Malcolm webGUI credentials; replace outside this lab.
      ludus_install_malcolm_admin_username: thrunt
      ludus_install_malcolm_admin_password: "thrunt"
      ludus_install_malcolm_capture_enabled: true

  - vm_name: "{{ range_id }}-cluster"
    hostname: "{{ range_id }}-cluster"
    template: debian-13.5-x64-server-no-template
    vlan: 10
    ip_last_octet: 16
    ram_gb: 16
    cpus: 6
    linux:
      packages:
        - vim # optional
        - curl
        - ca-certificates
        - bash-completion # optional
        - ncat
        - apache2
        - php
        - libapache2-mod-php
    roles:
      - role_linux_logging
      - ludus_install_minikube
      - role_splunk_collector_linuxv
      - name: role_k8s_telemetry_collection
        depends_on:
          - vm_name: "DC"
            role: role_splunk_hec_validate
    role_vars:
      k8s_cluster_name: "minkube"
      k8s_splunk_index: "kube"
      ludus_k8s_splunk_hec_token: "b448817b-e664-4fce-93fa-79d0c90ba57"
      ludus_k8s_splunk_server_ip: "10.{{ range_second_octet }}.10.11" # Calculate Splunk server IP based on VLAN and octet


router:
  vm_name: "{{ range_id }}-router"
  hostname: "{{ range_id }}-router"
  template: debian-13.5-x64-server-no-template

network:
  inter_vlan_default: ACCEPT
  external_default: ACCEPT
  always_blocked_networks:
    - 192.168.0.0/16
    - 172.16.0.0/12
  rules:
    - name: Allow all VLANs out to internet using any protocol and port
      vlan_src: all
      vlan_dst: public
      protocol: all
      ports: all
      action: ACCEPT
