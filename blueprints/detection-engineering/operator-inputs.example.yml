---
# Target facts are separate from protected runtime inputs. BLOCKED gates may be
# public-save/private-save record unresolved execution facts without blocking file creation;
# deployment mode still refuses every deployment gate.
schema_version: 4
target_range:
  status: BLOCKED
  source: {kind: USER_PROVIDED, reference: replace-with-target-range-evidence, observed_at: '1970-01-01T00:00:00Z'}
  observed: null
  limitation: Resolve the exact target range identity, CIDR, state, VM count, and testing state.
  required_for_deployment: true
  unresolved: [target_range]
templates:
  gitlab: &template_gate
    status: BLOCKED
    source: {kind: LUDUS_API_READ, reference: replace-with-template-inventory-evidence, observed_at: '1970-01-01T00:00:00Z'}
    observed: null
    limitation: Resolve the exact built Linux template OS, release, architecture, and inherited disk.
    required_for_deployment: true
    unresolved: [template]
  runner: *template_gate
  malcolm: *template_gate
  splunk: *template_gate
  workload: *template_gate
capacity:
  status: BLOCKED
  source: {kind: LUDUS_API_READ, reference: replace-with-capacity-evidence, observed_at: '1970-01-01T00:00:00Z'}
  observed: null
  limitation: Record capacity facts and a separately reviewed deployment-sufficiency decision; no fixed CPU or disk formula is implied.
  required_for_deployment: true
  unresolved: [capacity, deployment_sufficient]
network:
  status: BLOCKED
  source: {kind: LUDUS_API_READ, reference: replace-with-network-evidence, observed_at: '1970-01-01T00:00:00Z'}
  observed: null
  limitation: Resolve the target-bound range/lab CIDRs and numeric range host bridge. Guest and Docker firewall policy is out of scope.
  required_for_deployment: true
  unresolved: [network]
provisioning_identity:
  status: BLOCKED
  source: {kind: USER_PROVIDED, reference: replace-with-selected-existing-template-login, observed_at: '1970-01-01T00:00:00Z'}
  observed: null
  limitation: Select an existing template login and HOME; never encode or mutate its password here.
  required_for_deployment: true
  unresolved: [user, home]
role_inventory:
  status: PRESENCE_OBSERVED_CONTENT_VERIFICATION_WAIVED
  source: {kind: COMPOSITE, reference: replace-with-role-name-inventory-plus-user-waiver, observed_at: null}
  observed:
    present_roles:
      - ludus_detection_forwarder
      - ludus_detection_forwarder_pipeline
      - ludus_detection_gitlab
      - ludus_detection_linux_logging
      - ludus_detection_runner
      - ludus_detection_splunk
      - ludus_detection_workload
      - ludus_install_malcolm
      - ludus_install_docker
      - ludus_install_minikube
    collections:
      - {name: ansible.posix, version: 2.2.2}
      - {name: community.crypto, version: 3.5.0}
      - {name: community.general, version: 10.3.0}
    content_verification: USER_WAIVED_NOT_VERIFIED
  waiver: {decision: USER_WAIVED_ROLE_VERSION_AND_CONTENT_COMPARISON, recorded_on: '2026-10-19'}
  limitation: Required role and collection names remain contract dependencies; role versions and contents are explicitly not verified by user direction.
  required_for_deployment: false
  unresolved: []
