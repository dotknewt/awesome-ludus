# yaml-language-server: $schema=https://docs.ludus.cloud/schemas/range-config.json
---
global_role_vars:
  splunk_version: "10.6.1.1"
  splunk_build: "b2ae2962645c"
  splunk_accept_license: true
  splunk_receiver_ip: "10.{{ range_second_octet }}.10.11"
  splunk_receiver_port: 9997

ludus:
  - vm_name: "{{ range_id }}-splunk"
    hostname: "{{ range_id }}-splunk"
    template: no-debian-13.5-x64-server-template
    linux: true
    cpus: 4
    ram_gb: 16
    vlan: 10
    ip_last_octet: 11
    roles:
      - dotknewt.ludus_splunk_server

  - vm_name: "{{ range_id }}-malcolm"
    hostname: "{{ range_id }}-malcolm"
    template: no-debian-13.5-x64-server-template
    linux: true
    cpus: 8
    ram_gb: 64
    vlan: 10
    ip_last_octet: 17
    roles:
      - dotknewt.ludus_install_malcolm
      - dotknewt.splunk_forwarder
      - dotknewt.ludus_linux_logging

  - vm_name: "{{ range_id }}-gitlab"
    hostname: "{{ range_id }}-gitlab"
    template: no-debian-13.5-x64-server-template
    linux: true
    cpus: 4
    ram_gb: 8
    vlan: 10
    ip_last_octet: 18
    roles:
      - dotknewt.ludus_gitlab_ce
      - dotknewt.ludus_linux_logging
      - dotknewt.splunk_forwarder

  - vm_name: "{{ range_id }}-win11"
    hostname: "{{ range_id }}-win11"
    template: no-windows-11-22h2-x64-enterprise-template
    windows: {}
    cpus: 2
    ram_gb: 4
    vlan: 10
    ip_last_octet: 21
    roles:
      - dotknewt.ludus_install_sysmon
      - dotknewt.splunk_forwarder
    role_vars:
      splunk_forwarder_inputs:
        - name: "WinEventLog://Security"
          index: winlogs
        - name: "WinEventLog://Microsoft-Windows-Sysmon/Operational"
          index: sysmon
          sourcetype: "XmlWinEventLog:Microsoft-Windows-Sysmon/Operational"
