# yaml-language-server: $schema=https://docs.ludus.cloud/schemas/range-config.json

defaults:
  snapshot_with_RAM: true
  stale_hours: 0
  timezone: Europe/Oslo

global_role_vars:
  splunk_version: 10.6.1.1
  splunk_build: b2ae2962645c
  splunk_accept_license: true
  splunk_receiver_ip: 10.{{ range_second_octet }}.10.10
  splunk_receiver_port: 9997

ludus:
  - vm_name: '{{ range_id }}-pcap'
    hostname: '{{ range_id }}-pcap'
    template: no-debian-13.5-x64-server-template
    linux: true
    vlan: 10
    ip_last_octet: 17
    ram_gb: 64
    cpus: 8
    roles:
      - linux_malcolm
      - linux_logging

  - vm_name: '{{ range_id }}-splunksrv'
    hostname: '{{ range_id }}-splunksrv'
    template: no-debian-13.5-x64-server-template
    linux: true
    vlan: 10
    ip_last_octet: 10
    ram_gb: 8
    cpus: 4
    roles:
      - linux_splunk_server

  - vm_name: '{{ range_id }}-gitlab'
    hostname: '{{ range_id }}-gitlab'
    template: no-debian-13.5-x64-server-template
    linux: true
    vlan: 10
    ip_last_octet: 18
    ram_gb: 8
    cpus: 4
    roles:
      - name: splunk_forwarder
        depends_on:
          - vm_name: '{{ range_id }}-splunksrv'
            role: linux_splunk_server
      - name: linux_logging
        depends_on:
          - vm_name: '{{ range_id }}-gitlab'
            role: splunk_forwarder
    role_vars:
      ludus_linux_logging_read_users:
        - splunkfwd

  - vm_name: '{{ range_id }}-ubuntu'
    hostname: '{{ range_id }}-ubuntu'
    template: no-ubuntu-26.04.1-x64-desktop-template
    linux: true
    vlan: 10
    ip_last_octet: 20
    ram_gb: 8
    cpus: 2
    roles:
      - name: splunk_forwarder
        depends_on:
          - vm_name: '{{ range_id }}-splunksrv'
            role: linux_splunk_server
      - name: linux_logging
        depends_on:
          - vm_name: '{{ range_id }}-ubuntu'
            role: splunk_forwarder
    role_vars:
      ludus_linux_logging_read_users:
        - splunkfwd
      splunk_forwarder_monitors:
        - path: /var/log/laurel/audit.log
          sourcetype: laurel:json
          index: main

  - vm_name: '{{ range_id }}-windows'
    hostname: '{{ range_id }}-windows'
    template: no-windows-11-25h2-x64-enterprise-template
    windows: {}
    vlan: 10
    ip_last_octet: 30
    ram_gb: 16
    cpus: 4
    roles:
      - windows_sysmon
      - name: splunk_forwarder
        depends_on:
          - vm_name: '{{ range_id }}-splunksrv'
            role: linux_splunk_server
          - vm_name: '{{ range_id }}-windows'
            role: windows_sysmon
    role_vars:
      splunk_forwarder_inputs:
        - name: WinEventLog://Security
          index: wineventlog
        - name: WinEventLog://System
          index: wineventlog
        - name: WinEventLog://Application
          index: wineventlog
        - name: WinEventLog://Microsoft-Windows-Sysmon/Operational
          index: sysmon
          sourcetype: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational

router:
  template: no-debian-13.5-x64-server-template
