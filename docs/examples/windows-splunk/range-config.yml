# yaml-language-server: $schema=https://docs.ludus.cloud/schemas/range-config.json
---
# Illustrative only. See README.md: template and installed-role identities
# require confirmation on the target Ludus server before use.
global_role_vars:
  splunk_version: "10.6.1.1"
  splunk_build: "b2ae2962645c"
  splunk_accept_license: true
  splunk_receiver_ip: REPLACE_WITH_RESOLVABLE_SPLUNK_SERVER_ADDRESS
  splunk_receiver_port: 9997

ludus:
  - vm_name: "{{ range_id }}-splunk"
    hostname: "{{ range_id }}-splunk"
    template: REPLACE_WITH_AVAILABLE_DEBIAN_13_TEMPLATE
    vlan: 10
    ip_last_octet: 10
    ram_gb: 8
    cpus: 4
    linux: true
    roles:
      - ludus_splunk_server

  - vm_name: "{{ range_id }}-win11"
    hostname: "{{ range_id }}-WIN11"
    template: REPLACE_WITH_AVAILABLE_WINDOWS_11_X64_TEMPLATE
    vlan: 10
    ip_last_octet: 11
    ram_gb: 8
    cpus: 4
    windows: {}
    roles:
      - ludus_install_sysmon
      - name: dotknewt.splunk_forwarder
        depends_on:
          - vm_name: "{{ range_id }}-splunk"
            role: ludus_splunk_server
          - vm_name: "{{ range_id }}-win11"
            role: ludus_install_sysmon
    role_vars:
      splunk_forwarder_inputs:
        - name: "WinEventLog://Security"
          index: winlogs
        - name: "WinEventLog://Microsoft-Windows-Sysmon/Operational"
          index: sysmon
          sourcetype: "XmlWinEventLog:Microsoft-Windows-Sysmon/Operational"
